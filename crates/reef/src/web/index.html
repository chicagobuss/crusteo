<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16161a">
<title>Skiff</title>
<style>
:root {
  --bg: #f6f6f8; --surface: #ffffff; --surface2: #eeeef2; --text: #17171c; --muted: #6b6b76;
  --faint: #9a9aa4; --border: #dcdce2; --accent: #3b6cf6; --warn: #c27c00; --bad: #d13b3b;
  --run: #2f8f5b; --sel: #e6ecff; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --pace: #2b7fd1; --idle: oklch(0.68 0.07 255);
  /* A map lane: stone, so the white of a fresh tile and the blue of idle both show. */
  --block: #d9d5ce;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114; --surface: #1b1b20; --surface2: #25252c; --text: #ececf1; --muted: #a0a0ab;
    --faint: #6e6e78; --border: #2f2f37; --accent: #7b9dff; --warn: #f0b13a; --bad: #ff6b6b;
    --run: #4cc38a; --sel: #23283a; --pace: #79c0ff; --idle: oklch(0.56 0.07 255);
    --block: #25252c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
/* No back or forward from a sideways trackpad swipe: here it opens the list. */
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .55; cursor: default; }
button.on, button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--bad); }
button.plain { background: none; border: none; padding: 4px 6px; color: var(--accent); }
button.icon { background: none; border: none; padding: 4px 6px; line-height: 0; color: var(--muted); }
button.icon.off { opacity: .45; }
button.small { padding: 2px 8px; font-size: 13px; }
/* An on/off switch: a track with a knob that slides right when on. */
button.switch { position: relative; flex-shrink: 0; width: 46px; height: 28px; padding: 0; border-radius: 14px; }
button.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--muted); transition: transform .15s, background .15s; }
button.switch.on::after { transform: translateX(18px); background: #fff; }
select, input, textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; min-width: 0; }
[hidden] { display: none !important; }
.chips { display: flex; gap: 4px; overflow: hidden; margin-top: 3px; }
.chip { --c: var(--faint); flex-shrink: 0; font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px; color: var(--c);
  background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); }
.block.tinted { background: color-mix(in srgb, var(--c) 9%, var(--block)); border-color: color-mix(in srgb, var(--c) 40%, var(--border)); }
.block.tinted .name { color: #111; background: color-mix(in srgb, var(--c) 55%, white); }
@media (prefers-color-scheme: dark) { .block.tinted .name { color: #fff; background: color-mix(in srgb, var(--c) 50%, black); } }
/* Map */
#mappane { flex: 1; }
.app.map { flex-direction: column; }
.app.map #listpane { flex: 0 0 auto; }
.app.map #listscroll { display: none; }
.map { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: var(--bg); }
.mboard { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.mboard.fly { transition: transform .28s ease; }
.block { position: absolute; border-radius: 10px; background: var(--block); border: 1px solid var(--border);
  transition: left .4s, top .4s, width .4s, height .4s; overflow: hidden; }
/* A group's name on a strip of its colour, dark or light text by theme so
   it reads at a glance; two lines rather than cut off in a narrow block. */
.block .name { position: absolute; left: 4px; top: 3px; right: 4px; padding: 1px 6px; border-radius: 6px;
  font-size: 13px; line-height: 16px; font-weight: 650; color: var(--text);
  background: color-mix(in srgb, var(--muted) 16%, transparent);
  overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.block .name .n { font-weight: 500; opacity: .7; }
.block.waiting .name { right: 30px; }
/* A label raised to a band: its lanes inside one frame, its name on top. */
.band { position: absolute; border-radius: 12px; border: 2px solid var(--border); background: color-mix(in srgb, var(--muted) 8%, transparent);
  transition: left .4s, top .4s, width .4s, height .4s; }
.band .name { position: absolute; left: 8px; right: 8px; top: 2px; font-size: 12px; line-height: 16px; font-weight: 700;
  letter-spacing: .02em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band.tinted { border-color: color-mix(in srgb, var(--c) 60%, var(--border)); background: color-mix(in srgb, var(--c) 14%, transparent); }
.band.tinted .name { color: color-mix(in srgb, var(--c) 70%, var(--text)); }
.mlane .lanehead .bandbtn { font-size: 12.5px; font-weight: 500; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); }
.mlane .lanehead .bandbtns { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.block .badge { position: absolute; right: 4px; top: 2px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px;
  background: var(--warn); color: #111; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
/* Idle is a muted blue, not grey, so it stays apart from the grey of age. */
.tile { --st: var(--idle); position: absolute; border-radius: 3px; transition: left .4s, top .4s, width .4s, height .4s; }
/* Two colours split on the diagonal: the agent's state above, and below
   how fresh it is (--age, set per tile). */
.mboard .tile { background: linear-gradient(135deg, var(--st) 50%, var(--age, var(--st)) 50%); }
.tile.s-needs_input { --st: var(--warn); } .tile.s-failed { --st: var(--bad); } .tile.s-running { --st: var(--run); }
.tile.s-done { --st: color-mix(in srgb, var(--idle) 55%, var(--surface2)); }
.tile.s-running { animation: pulse 1.6s ease-in-out infinite; }
/* The agent just left, on coming back out to the whole map. */
.tile.found { z-index: 1; animation: found .7s ease-in-out 2; }
@keyframes found { 50% { box-shadow: 0 0 0 3px var(--accent), 0 0 12px 4px var(--accent); } }
/* The key to the tiles' ages, a strip over the map until dismissed; the
   help button brings it back. */
.agekey { flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  padding: 2px 4px 2px 12px; border-bottom: 1px solid var(--border); }
.agekey span { white-space: nowrap; }
.agekey i { display: block; flex: 0 1 160px; min-width: 40px; height: 8px; border-radius: 2px; }
.agekey .grow { flex: 1; }
.tile.ask::after { content: "!"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800;
  font-size: 70%; color: #111; }
@keyframes pulse { 50% { opacity: .45; } }
.mlane { position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y; background: var(--bg); -webkit-overflow-scrolling: touch;
  transition: opacity .2s; }
.mlane .lanehead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--bg); border-bottom: 1px solid var(--border); font-weight: 600; }
.mlane .lanehead .n { color: var(--faint); font-weight: 400; }
/* A group's agents up close: a box each, coloured by state as its tile is,
   its age along the bottom, newest activity first. */
.mbox { --st: var(--idle); position: absolute; box-sizing: border-box; border-radius: 10px; padding: 8px 10px 11px;
  display: flex; flex-direction: column; gap: 2px; overflow: hidden; cursor: pointer; }
/* Under the lane's class, so the page's solid state colours (.s-failed and
   the rest, for dots) do not paint over the box. */
.mlane .mbox { background: color-mix(in srgb, var(--st) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--st) 50%, var(--border)); }
.mbox::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--age, transparent); }
.mbox.s-needs_input { --st: var(--warn); } .mlane .mbox.s-needs_input { border: 2px solid var(--warn); } .mbox.s-failed { --st: var(--bad); }
.mbox.s-running { --st: var(--run); } .mbox.s-done { --st: color-mix(in srgb, var(--idle) 55%, var(--surface2)); }
.mbox .name { font-weight: 650; font-size: 14px; line-height: 1.25; overflow: hidden; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mbox .line { margin-top: auto; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbox .host { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbox.flash { animation: flash 1.2s ease 2; }
.mlane .lanehead { flex-wrap: wrap; }
.mlane .lanehead .resort { flex-basis: 100%; margin: 2px -12px -8px; }
.mcard { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
  overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.mcard .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.mcard .line { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcard .reply { color: var(--text); opacity: .8; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mcard.flash { animation: flash 1.2s ease 2; }
@keyframes flash { 50% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); } }
.mnear { position: absolute; z-index: 5; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column; transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease, border-radius .25s; }
.mnear.full { border-radius: 0; border: none; }
.mnear #convpane { flex: 1; border: none; min-height: 0; touch-action: pan-y; }
/* The map takes selection away so a drag pans; a conversation opened on
   it gives it back, to copy from (a long press on a phone). */
.mnear #convscroll { user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; }
.mtools { position: absolute; z-index: 4; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 6px;
  align-items: center; }
.minimap { position: absolute; z-index: 4; left: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); width: 84px; pointer-events: auto;
  background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.minimap i { position: absolute; background: var(--faint); opacity: .5; border-radius: 1px; }
.minimap i.on { background: var(--accent); opacity: .8; }
.minimap b { position: absolute; border: 1.5px solid var(--accent); border-radius: 2px; }

/* Top bar: the one row over everything. Skiff's boat, the hosts, the
   map/list switch, then the view's options, a new agent and settings. */
.top { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 5px) 10px 5px;
  border-bottom: 1px solid var(--border); background: var(--bg); }
.top .brand { flex-shrink: 0; width: 30px; height: 30px; line-height: 0; cursor: pointer; }
/* About: the boat large, then what it is. */
.about .hero { display: flex; gap: 14px; align-items: center; padding: 12px 0 10px; border-bottom: 1px solid var(--border); }
.about .hero .boat { flex-shrink: 0; width: 88px; height: 88px; }
.about .hero .boat svg { width: 100%; height: 100%; }
.about .hero .name { font-size: 22px; font-weight: 700; }
.about .fact .k { flex-basis: 70px; }
.top .brand svg { width: 100%; height: 100%; }
.top .grow { flex: 1; min-width: 0; font-size: 12px; color: var(--bad); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top button.icon { padding: 5px; position: relative; }
.top button.icon.on { color: var(--accent); }
/* The options button's count of filters in use. */
.top button.icon .n { position: absolute; right: 0; top: 0; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 10px; line-height: 15px; font-weight: 700; }
.views { flex-shrink: 0; display: flex; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.views button { display: flex; align-items: center; gap: 4px; border: none; border-radius: 0; background: none; padding: 4px 10px;
  font-size: 13px; color: var(--muted); line-height: 20px; }
.views button + button { border-left: 1px solid var(--border); }
.views button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.views .count { min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px;
  line-height: 18px; font-weight: 700; text-align: center; }
.views .count:empty { display: none; }
@media (max-width: 420px) {
  .top { gap: 4px; padding-left: 8px; padding-right: 6px; }
  .views button { padding: 4px 8px; }
  .top .dots { gap: 3px; padding: 4px 2px; }
  .top .dots i { width: 7px; height: 7px; }
}
.dots { display: flex; gap: 4px; align-items: center; background: none; border: none; padding: 4px 6px; min-width: 0; overflow: hidden; }
.top .dots { display: grid; grid-auto-flow: column; align-content: center; }
.top .dots.two { grid-template-rows: repeat(2, auto); }
.dots i { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; display: block; background: var(--faint); }
.dots i.online { background: var(--run); } .dots i.connecting { background: var(--warn); }
.dots i.offline, .dots i.refused { background: var(--bad); }

/* Panes */
.app { position: relative; flex: 1; min-height: 0; display: flex; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#listpane { flex: 1; }
#convpane { flex: 1; border-left: 1px solid var(--border); }
.app.phone #listpane, .app.phone #convpane { flex: 1; border: none; }
.scroll { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
.placeholder { color: var(--faint); text-align: center; padding-top: 30vh; }

/* The view's options, under the top bar while open: the map's and the
   list's filters, the map's grouping and bands, and its key. */
.controls { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border);
  background: var(--bg); }
.controls input { flex: 1 1 140px; }
.controls select { flex: 0 1 auto; }
#listbody { padding: 4px 12px 24px; }
.row { display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 4px 8px 10px; margin: 6px 0; cursor: pointer; }
.row.sel { background: var(--sel); border-color: var(--accent); }
.row .body { flex: 1; min-width: 0; }
.row .top1 { display: flex; gap: 8px; align-items: baseline; }
.row .title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .when { color: var(--faint); font-size: 12px; flex-shrink: 0; }
.row .line { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A background workspace's agent: Paseo's word, muted, on the line it has. */
.bgtag { font-size: 11px; line-height: 14px; padding: 0 4px; border-radius: 3px; border: 1px solid var(--faint); color: var(--faint); }
.row .reply { color: var(--text); opacity: .8; }
/* A subagent's parent: muted, a link to it. */
.parent { color: var(--muted); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.parent:hover { color: var(--accent); }
.row .parent { display: block; width: fit-content; max-width: 100%; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.row .ask { color: var(--warn); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--faint); }
.s-needs_input { background: var(--warn); } .s-failed { background: var(--bad); } .s-running { background: var(--run); }
.empty, .note { color: var(--muted); text-align: center; padding: 24px 0; }
.more { display: block; margin: 8px auto; }

/* Conversation pane */
/* Text on the left in three rows; on the right, two rows of things to tap: the actions, then the labels. */
.convhead { flex-shrink: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) clamp(132px, 38%, 360px);
  align-items: center; gap: 4px 6px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--border); }
.convhead .headtext { grid-column: 2; grid-row: 1 / 3; min-width: 0; }
.convhead h2 { margin: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.convhead h2 .dot, .panel .phead h3 .dot { width: 9px; height: 9px; margin-right: 7px; vertical-align: 2px; }
.convhead h2 .dot.s-running, .panel .phead h3 .dot.s-running { animation: pulse 1.6s ease-in-out infinite; }
/* The left of the header opens the agent's details. */
.convhead .headtext { cursor: pointer; }
.convhead .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.convhead #back { grid-column: 1; grid-row: 1 / 3; width: 36px; height: 36px; margin-left: -8px; padding: 0; display: grid; place-items: center; }
.convhead .headside { display: contents; }
.convhead .acts { grid-column: 3; grid-row: 1; align-self: start; display: flex; justify-content: flex-end; gap: 2px; margin: -2px -4px 0 0; }
.convhead .acts button.icon { padding: 5px; }
.convhead .tagrow { grid-column: 3; grid-row: 2; align-self: end; display: flex; align-items: center; gap: 2px; min-width: 0; }
/* Few labels sit at the right under the actions; more than fit are cut, and the chevron shows the rest. */
.convhead .tagrow .chips { flex: 0 1 auto; min-width: 0; margin: 0 0 0 auto; cursor: pointer; }
.convhead .tagrow .chip { font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 10px; }
.convhead #convmore { flex: 0 0 auto; margin: -4px -4px -4px 0; padding: 4px; color: var(--accent); }
/* Open, the labels get a full-width row of their own under everything. */
.convhead.full .tagrow { grid-column: 2 / 4; grid-row: 3; align-items: flex-end; }
.convhead.full .tagrow .chips { flex: 1 1 auto; margin: 0; flex-wrap: wrap; }
.convhead.full #convmore svg { transform: rotate(180deg); }
.mlane .lanehead .plain { display: flex; align-items: center; gap: 2px; padding: 4px 6px 4px 0; }
.measure { max-width: 80ch; margin: 0 auto; padding: 8px 16px 16px; }
.turn { margin: 14px 0; }
.item { margin: 6px 0; overflow-wrap: anywhere; }
.user { background: var(--surface2); border-radius: 12px; padding: 8px 12px; margin-left: 12%; white-space: pre-wrap; }
.shots { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; white-space: normal; }
.shots:last-child { margin-bottom: 2px; }
.shots img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); cursor: zoom-in; }
/* An image in a reply: as wide as it is, at most the column. */
.rimg { display: block; max-width: 100%; max-height: 60vh; margin: 6px 0; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); cursor: zoom-in; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.9); display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
/* A swipe back: what is being left follows the finger. */
.swiping { will-change: transform; box-shadow: -8px 0 24px rgba(0,0,0,.25); }
/* A swipe left: the conversation leaves that way, over Recent. */
.swiping.leftward { box-shadow: 8px 0 24px rgba(0,0,0,.25); }
#convpane.leftward { position: relative; z-index: 6; background: var(--bg); }
/* The list: every agent in one flat list, over the map; under a
   conversation opened from it, or while a swipe brings it in. */
.recent { position: absolute; inset: 0; z-index: 7; background: var(--bg); }
.recent.under { z-index: 4; }
.recenthead { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 12px 4px 4px; width: 100%;
  max-width: 760px; margin: 0 auto; }
.recenthead .n { margin-left: auto; color: var(--faint); font-size: 13px; }
.recenthead #recentback { flex-shrink: 0; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; }
/* How the list is looked at: unseen, newest first, or blocked. */
.modes { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.modes button { flex-shrink: 0; font-size: 13px; line-height: 18px; padding: 4px 11px; border-radius: 15px; background: none; color: var(--muted); }
.modes button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
  color: var(--accent); }
.modes button .c { margin-left: 4px; font-weight: 700; }
#recentbody { max-width: 760px; margin: 0 auto; padding: 2px 12px 24px; }
#recentbody .empty .more { margin-top: 12px; }
/* Not looked at since its last turn: a blue dot by the name, on rows,
   boxes and tiles alike. */
.row .new { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; align-self: center; }

.sev-critical { color: var(--bad); } .sev-warn { color: var(--warn); } .sev-on_pace { color: var(--pace); }

.error { color: var(--bad); font-size: 13px; margin-top: 4px; }

<body>
<div class="top">
  <span class="brand" id="brand" role="img" aria-label="Skiff"></span>
  <button class="dots" id="dots" aria-label="Hosts"></button>
  <div class="views" role="group" aria-label="View">
    <button id="view-map" class="on" title="The map" aria-label="Map"><span class="i"></span></button>
    <button id="view-list" title="Every agent in a list (L)" aria-label="List"><span class="i"></span><span class="count" id="unseen-count"></span></button>
  </div>
  <span class="grow" id="down"></span>
  <button class="ugauge" id="usage" aria-label="Usage" hidden></button>
  <button class="icon" id="options" aria-label="View options" title="Filters, grouping and the key"></button>
  <button class="icon accent" id="new" aria-label="New agent" title="New agent"></button>
  <button class="icon" id="gear" aria-label="Settings"></button>
</div>
<div class="controls" id="controls" hidden>
  <input id="query" type="search" placeholder="Search" autocomplete="off">
  <select id="group" aria-label="Group"></select>
  <select id="host" aria-label="Host"></select>
  <select id="label" aria-label="Label"></select>
  <select id="bands" aria-label="Bands" hidden></select>
  <select id="state" aria-label="State"></select>
  <select id="background" aria-label="Background workspaces"></select>
  <button id="keytoggle" title="The key to the tiles' colours">Key</button>
</div>
<div class="app phone" id="app">
  <!-- Only for signing in. -->
  <section class="pane" id="listpane">
    <div class="scroll" id="listscroll"><div id="listbody"></div></div>
  </section>
  <section class="pane" id="convpane" hidden>
    <div class="convhead">
      <button class="plain" id="back" aria-label="Back"></button>
      <div class="headtext"><h2 id="title"></h2><div class="meta" id="convmeta"></div>
        <div class="convsub" id="convsub" hidden><span class="spec" id="convspec"></span><span class="ctx" id="convctx" hidden></span></div></div>
      <div class="headside">
        <div class="acts">
          <button class="icon" id="bell" aria-label="Notifications for this agent"></button>
          <button class="icon" id="labels" aria-label="Labels" title="Labels"></button>
          <button class="icon" id="archive" aria-label="Archive" title="Archive"></button>
          <button class="icon" id="delete" aria-label="Delete" title="Delete"></button>
          <button class="icon" id="close" aria-label="Close"></button>
        </div>
        <div class="tagrow"><div class="chips" id="convlabels" title="Edit labels"></div>
          <button class="icon" id="convmore" aria-label="Show all labels" title="Show all labels" hidden></button></div>
      </div>
    </div>
    <div class="scroll" id="convscroll"><div class="measure" id="convbody"></div></div>
    <div class="composer"><div class="measure">
      <div class="working" id="working" hidden></div>
      <div id="queue"></div>
      <div class="attached" id="attached" hidden></div>
      <div class="field">
        <button class="icon add" id="add" aria-label="Add images" title="Add images"></button>
        <input type="file" id="files" accept="image/*" multiple hidden>
        <textarea id="draft" rows="1" placeholder="Message"></textarea>
        <button class="steer" id="steer" hidden title="Send into the running turn now">Steer</button>
        <button class="send" id="send" aria-label="Send"></button>
      </div>
      <div class="error" id="send-error" hidden></div>
    </div></div>
  </section>
  <section class="pane" id="mappane" hidden>
    <div class="agekey" id="agekey" title="How long since each agent last did something">
      <span>Last active</span><span>now</span><i></i><span>2w</span>
      <span class="unseen" title="Finished a turn you have not looked at"><b></b>unseen</span><span class="grow"></span>
      <button class="icon" id="agekey-close" aria-label="Hide the key" title="Hide the key"></button></div>
    <div class="map" id="map">
      <div class="mboard" id="board"></div>
      <div class="mlane" id="lane" hidden></div>
      <div class="mnear" id="near" hidden></div>
      <div class="minimap" id="minimap"></div>
      <div class="mtools"><button class="small" id="fit">Fit all</button></div>
      <button class="edge" id="edge" aria-label="Open the list" title="Every agent in a list (L)"></button>
    </div>
  </section>
  <section class="pane recent" id="recentpane" hidden>
    <div class="recenthead"><button class="plain" id="recentback" aria-label="Back to the map" title="Back to the map"></button>
      <div class="modes" id="modes">
        <button data-mode="unseen">Unseen<span class="c"></span></button>
        <button data-mode="recent">Most recent</button>
        <button data-mode="blocked">Blocked<span class="c"></span></button>
      </div><span class="n" id="recentcount"></span></div>
    <button class="resort idle" id="resort" aria-label="Sort now"><i></i></button>
    <div class="scroll" id="recentscroll"><div id="recentbody"></div></div>
  </section>
</div>
<div class="toasts" id="toasts"></div>
<div class="status" id="status" hidden></div>
<script>
"use strict";
// Views are kept by applying Reef's snapshots and deltas
// (docs/reef/design.md). The list and the conversation each draw only
// themselves; the view's options and the composer are never redrawn under you.
const $ = (id) => document.getElementById(id);
const views = {};          // "list" | "conv" -> {seq, fields, parts}
const pending = {};        // req -> callback
// A tool call's or thought's detail, once fetched, by detailKey: one
// agent's items share ids with another's (each timeline numbers its own
// thoughts thought_1, thought_2...), so the agent is part of the key.
let details = {};
const busy = {};           // action key -> true while it runs
const failed = {};         // action key -> what went wrong
const forms = {};          // ask id -> {selected, other}
let ws = null, open = null, backoff = 1000, nextReq = 0, hosts = [], settings = {}, labelColors = {};
// The conversation last opened: the middle of the views' round (currentAgent).
let lastAgent = null;
// The Reef this page talks to: its version and commit, for About.
let reefInfo = {};
// Turns the open conversation shows, asked for again on a reconnect, and
// whether the reader is at its end, so it follows what comes.
let convTurns = 3, following = true;

const STATES = { needs_input: "Needs input", failed: "Failed", running: "Working", done: "Done" };
const GROUPS = { none: "No groups", state: "By state", host: "By host", label: "By label", combination: "By combination",
  workspace: "By workspace" };
// The groupings that have bands: by label, and by combination, where the
// raised labels an agent has are one band together, as in crusteo's Lanes.
const BANDED = new Set(["label", "combination"]);
// How the list is looked at, and what it is empty of.
const MODES = {
  unseen: { sort: "needs", attention: "unseen", empty: "Nothing new: you've seen every finished turn." },
  recent: { sort: "recent", empty: "No agents match." },
  blocked: { sort: "needs", attention: "blocked", empty: "Nothing is waiting on you." },
};

// ---- preferences, per device --------------------------------------------

// Before the rename to Skiff these keys began with hub-. Move them once,
// so a phone keeps its choices and its token.
for (const [from, to] of [["hub-prefs", "skiff-prefs"], ["hub-token", "skiff-token"]]) {
  try {
    const old = localStorage.getItem(from);
    if (old !== null) {
      if (localStorage.getItem(to) === null) localStorage.setItem(to, old);
      localStorage.removeItem(from);
    }
  } catch (e) {}
}

// background: "" follows Reef's setting, else "shown" or "hidden".
const prefs = Object.assign({ group: "label", query: "", host: "", label: "", state: "",
  background: "", filters: false, bands: [], listMode: "unseen" }, (() => { try { return JSON.parse(localStorage.getItem("skiff-prefs")) || {}; } catch (e) { return {}; } })());
// Labels are how a fleet is organised, as in crusteo's Lanes: group by
// them unless this device chose otherwise.
if (!prefs.groupChosen) prefs.group = "label";
// The map is all there is now, with the list over it; the tabs before it
// (Needs you, Agents) and their settings are gone.
prefs.tab = "map";
for (const old of ["sort", "collapsed", "more"]) delete prefs[old];
if (!MODES[prefs.listMode]) prefs.listMode = "unseen";
function savePrefs() { try { localStorage.setItem("skiff-prefs", JSON.stringify(prefs)); } catch (e) {} }
// The top bar's usage: ?usage=micro turns on the micro dials on this
// device, ?usage=dial goes back to the one dial. Which accounts they show
// and in what colours is this device's too (`dials`).
{
  const usage = new URLSearchParams(location.search).get("usage");
  if (usage === "micro" || usage === "dial") { prefs.usageMode = usage === "micro" ? "micro" : ""; savePrefs(); }
  if (!prefs.dials || typeof prefs.dials !== "object") prefs.dials = { shown: null, colors: {} };
  if (!prefs.dials.colors) prefs.dials.colors = {};
}
// Whether lists show agents of Paseo's background workspaces: this
// device's choice, else Reef's.
function showsBackground() { return prefs.background ? prefs.background === "shown" : settings.show_background !== false; }
// Background workspaces' agents as a label: the label filter's choice
// (no label is spelt with a control character) and, by label, their group.
const BG_LABEL = "\u0000background", BG_GROUP = "background";

function token() {
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("token")) {
    try { localStorage.setItem("skiff-token", hash.get("token")); } catch (e) {}
    history.replaceState(null, "", location.pathname);
    return hash.get("token");
  }
  try { return localStorage.getItem("skiff-token"); } catch (e) { return null; }
}

function newId() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}

// ---- layout ----------------------------------------------------------------

const coarse = matchMedia("(pointer: coarse)");

// ---- connection --------------------------------------------------------------

function status(text) { $("status").hidden = !text; $("status").textContent = text || ""; }
function send(message) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(message)); }
function ask(message, then) { const req = "r" + (++nextReq); pending[req] = then; send(Object.assign({ req }, message)); }

// Runs an action, keeping its button busy and its error until it answers.
function act(key, message, then) {
  if (busy[key]) return;
  busy[key] = true; delete failed[key]; drawAll();
  ask(Object.assign({ type: "action" }, message), (r) => {
    delete busy[key];
    if (!r.ok) failed[key] = (r.error && r.error.message) || "That did not work";
    if (then) then(r);
    drawAll();
  });
}

// With no token yet, try without one: an open Reef needs none, and one that
// does says so, which brings up the sign-in form.
// One socket at a time. A retry timer and coming back to the page could
// both reconnect; the second must replace the first, not run beside it, or
// every notification and update arrives once per socket.
let retry = null;
function connect() {
  clearTimeout(retry); retry = null;
  if (ws) { const old = ws; ws = null; old.onclose = old.onmessage = null; try { old.close(); } catch (e) {} }
  const t = token() || "";
  status("Connecting...");
  const sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws = sock;
  sock.onopen = () => { if (ws === sock) send({ type: "hello", v: 0, token: t, device: navigator.userAgent.slice(0, 60) }); };
  sock.onmessage = (event) => { if (ws === sock) receive(JSON.parse(event.data)); };
  sock.onclose = () => {
    if (ws !== sock) return;
    ws = null;
    for (const req in pending) { pending[req]({ ok: false, error: { message: "Connection lost" } }); delete pending[req]; }
    status("Offline; retrying...");
    retry = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };
}

function signIn(problem) {
  // The form is all there is until a token is taken.
  $("app").className = "app phone";
  $("mappane").hidden = $("convpane").hidden = $("recentpane").hidden = true;
  $("listpane").hidden = false;
  const body = $("listbody");
  body.innerHTML = "";
  const form = el("form", "signin");
  form.append(el("div", "small", problem || "Paste the device token Reef printed when it started."));
  const input = el("input"); input.placeholder = "device token"; input.autocomplete = "off";
  form.append(input, el("button", "primary", "Sign in"));
  form.onsubmit = (e) => { e.preventDefault(); try { localStorage.setItem("skiff-token", input.value.trim()); } catch (err) {} connect(); };
  body.append(form);
  status("");
}

function receive(m) {
  switch (m.type) {
    case "welcome":
      backoff = 1000; status(""); hosts = m.hosts; settings = m.settings || {}; labelColors = m.labels || {};
      reefInfo = m.hub || {};
      // Keep showing what was there until each view's new snapshot replaces
      // it: wiping first flashes "Loading..." and loses the reader's place.
      for (const id in views) views[id].stale = true;
      fillSelects(); subscribeList(); if (open) subscribeConv(); if (recent.subscribed) subscribeRecent();
      // Usage is one small view Reef keeps current itself.
      send({ type: "subscribe", id: "usage", view: "usage" });
      return drawAll();
    case "hosts": hosts = m.hosts; labelColors = m.labels || labelColors; fillSelects(); drawChrome(); drawMap(); drawRecent(); if (sheet === "hosts") drawSheet();
      // Not under a finger that is typing: rebuilding would close the keyboard.
      if (panel && panel.kind === "create" && !composing()) drawPanel();
      return sheet && !composing() && drawSheet();
    case "settings": settings = m.settings; if (fillSelects()) refilter(); drawChrome(); return drawSheet();
    case "notification": return notify(m);
    case "snapshot":
      // One the previous agent's view sent before Reef had the new
      // subscription: not this conversation's.
      if (m.id === "conv" && m.agent && (!open || m.agent.id !== open.id || m.agent.host !== open.host)) return;
      views[m.id] = { seq: m.seq, fields: m, parts: m.rows || m.turns || m.tiles || [], cards: m.cards || [] }; break;
    case "delta": if (!applyDelta(m)) return; break;
    case "result":
      if (pending[m.req]) { const then = pending[m.req]; delete pending[m.req]; then(m); }
      return;
    case "error":
      if (m.code === "unauthorized") {
        let had = null;
        try { had = localStorage.getItem("skiff-token"); localStorage.removeItem("skiff-token"); } catch (e) {}
        ws.onclose = null; ws.close(); ws = null;
        return signIn(had ? "That token was not accepted. Paste a current one." : null);
      }
      if (m.id) status(m.message);
      return;
    default: return;
  }
  if (m.id === "conv") { drawConv(); seenWhileOpen(); if (panel && panel.kind === "details") drawPanel(); }
  else if (m.id === "map") { drawMap(); drawCounts(); }
  else if (m.id === "usage") drawUsage(); else if (m.id === "recent") drawRecent();
}

function reorder(parts, order, key) {
  const by = new Map(parts.map((p) => [p[key], p]));
  return order.map((k) => by.get(k)).filter(Boolean);
}

function applyDelta(m) {
  const v = views[m.id];
  if (!v || m.seq !== v.seq + 1) { send({ type: "resync", id: m.id }); return false; }
  v.seq = m.seq;
  for (const [k, value] of Object.entries(m)) {
    if (!["type", "id", "seq", "upsert", "remove", "order", "turns", "tiles", "cards"].includes(k)) v.fields[k] = value;
  }
  if (m.remove) v.parts = v.parts.filter((p) => !m.remove.includes(p.key));
  for (const row of m.upsert || []) {
    const i = v.parts.findIndex((p) => p.key === row.key);
    if (i >= 0) v.parts[i] = row; else v.parts.push(row);
  }
  for (const patch of m.turns || []) {
    const turn = v.parts.find((t) => t.key === patch.key);
    if (!turn) { v.parts.push(patch); continue; }
    for (const [k, value] of Object.entries(patch)) {
      if (k === "key" || k === "items" || k === "order") continue;
      if (value === null) delete turn[k]; else turn[k] = value;
    }
    for (const item of patch.items || []) {
      const i = turn.items.findIndex((x) => x.id === item.id);
      if (item.append !== undefined && i >= 0) { turn.items[i].text += item.append; turn.items[i].at = item.at; }
      else if (i >= 0) turn.items[i] = item; else turn.items.push(item);
    }
    if (patch.order) turn.items = reorder(turn.items, patch.order, "id");
  }
  if (m.order) v.parts = reorder(v.parts, m.order, "key");
  // A map nests its two lists.
  if (m.tiles) applyRows(v, "parts", m.tiles);
  if (m.cards) applyRows(v, "cards", m.cards);
  return true;
}

function applyRows(v, field, changes) {
  if (changes.remove) v[field] = v[field].filter((p) => !changes.remove.includes(p.key));
  for (const row of changes.upsert || []) {
    const i = v[field].findIndex((p) => p.key === row.key);
    if (i >= 0) v[field][i] = row; else v[field].push(row);
  }
  if (changes.order) v[field] = reorder(v[field], changes.order, "key");
}

// The filters the map and the list share, from the view's options.
function listFilter() {
  // Agents other agents made too: each says whose it is.
  const filter = { query: prefs.query, subagents: true };
  if (prefs.host) filter.hosts = [prefs.host];
  if (prefs.label) filter.labels = [prefs.label];
  if (prefs.state) filter.states = [prefs.state];
  // Left out, Reef's setting decides.
  if (prefs.background) filter.background = prefs.background === "shown";
  return filter;
}

// The map, always there under everything else.
function subscribeList() {
  mapState.focusSent = "";
  // The labels this device raised to bands; only a label map has them.
  send({ type: "subscribe", id: "map", view: "map", group: prefs.group, filter: listFilter(), focus: [],
    bands: BANDED.has(prefs.group) ? prefs.bands : [] });
}

// A filter changed: the map and, if it is up, the list.
function refilter() {
  subscribeList();
  if (recent.subscribed) restartRecent();
}

function subscribeConv() {
  send({ type: "subscribe", id: "conv", view: "conversation", host: open.host, agent: open.id, turns: convTurns });
}

function detailKey(item) { return open ? open.host + "/" + open.id + "|" + item.id + "|" + (item.at || "") : ""; }

function openAgent(agent) {
  if (open && views.conv) send({ type: "unsubscribe", id: "conv" });
  delete views.conv;
  details = {};
  convTurns = 3; following = true;
  $("draft").value = ""; sizeDraft();
  attached = []; drawAttached();
  open = agent; firstDraw = true;
  if (agent) lastAgent = { host: agent.host, id: agent.id, title: agent.title };
  // A selection in the last conversation would hold this one's first draw.
  try { if (selectingIn($("convbody"))) window.getSelection().removeAllRanges(); } catch (e) {}
  // The details are the last agent's.
  if (panel && panel.kind === "details") panel = null, drawPanel();
  if (open) { subscribeConv(); markSeen(open); } else send({ type: "unsubscribe", id: "conv" });
  drawAll();
}

// Opening an agent marks it seen, on its host, so every client (crusteo
// too) stops showing it unseen. Reef asks the host only if it was.
const seenAsked = new Map(), SEEN_AGAIN_MS = 3000;
let seenLater = null;
function markSeen(agent) {
  const key = agent.host + "/" + agent.id, now = Date.now();
  if (now - (seenAsked.get(key) || 0) < SEEN_AGAIN_MS) return false;
  seenAsked.set(key, now);
  ask({ type: "action", action: "seen", host: agent.host, agent: agent.id }, () => {});
  return true;
}
// A turn that ends while you watch it is seen too, unless the page is
// in the background. Asked just before, it asks again a little later.
function seenWhileOpen() {
  const a = views.conv && views.conv.fields.agent;
  if (!open || !a || !a.unseen || document.hidden) return;
  if (!markSeen(open)) { clearTimeout(seenLater); seenLater = setTimeout(seenWhileOpen, SEEN_AGAIN_MS + 100); }
}

// ---- notifications ----------------------------------------------------------

function allowed() {
  // Permission is "default" until asked, then allowed or "denied"; the
  // export's leak check keeps the third word out of the source.
  try { return Notification.permission !== "default" && Notification.permission !== "denied"; } catch (e) { return false; }
}

// Each notice once, and one toast per agent: a newer one replaces it.
const noticed = new Set();
function notify(n) {
  // Ids restart with Reef, so the time goes with them.
  const seen = n.id + "@" + n.at;
  if (noticed.has(seen)) return;
  noticed.add(seen);
  if (n.kind === "cli_update" || n.kind === "models") return notifyUpdate(n);
  // A newer notice for the agent takes its card's place, pinned if it was.
  let pinned = false;
  for (const old of document.querySelectorAll("#toasts .toast")) {
    if (n.key && old.dataset.key === n.key) { pinned = pinned || old.classList.contains("pinned"); dropToast(old); }
  }
  try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
  const target = { host: n.host, id: n.agent, title: n.title };
  showToast({
    title: (n.state === "failed" ? "Failed: " : "") + n.title,
    text: [n.host, n.body].filter(Boolean).join(" · "),
    failed: n.state === "failed", key: n.key, pinned,
    open: () => { if (prefs.tab === "map") flyTo(n.host, n.agent); else openAgent(target); },
  });
  try {
    if (document.hidden && "Notification" in window && allowed()) {
      const system = new Notification(n.title, { body: [n.host, n.body].filter(Boolean).join(" · "), tag: n.key });
      system.onclick = () => { try { window.focus(); } catch (e) {} system.close(); if (prefs.tab === "map") flyTo(n.host, n.agent); else openAgent(target); };
    }
  } catch (e) {}
}

// A coding-agent CLI upgraded, or a model came or went: one card per
// version, which the same id replaces as more hosts catch up. Tapping it
// opens the hosts, which show who is behind.
function notifyUpdate(n) {
  for (const old of document.querySelectorAll("#toasts .toast")) {
    if (old.dataset.key === n.id) dropToast(old);
  }
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
  showToast({ title: n.title, text: n.body, info: true, key: n.id,
    open: () => { sheet = "hosts"; drawSheet(); } });
  try {
    if (document.hidden && "Notification" in window && allowed()) {
      new Notification(n.title, { body: n.body, tag: n.id });
    }
  } catch (e) {}
}

// ---- notification cards -----------------------------------------------------------
//
// A card shows for TOAST_MS, its time a line draining along its top. A
// finger on it stops the time; pinning keeps it until it is dismissed.
// Tapping it opens what it is about; its x, or a sideways swipe, dismisses
// it. At most four show: the oldest unpinned one goes first.

const TOAST_MS = 7000, TOAST_MAX = 4, SWIPE_AWAY = 90;

function showToast(o) {
  const toast = el("div", "toast" + (o.failed ? " failed" : o.info ? " info" : "") + (o.pinned ? " pinned" : ""));
  toast.dataset.key = o.key || "";
  toast.style.setProperty("--tms", TOAST_MS + "ms");
  const head = el("div", "thead");
  const pin = el("button", "tpin"); pin.innerHTML = icon("pin", 16); pin.setAttribute("aria-label", o.pinned ? "Unpin" : "Pin");
  const close = el("button", "tclose"); close.innerHTML = icon("close", 16); close.setAttribute("aria-label", "Dismiss");
  head.append(el("b", "", o.title), pin, close);
  toast.append(el("i", "tbar"), head, el("span", "", o.text || ""));
  toast.left = TOAST_MS;
  pin.onclick = (e) => {
    e.stopPropagation();
    const now = !toast.classList.contains("pinned");
    toast.classList.toggle("pinned", now);
    pin.setAttribute("aria-label", now ? "Unpin" : "Pin");
    if (now) { clearTimeout(toast.timer); toast.timer = null; }
    else { toast.left = TOAST_MS; toast.querySelector(".tbar").replaceWith(el("i", "tbar")); runToast(toast); }
  };
  close.onclick = (e) => { e.stopPropagation(); dropToast(toast); };
  toast.onclick = () => { if (toast.swiped) return; dropToast(toast); if (o.open) o.open(); };
  swipeable(toast);
  const stack = $("toasts");
  stack.prepend(toast);
  const cards = [...stack.children];
  for (let i = cards.length - 1; cards.length > TOAST_MAX && i >= 0; i--) {
    if (!cards[i].classList.contains("pinned")) { dropToast(cards[i]); cards.splice(i, 1); }
  }
  if (!o.pinned) runToast(toast);
  return toast;
}
// The card's time runs, from what is left of it.
function runToast(toast) {
  if (toast.classList.contains("pinned") || toast.timer) return;
  toast.classList.remove("paused");
  toast.started = Date.now();
  toast.timer = setTimeout(() => dropToast(toast), toast.left);
}
function pauseToast(toast) {
  if (!toast.timer) return;
  clearTimeout(toast.timer); toast.timer = null;
  toast.left = Math.max(0, toast.left - (Date.now() - toast.started));
  toast.classList.add("paused");
}
function dropToast(toast) {
  clearTimeout(toast.timer); toast.timer = null;
  toast.remove();
}
// Sideways drags move the card; far enough, or flicked, and it goes.
function swipeable(toast) {
  let x0 = 0, y0 = 0, t0 = 0, dx = 0, id = null, sideways = false;
  toast.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;

  line.classList.toggle("idle", !pending);
  line.classList.toggle("held", pending && Date.now() < s.holdUntil);
  line.querySelector("i").style.width = (pending ? Math.min(100, (s.waited * 100) / RESORT_MS) : 0) + "%";
}
// Items slide from where they were to where they go, so the eye can follow.
function resort(s) {
  const keys = s.keys();
  if (!keys) return;
  const at = (e) => e.getBoundingClientRect();
  const before = new Map([...s.items()].map((e) => [e.dataset.key, at(e)]));
  s.order = keys;
  s.waited = 0;
  if (s.sorted) s.sorted();
  const wasPressing = pressing;
  pressing = false; s.redraw(); pressing = wasPressing;
  for (const e of s.items()) {
    if (!e.animate) break;
    const was = before.get(e.dataset.key);
    if (!was) { e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250 }); continue; }
    const now = at(e), dx = was.left - now.left, dy = was.top - now.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
      e.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: 250, easing: "ease-out" });
    }
  }
}
// The order waits while a finger is on `scroll`, and a second after. A
// minute caps a hold whose end never comes.
function holdWhileTouched(s, scroll) {
  const hold = () => { s.touching = true; s.holdUntil = Date.now() + 60000; drawResort(s); };
  const release = () => {
    if (!s.touching) return;
    s.touching = false; s.holdUntil = Date.now() + HOLD_MS;
    setTimeout(payOwed, 0);
  };
  const nudge = () => { if (!s.touching) s.holdUntil = Date.now() + HOLD_MS; };
  scroll.addEventListener("touchstart", hold, { passive: true });
  scroll.addEventListener("pointerdown", hold);
  for (const end of ["touchend", "touchcancel", "pointerup"]) document.addEventListener(end, release, { capture: true, passive: true });
  scroll.addEventListener("scroll", nudge, { passive: true });
  scroll.addEventListener("wheel", nudge, { passive: true });
}

// ---- the list: every agent, flat, over the map ------------------------------------
//
// Looked at one of three ways: unseen (the blocked first), newest first, or
// only the blocked; through the same filters as the map. It comes in from
// the right: the switch, a swipe left, the map's edge handle, or L. It
// keeps a held order: agents new to it wait for the re-sort too, and ones
// that left it (seen, say) stay, dimmed, until then. A conversation opened
// from it opens over it, and back comes back to it.

// `open`: up, over everything. `under`: kept under a conversation opened
// from it, which goes back to it.
const recent = { open: false, under: false, subscribed: false, limit: 50, rows: new Map(), append: false };
recent.sort = heldOrder({
  line: () => $("resort"),
  keys: () => views.recent && views.recent.parts.map((r) => r.key),
  items: () => $("recentbody").querySelectorAll(".row"),
  redraw: () => drawRecent(),
  sorted: () => { const live = new Set(recent.sort.order); for (const key of [...recent.rows.keys()]) if (!live.has(key)) recent.rows.delete(key); },
});

function subscribeRecent() {
  const mode = MODES[prefs.listMode], filter = listFilter();
  if (mode.attention) filter.attention = mode.attention;
  send({ type: "subscribe", id: "recent", view: "agents", group: "none", sort: mode.sort, filter, limit: recent.limit });
}

// Another mode or filter is another list: drawn fresh, not held.
function restartRecent() {
  delete views.recent;
  Object.assign(recent, { limit: 50, append: false });
  Object.assign(recent.sort, { order: [], waited: 0 });
  recent.rows.clear();
  resortTimer(recent.sort, false);
  $("recentscroll").scrollTop = 0;
  subscribeRecent();
  drawRecent();
}
function setListMode(mode) {
  if (!MODES[mode] || mode === prefs.listMode) return;
  prefs.listMode = mode; savePrefs(); drawCounts();
  if (recent.subscribed) restartRecent();
}

// Shown under what a swipe is moving, or over everything.
function showRecent(under) {
  const pane = $("recentpane");
  pane.classList.toggle("under", !!under);
  pane.hidden = false;
  if (!recent.subscribed) { recent.subscribed = true; subscribeRecent(); }
  drawRecent();
}
function openRecent() {
  if (mapState.level === "near" && recent.under) return nearToList();
  recent.open = true; recent.under = false; showRecent(false); drawChrome();
}
function closeRecent() {
  recent.open = recent.under = false;
  mapState.fromList = false;
  $("recentpane").hidden = true;
  $("recentpane").classList.remove("under");
  if (recent.subscribed) send({ type: "unsubscribe", id: "recent" });
  delete views.recent;
  Object.assign(recent, { subscribed: false, limit: 50, append: false });
  Object.assign(recent.sort, { order: [], waited: 0 });
  recent.rows.clear();
  resortTimer(recent.sort, false);
  drawChrome();
}

// An agent picked from the list opens over it, growing from its row, as
// a map card does; back comes back to the list.
function openFromRecent(row, from) {
  const key = row.host + "/" + row.id;
  recent.open = false; recent.under = true;
  $("recentpane").classList.add("under");
  mapState.fromList = true;
  if (mapState.level === "near") { mapState.near = key; openAgent({ host: row.host, id: row.id, title: row.title }); }
  else enterNear(key, from, row.title);
  drawChrome();
}

// Back to the list from a conversation opened from it, at once (a swipe
// has already moved the conversation away).
function nearToList() {
  if (mapState.level === "near") {
    $("near").hidden = true;
    $("app").insertBefore($("convpane"), $("mappane"));
    mapState.level = mapState.lane ? "mid" : "far";
    openAgent(null);
    drawMap();
  }
  mapState.fromList = false;
  recent.open = true; recent.under = false;
  showRecent(false);
  drawChrome();
}

function recentPending() { return sortPending(recent.sort); }

function drawRecent() {
  const pane = $("recentpane");
  if (pane.hidden) return;
  if (held(pane) || (recent.sort.touching && Date.now() < recent.sort.holdUntil)) return later(drawRecent);
  const body = $("recentbody"), v = views.recent;
  body.innerHTML = "";
  if (!v) return body.append(el("div", "note", "Loading..."));
  for (const r of v.parts) recent.rows.set(r.key, r);
  const order = recent.sort.order;
  if (!order.length) recent.sort.order = v.parts.map((r) => r.key);
  // More asked for: the older agents go on below, now.
  if (recent.append) {
    recent.append = false;
    const have = new Set(recent.sort.order);
    for (const r of v.parts) if (!have.has(r.key)) recent.sort.order.push(r.key);
  }
  const live = new Set(v.parts.map((r) => r.key));
  for (const key of recent.sort.order) {
    const row = recent.rows.get(key);
    if (!row) continue;
    const r = agentRow(row);
    r.dataset.key = key;
    if (!live.has(key)) r.classList.add("gone");
    r.onclick = () => openFromRecent(row, r);
    body.append(r);
  }
  if (!recent.sort.order.length) {
    const empty = el("div", "empty", MODES[prefs.listMode].empty);
    if (prefs.listMode !== "recent") {
      const all = el("button", "more", "Show the most recent");
      all.onclick = () => setListMode("recent");
      empty.append(all);
    }
    body.append(empty);
  }
  if (v.fields.total > v.parts.length) {
    const more = el("button", "more", "Show more");
    more.onclick = () => { recent.limit += 50; recent.append = true; subscribeRecent(); };
    body.append(more);
  }
  $("recentcount").textContent = v.fields.total ? String(v.fields.total) : "";
  if (!recentPending()) recent.sort.waited = 0;
  resortTimer(recent.sort, recentPending());
  drawResort(recent.sort);
}

// ---- the conversation ---------------------------------------------------------------

// Markdown, small: code blocks, inline code, bold, paragraphs. Text is
// escaped first, so nothing from an agent becomes markup.
// The markdown agents write: code blocks, tables, lists, headings, and
// inline code, bold, italics, links and images. Everything is escaped
// first. `sources` maps an image's destination to the key Reef serves the
// file it names under, for images a daemon keeps.
function markdown(text, sources) {
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // A destination as written, from its escaped form: entities and
  // backslash escapes undone, as Reef found it.
  const unesc = (s) => s.replace(/&(amp|lt|gt|quot|#39);/g, (_, e) => ({ amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" }[e]))
    .replace(/\\([!-/:-@[-`{-~])/g, "$1");
  // A daemon's file through Reef, a web image, or one a data: URL carries.
  const imageSrc = (dest) => {
    const key = sources && Object.prototype.hasOwnProperty.call(sources, dest) ? sources[dest] : null;
    if (key) return imageUrl(key);
    if (/^https:\/\//i.test(dest) || /^data:image\/(png|jpe?g|gif|webp);base64,/i.test(dest)) return dest;
    return null;
  };
  const inline = (s) => {
    const codes = [], images = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    // Images before anything else, so a path's _ or * is left alone.
    s = s.replace(/!\[([^\]]*)\]\(((?:\\.|[^\s)\\])+)(?:\s+&quot;.*?&quot;)?\)/g, (all, alt, dest) => {
      const src = imageSrc(unesc(dest));
      if (!src) return all;
      images.push('<img class="rimg" loading="lazy" decoding="async" alt="' + (alt || "Image") + '" src="' + esc(src) + '">');
      return "\u0001" + (images.length - 1) + "\u0001";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, "$1<i>$2</i>")
      .replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, "$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>")
      .replace(/\u0001(\d+)\u0001/g, (_, i) => images[i]);
  };
  const cells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  const isRule = (line) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line || "");
  const bullet = /^\s*([-*+]|\d+[.)])\s+(.*)$/;
  const blocks = (part) => {
    const lines = part.split("\n"), out = [];
    let para = [];
    const flush = () => { if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line.trim()) { flush(); continue; }
      if (line.includes("|") && isRule(lines[i + 1])) {
        flush();
        let html = '<div class="tablewrap"><table><thead><tr>' + cells(line).map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
        for (i += 2; i < lines.length && lines[i].includes("|") && lines[i].trim(); i++) {
          html += "<tr>" + cells(lines[i]).map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>";
        }
        i--;
        out.push(html + "</tbody></table></div>");
        continue;
      }
      const h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { flush(); out.push('<p class="h">' + inline(h[2]) + "</p>"); continue; }
      const m = bullet.exec(line);
      if (m) {
        flush();
        const ordered = /\d/.test(m[1]), items = [];
        for (; i < lines.length; i++) {
          const b = bullet.exec(lines[i]);
          if (b && /\d/.test(b[1]) === ordered) items.push(inline(b[2]));
          else if (lines[i].trim() && /^\s{2,}/.test(lines[i]) && items.length) items[items.length - 1] += "<br>" + inline(lines[i].trim());
          else break;
        }
        i--;
        const tag = ordered ? "ol" : "ul";
        const start = ordered ? parseInt(m[1], 10) : 1;
        out.push("<" + tag + (start > 1 ? ' start="' + start + '"' : "") + ">" + items.map((t) => "<li>" + t + "</li>").join("") + "</" + tag + ">");
        continue;
      }
      para.push(line);
    }
    flush();
    return out.join("");
  };
  return text.split(/```[^\n]*\n?/).map((part, i) => {
    if (i % 2) return "<pre>" + esc(part.replace(/\n$/, "")) + "</pre>";
    return blocks(esc(part));
  }).join("");
}

// The open agent's provider, model and effort (the defaults when it names
// none), by the names its host gives them once the host's choices are in
// (fetched once), by id until then; then how full its context is, amber
// from 80% and red from 90%, as crusteo's composer shows it.
// The open agent's provider, model, effort and mode by the names its host
// gives them, or by id until the host's choices are in.
function specOf(agent, modeId) {
  const host = agent.host || (open && open.host);
  if (agent.provider && !createOptions[host]) loadOptions(host);
  const data = (createOptions[host] || {}).data;
  const provider = data && (data.providers || []).find((p) => p.id === agent.provider);
  const models = (provider && provider.models) || [];
  const model = models.find((m) => m.id === agent.model) || (!agent.model && models.find((m) => m.default));
  const thinking = model && (model.thinking || []).find((t) => t.id === agent.thinking);
  const mode = modeId && provider && (provider.modes || []).find((m) => m.id === modeId);
  return {
    provider: provider ? provider.label : agent.provider,
    model: model ? model.label : agent.model,
    // Named, or the model's default when it names none.
    modelDefault: !agent.model && !!model,
    effort: thinking ? thinking.label : agent.thinking,
    mode: mode ? mode.label : modeId,
  };
}

function drawSpec() {
  if (!open) return;
  const agent = (views.conv && views.conv.fields.agent) || open;
  const names = specOf(agent);
  const spec = $("convspec"), ctx = $("convctx"), full = agent.context;
  spec.textContent = [names.provider, names.model, names.effort].filter(Boolean).join(" · ");
  // Its own span, so a narrow screen cuts the model's name, not this.
  ctx.hidden = typeof full !== "number";
  ctx.className = "ctx" + (full >= 90 ? " bad" : full >= 80 ? " warn" : "");
  ctx.textContent = ctx.hidden ? "" : (spec.textContent ? "· " : "") + full + "% context";
  $("convsub").hidden = !spec.textContent && ctx.hidden;
  fitHead();
}

// The chevron shows only when the labels don't all fit; it opens the header to show every one.
let headFull = false;
function fitHead() {
  const more = $("convmore"), labels = $("convlabels");
  $("convpane").querySelector(".convhead").classList.toggle("full", headFull && !labels.hidden);
  if (headFull) { more.hidden = labels.hidden; return; }
  more.hidden = true;
  more.hidden = labels.hidden || labels.scrollWidth <= labels.clientWidth + 1;
}

let firstDraw = true;
function drawConv() {
  if (!open) {
    $("convbody").innerHTML = "";
    $("convbody").dataset.agent = "";
    $("convbody").append(el("div", "placeholder", "Pick an agent to see its conversation"));
    return;
  }
  const pane = $("convpane");
  // Nor while text in it is selected: redrawn, the selection would go.
  if (held(pane) || selectingIn($("convbody"))) return later(drawConv);
  const v = views.conv;
  const agent = (v && v.fields.agent) || open;
  // Its state as a dot before its name, as on the map and in the list; a
  // subagent's ↳ before its host (whose it is, the details say). Kept in
  // place across deltas so a running dot's pulse does not restart.
  const title = $("title");
  let dot = title.querySelector(".dot"), name = title.querySelector(".tname");
  if (!dot || !name) {
    title.innerHTML = "";
    dot = el("span", "dot"); name = el("span", "tname");
    title.append(dot, name);
  }
  const dotCls = "dot s-" + (agent.state || "");
  if (dot.className !== dotCls) dot.className = dotCls;
  dot.title = STATES[agent.state] || "";
  const titleText = agent.title || "Conversation";
  if (name.textContent !== titleText) name.textContent = titleText;
  $("convmeta").textContent = (agent.parent ? "↳ " : "") + [agent.host || open.host, agent.workspace].filter(Boolean).join(" · ");
  const nextBell = bellFor(agent, 20);
  if ($("bell").innerHTML !== nextBell) $("bell").innerHTML = nextBell;
  $("bell").className = "icon" + (agent.notify === false ? " off" : "");
  const labelBox = $("convlabels");
  const labelNames = (agent.labels || []).join("\u0000");
  if (labelBox.dataset.labels !== labelNames) {
    labelBox.dataset.labels = labelNames;
    labelBox.hidden = !(agent.labels && agent.labels.length);
    labelBox.innerHTML = "";
    labelBox.append(...chips(agent.labels).children);
  }
  drawSpec();
  drawComposer();
  const scroller = $("convscroll");
  const body = $("convbody");
  // Whose conversation the body shows.
  const showing = open.host + "/" + open.id;
  if (!v || v.fields.loading) {
    // This agent's conversation, already on screen (a reconnect), stays
    // until its replacement comes. Another agent's never does: it read as
    // this one's under its title until this one's loaded.
    if (body.dataset.agent === showing && body.querySelector(".turn")) return;
    body.innerHTML = "";
    body.dataset.agent = showing;
    return body.append(el("div", "note", "Loading..."));
  }
  const anchor = following ? null : readingAt(scroller);
  body.innerHTML = "";
  body.dataset.agent = showing;
  if (v.fields.error) body.append(el("div", "note", v.fields.error));
  if (v.fields.has_older) {
    body.append(button("Load earlier", "more", "older", () => {
      busy.older = true; drawConv();
      ask({ type: "older", id: "conv", turns: 3 }, () => { delete busy.older; convTurns = Math.min(convTurns + 3, 50); drawConv(); });
    }));
  }
  if (!v.parts.length) body.append(el("div", "empty", "No messages yet"));
  for (const turn of v.parts) {
    const t = el("div", "turn");
    if (turn.clipped) t.append(el("div", "small", turn.clipped + " earlier steps"));
    for (const item of turn.items) { const node = renderItem(item); node.dataset.id = item.id; t.append(node); }
    if (turn.footer) {
      const f = [ago(turn.footer.at) + (ago(turn.footer.at) === "now" ? "" : " ago")];
      if (turn.footer.secs) f.push(duration(turn.footer.secs));
      t.append(el("div", "footer", f.join(" · ")));
    }
    body.append(t);
  }
  for (const a of v.fields.asks || []) body.append(askCard(a));
  if (failed.archive) body.append(el("div", "error", failed.archive));
  // Follow the end while there; otherwise put the item being read back
  // where it was, whatever came or went above it.
  const back = anchor && body.querySelector('[data-id="' + CSS.escape(anchor.id) + '"]');
  if (firstDraw || following || !back) scroller.scrollTop = scroller.scrollHeight;
  else scroller.scrollTop += back.getBoundingClientRect().top - anchor.top;
  firstDraw = false;
}

// The first item showing at the top of the conversation, and where.
function readingAt(scroller) {
  const top = scroller.getBoundingClientRect().top;
  for (const node of scroller.querySelectorAll("[data-id]")) {
    const r = node.getBoundingClientRect();
    if (r.bottom > top + 1) return { id: node.dataset.id, top: r.top };
  }
  return null;
}

// Following the end is the reader's choice, made by where they scroll: back
// to the end follows again, and only scrolling up stops it. The pane
// shrinking under the keyboard or a taller composer is not the reader's
// doing, so it leaves following as it was.
let lastTop = 0;
$("convscroll").addEventListener("scroll", () => {
  const s = $("convscroll");
  if (s.scrollTop + s.clientHeight >= s.scrollHeight - 60) following = true;
  else if (s.scrollTop < lastTop) following = false;
  lastTop = s.scrollTop;
}, { passive: true });
function toEnd() { const s = $("convscroll"); if (following) s.scrollTop = s.scrollHeight; }
// The pane resized, or what's in it grew without a redraw (an image loading).
new ResizeObserver(toEnd).observe($("convscroll"));
new ResizeObserver(toEnd).observe($("convbody"));

function askCard(a) {
  const card = el("div", "card");
  const key = "ask:" + a.id;
  card.append(el("h3", "", a.title));
  if (a.summary) card.append(el("div", "small", a.summary));
  if (a.description) card.append(el("div", "small", a.description));
  if (a.plan) { const p = el("div", "item assistant"); p.innerHTML = markdown(a.plan); card.append(p); }
  const buttons = el("div", "buttons");
  if (a.questions) {
    const form = forms[a.id] || (forms[a.id] = { selected: a.questions.map(() => []), other: a.questions.map(() => "") });
    a.questions.forEach((q, qi) => {
      card.append(el("div", "q", q.question));
      q.options.forEach((o, oi) => {
        const label = el("label");
        const input = el("input"); input.type = q.multi ? "checkbox" : "radio"; input.name = a.id + ":" + qi;
        input.checked = form.selected[qi].includes(oi);
        input.onchange = () => {
          if (!q.multi) form.selected[qi] = [];
          form.selected[qi] = form.selected[qi].filter((x) => x !== oi);
          if (input.checked) form.selected[qi].push(oi);
        };
        label.append(input, el("span", "", o.label + (o.description ? " — " + o.description : "")));
        card.append(label);
      });
      if (q.other) {
        const other = el("input", "other"); other.placeholder = q.options.length ? "Or type an answer" : "Your answer";
        other.value = form.other[qi];
        other.oninput = () => { form.other[qi] = other.value; };
        card.append(other);
      }
    });
    buttons.append(button(a.dismiss || "Dismiss", "", key + ":dismiss", () =>
      act(key + ":dismiss", { action: "answer", host: open.host, agent: open.id, ask: a.id, dismiss: true })));
    buttons.append(button("Submit", "primary", key, () =>
      act(key, { action: "answer", host: open.host, agent: open.id, ask: a.id,
        answers: form.selected.map((s, i) => ({ selected: s, other: form.other[i] })) })));
  } else {
    for (const choice of a.actions || []) {
      const allow = choice.behavior === "allow";
      buttons.append(button(choice.label, allow ? "primary" : "", key + ":" + choice.id, () =>
        act(key + ":" + choice.id, { action: "permission", host: open.host, agent: open.id, ask: a.id,
          decision: allow ? "allow" : "deny", action_id: choice.id })));
    }
  }
  card.append(buttons);
  for (const k of Object.keys(failed)) if (k.startsWith(key)) card.append(el("div", "error", failed[k]));
  return card;
}

// Images come one by one from Reef, named by their contents, so the
// browser keeps each for good once fetched.
function imageUrl(key) {
  const t = token();
  return "/image/" + key + (t ? "?t=" + encodeURIComponent(t) : "");
}
function showImage(url) {
  const box = el("div", "lightbox"), img = el("img");
  img.src = url; img.alt = "Image";
  box.append(img);
  box.onclick = () => box.remove();
  document.body.append(box);
}

// ---- usage ------------------------------------------------------------------------
// Reef's `usage` view: a row per account, worked out by the rules
// crusteo's title bar follows, so both say the same. The top bar shows
// the tightest account's pace dial; a tap opens every account.

function usageRows() { return (views.usage && views.usage.parts) || []; }

let usageTimer = null;

// A half dial, green on the left through blue at the top to red on the

function dialSvg(needle) {

      '" stroke="' + color + '" stroke-width="3" fill="none" opacity=".55"/>';

// Each account's colour by provider, the first account of a provider in

const DIAL_SWATCHES = ["#D85A30", "#E8A07F", "#1D9E75", "#5DCAA5", "#378ADD", "#85B7EB", "#7F77DD", "#D4537E", "#C9A227", "#888780"];

function drawUsage() {

  g.hidden = !top;

    const w = bindingWindow(top);

    g.innerHTML = dialSvg(top.needle) + "<span>" + top.slack + "</span>";
    g.title = [top.provider + " " + (top.account || top.label), w ? (w.short || w.name) + " " + Math.round(w.remaining) + "% left, " + resetsIn(w.resets_at, top.retained) : "",
      top.retained ? failureText(top) + "\n" + lastUpdated(top) : ""]

function showUsage() {
  if (usageOpen()) return;
  const back = el("div", "drawerback"), drawer = el("div", "drawer");
  const head = el("div", "sheethead");
  head.append(el("h3", "", "Usage"));
  const done = el("button", "", "Done"); done.onclick = hideUsage; head.append(done);
  drawer.append(head, el("div", "body"));

  document.body.append(back, drawer);
  void drawer.offsetWidth;
  back.classList.add("open"); drawer.classList.add("open");

    if (p.retained) who.append(el("span", "fail " + (p.failure.status === "error" ? "error" : "unavailable")));
    who.append(el("span", "pace sev-" + p.severity, p.slack));
    const micro = prefs.usageMode === "micro";

// The micro dials' settings, this device's, in each account's own row: a

let dialOpen = null, dialFresh = false, dialNote = "";

  '<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h8"/></svg>';

function renderItem(item) {
  switch (item.kind) {
    case "user": {
      const d = el("div", "item user", item.text);
      const keys = item.image_keys || [];
      if (keys.length) {
        const row = el("div", "shots");
        for (const k of keys) {
          const img = el("img"); img.loading = "lazy"; img.decoding = "async"; img.alt = "Image"; img.src = imageUrl(k);
          img.onclick = () => showImage(imageUrl(k));
          row.append(img);
        }
        if (item.text) d.prepend(row); else d.append(row);
      } else if (item.images) d.append(" [" + item.images + " image(s)]");
      return d;
    }
    case "assistant": {
      const d = el("div", "item assistant");
      d.innerHTML = markdown(item.text, item.image_sources);
      for (const img of d.querySelectorAll("img.rimg")) img.onclick = () => showImage(img.src);
      return d;
    }
    case "tool": case "thought": {
      const wrap = el("div", "item");
      // A row that unfolds on a tap, but not a <button>: its text can be
      // selected and copied (a long press), as the detail under it can.
      const b = el("div", "tool " + (item.status || ""));
      b.setAttribute("role", "button"); b.tabIndex = 0;
      const name = el("span", "name", item.kind === "thought" ? "Thinking" : item.name);
      const a = item.agent;
      if (a) {
        // The agent opens on a tap; the rest of the row unfolds.
        const who = el("span", "who" + (a.known ? " link" : ""), a.title);
        if (a.known) who.onclick = (e) => { e.stopPropagation(); openAgent({ host: open.host, id: a.id, title: a.title }); };
        if (a.lead) b.append(who, name); else b.append(name, who);
      } else b.append(name);
      if (item.summary) b.append(el("span", "sum" + (a ? " prose" : ""), item.summary));
      wrap.append(b);
      const key = detailKey(item);
      const fetchDetail = () => {
        const askedChars = item.chars;
        ask({ type: "detail", id: "conv", item: item.id }, (r) => {
          // Kept only if the same agent's conversation is still open.
          if (r.ok && detailKey(item) === key) details[key] = Object.assign(r.detail, { chars: askedChars });
          drawConv();
        });
      };
      const shown = details[key];
      // A thought that has grown since it was read (it was streaming) is read again.
      if (shown && item.kind === "thought" && shown.chars !== item.chars && !shown.stale) { shown.stale = true; fetchDetail(); }
      if (shown) {
        const d = el("div", "detail" + (item.kind === "thought" ? " prose" : ""));
        for (const s of shown.sections) { if (s.title) d.append(el("h4", "", s.title)); d.append(el("pre", "", s.text)); }
        wrap.append(d);
      }
      if (item.detail) {
        const unfold = () => {
          if (details[key]) { delete details[key]; return drawConv(); }
          fetchDetail();
        };
        // Selecting text in the row is not a tap on it.
        b.onclick = () => { if (!selectingIn(b)) unfold(); };
        b.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); unfold(); } };
      }
      return wrap;
    }
    case "todo": return el("div", "item small", item.label + " (" + item.done + "/" + item.total + ")");
