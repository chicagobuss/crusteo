<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16161a">
<title>Skiff</title>
<style>
:root {
  --bg: #f6f6f8; --surface: #ffffff; --surface2: #eeeef2; --text: #17171c; --muted: #6b6b76;
  --faint: #9a9aa4; --border: #dcdce2; --accent: #3b6cf6; --warn: #c27c00; --bad: #d13b3b;
  --run: #2f8f5b; --sel: #e6ecff; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --pace: #2b7fd1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114; --surface: #1b1b20; --surface2: #25252c; --text: #ececf1; --muted: #a0a0ab;
    --faint: #6e6e78; --border: #2f2f37; --accent: #7b9dff; --warn: #f0b13a; --bad: #ff6b6b;
    --run: #4cc38a; --sel: #23283a; --pace: #79c0ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .55; cursor: default; }
button.on, button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--bad); }
button.plain { background: none; border: none; padding: 4px 6px; color: var(--accent); }
button.icon { background: none; border: none; padding: 4px 6px; line-height: 0; color: var(--muted); }
button.icon.off { opacity: .45; }
button.small { padding: 2px 8px; font-size: 13px; }
/* An on/off switch: a track with a knob that slides right when on. */
button.switch { position: relative; flex-shrink: 0; width: 46px; height: 28px; padding: 0; border-radius: 14px; }
button.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--muted); transition: transform .15s, background .15s; }
button.switch.on::after { transform: translateX(18px); background: #fff; }
select, input, textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; min-width: 0; }
[hidden] { display: none !important; }
.chips { display: flex; gap: 4px; overflow: hidden; margin-top: 3px; }
.chip { --c: var(--faint); flex-shrink: 0; font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px; color: var(--c);
  background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); }
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--c); }
.column.tinted { border-top: 3px solid var(--c); }
.column.tinted h3 { color: var(--c); }
.block.tinted { background: color-mix(in srgb, var(--c) 9%, var(--surface2)); border-color: color-mix(in srgb, var(--c) 40%, var(--border)); }
.block.tinted .name { color: var(--c); }
/* Map */
#mappane { flex: 1; }
.app.map { flex-direction: column; }
.app.map #listpane { flex: 0 0 auto; }
.app.map #listscroll { display: none; }
.map { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: var(--bg); }
.mboard { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.mboard.fly { transition: transform .28s ease; }
.block { position: absolute; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border);
  transition: left .4s, top .4s, width .4s, height .4s; overflow: hidden; }
.block .name { position: absolute; left: 6px; top: 3px; right: 30px; font-size: 12px; font-weight: 600; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.block .badge { position: absolute; right: 4px; top: 2px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px;
  background: var(--warn); color: #111; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
.tile { position: absolute; border-radius: 3px; background: var(--faint); transition: left .4s, top .4s, width .4s, height .4s; }
.tile.s-needs_input { background: var(--warn); } .tile.s-failed { background: var(--bad); } .tile.s-running { background: var(--run); }
.tile.s-done { background: color-mix(in srgb, var(--faint) 55%, var(--surface2)); }
.tile.s-running { animation: pulse 1.6s ease-in-out infinite; }
.tile.fresh { box-shadow: 0 0 0 2px var(--accent); }
.tile.ask::after { content: "!"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800;
  font-size: 70%; color: #111; }
@keyframes pulse { 50% { opacity: .45; } }
.mlane { position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y; background: var(--bg); -webkit-overflow-scrolling: touch;
  transition: opacity .2s; }
.mlane .lanehead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--bg); border-bottom: 1px solid var(--border); font-weight: 600; }
.mlane .lanehead .n { color: var(--faint); font-weight: 400; }
.mcard { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
  overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.mcard .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.mcard .line { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcard .reply { color: var(--text); opacity: .8; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mcard.flash { animation: flash 1.2s ease 2; }
@keyframes flash { 50% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); } }
.mnear { position: absolute; z-index: 5; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column; transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease, border-radius .25s; }
.mnear.full { border-radius: 0; border: none; }
.mnear #convpane { flex: 1; border: none; min-height: 0; touch-action: pan-y; }
.mtools { position: absolute; z-index: 4; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 6px; }
.minimap { position: absolute; z-index: 4; left: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); width: 84px; pointer-events: auto;
  background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.minimap i { position: absolute; background: var(--faint); opacity: .5; border-radius: 1px; }
.minimap i.on { background: var(--accent); opacity: .8; }
.minimap b { position: absolute; border: 1.5px solid var(--accent); border-radius: 2px; }

/* Top bar */
.top { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 6px) 12px 6px;
  border-bottom: 1px solid var(--border); background: var(--bg); }
.top .brand { font-weight: 700; font-size: 16px; }
.top .grow { flex: 1; min-width: 0; font-size: 12px; color: var(--bad); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; gap: 4px; align-items: center; background: none; border: none; padding: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; display: block; background: var(--faint); }
.dots i.online { background: var(--run); } .dots i.connecting { background: var(--warn); }
.dots i.offline, .dots i.refused { background: var(--bad); }

/* Panes */
.app { flex: 1; min-height: 0; display: flex; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#listpane { flex: 1; }
#convpane { flex: 1; border-left: 1px solid var(--border); }
.app.phone #listpane, .app.phone #convpane { flex: 1; border: none; }
.app.split #listpane { flex: 0 0 380px; }
.app.board #convpane { flex: 0 0 min(calc(80ch + 48px), 46vw); }
.scroll { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
.app.board #listscroll { overflow-x: auto; overflow-y: hidden; }
.app.board #listbody { height: 100%; padding: 0; }
.placeholder { color: var(--faint); text-align: center; padding-top: 30vh; }

/* List pane */
.toolbar { flex-shrink: 0; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
.tabs { display: flex; gap: 6px; align-items: center; }
.tabs .grow { flex: 1; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; }
.controls input { flex: 1 1 140px; }
.controls select { flex: 0 1 auto; }
#listbody { padding: 4px 12px 24px; }
.section { margin: 6px 0; }
.section > button.head { display: flex; width: 100%; gap: 6px; align-items: center; background: none; border: none;
  padding: 8px 2px 4px; font-weight: 600; color: var(--muted); text-align: left; }
.section > button.head .n { font-weight: 400; color: var(--faint); }
.section > button.head .chev { transition: transform .15s; display: inline-block; }
.section.closed > button.head .chev { transform: rotate(-90deg); }
.row { display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 4px 8px 10px; margin: 6px 0; cursor: pointer; }
.row.sel { background: var(--sel); border-color: var(--accent); }
.row .body { flex: 1; min-width: 0; }
.row .top1 { display: flex; gap: 8px; align-items: baseline; }
.row .title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .when { color: var(--faint); font-size: 12px; flex-shrink: 0; }
.row .line { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A background workspace's agent: Paseo's word, muted, on the line it has. */
.bgtag { font-size: 11px; line-height: 14px; padding: 0 4px; border-radius: 3px; border: 1px solid var(--faint); color: var(--faint); }
.row .reply { color: var(--text); opacity: .8; }
.row .ask { color: var(--warn); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--faint); }
.s-needs_input { background: var(--warn); } .s-failed { background: var(--bad); } .s-running { background: var(--run); }
.board { display: flex; gap: 12px; padding: 8px 12px 16px; height: 100%; align-items: stretch; }
.column { flex: 0 0 300px; width: 300px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; min-height: 0; background: var(--surface2);
  border-radius: 12px; padding: 8px; }
.column h3 { margin: 2px 4px 6px; font-size: 14px; display: flex; gap: 6px; }
.column h3 .n { color: var(--faint); font-weight: 400; }
.column .scroll { padding: 0 2px; }
.column .row { margin: 6px 0; }
.empty, .note { color: var(--muted); text-align: center; padding: 24px 0; }
.more { display: block; margin: 8px auto; }

/* Conversation pane */
/* Text on the left in three rows; on the right, two rows of things to tap: the actions, then the labels. */
.convhead { flex-shrink: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) clamp(132px, 38%, 360px);
  align-items: center; gap: 4px 6px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--border); }
.convhead .headtext { grid-column: 2; grid-row: 1 / 3; min-width: 0; }
.convhead h2 { margin: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.convhead .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.convhead #back { grid-column: 1; grid-row: 1 / 3; width: 36px; height: 36px; margin-left: -8px; padding: 0; display: grid; place-items: center; }
.convhead .headside { display: contents; }
.convhead .acts { grid-column: 3; grid-row: 1; align-self: start; display: flex; justify-content: flex-end; gap: 2px; margin: -2px -4px 0 0; }
.convhead .acts button.icon { padding: 5px; }
.convhead .tagrow { grid-column: 3; grid-row: 2; align-self: end; display: flex; align-items: center; gap: 2px; min-width: 0; }
/* Few labels sit at the right under the actions; more than fit are cut, and the chevron shows the rest. */
.convhead .tagrow .chips { flex: 0 1 auto; min-width: 0; margin: 0 0 0 auto; cursor: pointer; }
.convhead .tagrow .chip { font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 10px; }
.convhead #convmore { flex: 0 0 auto; margin: -4px -4px -4px 0; padding: 4px; color: var(--accent); }
/* Open, the labels get a full-width row of their own under everything. */
.convhead.full .tagrow { grid-column: 2 / 4; grid-row: 3; align-items: flex-end; }
.convhead.full .tagrow .chips { flex: 1 1 auto; margin: 0; flex-wrap: wrap; }
.convhead.full #convmore svg { transform: rotate(180deg); }
.mlane .lanehead .plain { display: flex; align-items: center; gap: 2px; padding: 4px 6px 4px 0; }
.measure { max-width: 80ch; margin: 0 auto; padding: 8px 16px 16px; }
.turn { margin: 14px 0; }
.item { margin: 6px 0; overflow-wrap: anywhere; }
.user { background: var(--surface2); border-radius: 12px; padding: 8px 12px; margin-left: 12%; white-space: pre-wrap; }
.shots { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; white-space: normal; }
.shots:last-child { margin-bottom: 2px; }
.shots img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); cursor: zoom-in; }
/* An image in a reply: as wide as it is, at most the column. */
.rimg { display: block; max-width: 100%; max-height: 60vh; margin: 6px 0; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); cursor: zoom-in; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.9); display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
/* A swipe back: what is being left follows the finger. */
.swiping { will-change: transform; box-shadow: -8px 0 24px rgba(0,0,0,.25); }
.app.peek { position: relative; }
.app.peek #convpane { position: absolute; inset: 0; z-index: 3; background: var(--bg); }
/* Usage: the tightest account's dial in the top bar, and a panel that
   slides in from the right with every account. */
.ugauge { display: flex; align-items: center; gap: 4px; background: none; border: none; padding: 4px 6px;
  font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.ugauge.stale { opacity: .45; }
.sev-critical { color: var(--bad); } .sev-warn { color: var(--warn); } .sev-on_pace { color: var(--pace); }
.sev-surplus { color: var(--run); } .sev-unknown { color: var(--muted); }
.drawerback { position: fixed; inset: 0; z-index: 11; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .2s; }
.drawerback.open { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 12; width: min(380px, 88vw); background: var(--bg);
  border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.25); transform: translateX(100%);
  transition: transform .22s ease-out; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 8px) 0 env(safe-area-inset-bottom); }
.drawer.open { transform: none; }
.drawer .sheethead { padding: 0 14px 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.drawer .sheethead h3 { margin: 4px 0; font-size: 16px; }
.drawer .body { flex: 1; overflow-y: auto; padding: 4px 14px 16px; }
.pool { padding: 10px 0; border-bottom: 1px solid var(--border); }
.pool.stale { opacity: .5; }
.pool .who { display: flex; gap: 6px; align-items: baseline; font-weight: 600; }
.pool .who .acct { flex: 1; min-width: 0; font-weight: 400; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pool .who .pace { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.pool .why { color: var(--warn); font-size: 12px; margin-top: 2px; }
/* Numbers kept from before a failed read, marked as Paseo marks them: a
   red dot for an error, a muted one for an account unavailable. */
.pool .who .fail { width: 8px; height: 8px; border-radius: 4px; background: var(--muted); align-self: center; flex-shrink: 0; }
.pool .who .fail.error { background: var(--bad); }
.pool .why.failed { color: var(--bad); white-space: pre-line; }
.pool .why.last { color: var(--muted); }
.pool .hint { color: var(--accent); font-size: 12px; margin-top: 4px; }
/* Each window a line of one table: period, what is left as a bar and a
   number, the reset, the pace. */
.wgroup { margin-top: 8px; font-size: 13px; }
.wline { display: grid; grid-template-columns: 5em 1fr 2.6em 3.2em 6.4em; gap: 8px; align-items: center;
  margin-top: 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
.wline.heads { margin: 6px 0 -2px; font-size: 11px; color: var(--faint); }
.wline .n { text-align: right; }
.wline .faint { color: var(--muted); }
.wline .per { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wline .mark { display: inline-block; width: 1em; }
.wline .bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; display: flex; justify-content: flex-end; }
.wline .bar i { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.convsub .ctx.warn { color: var(--warn); } .convsub .ctx.bad { color: var(--bad); }
.assistant p { margin: 6px 0; }
.assistant p.h { font-weight: 700; margin-top: 12px; }
.assistant ul, .assistant ol { margin: 6px 0; padding-left: 22px; }
.assistant li { margin: 2px 0; }
.assistant a { color: var(--accent); }
.assistant .tablewrap { overflow-x: auto; margin: 8px 0; -webkit-overflow-scrolling: touch; }
.assistant table { border-collapse: collapse; font-size: 13px; line-height: 1.35; }
.assistant th, .assistant td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top;
  min-width: 6em; max-width: 28em; }
.assistant th { background: var(--surface2); font-weight: 600; white-space: nowrap; }
.assistant pre, .detail pre { background: var(--surface2); border-radius: 8px; padding: 8px; overflow-x: auto;
  font: 12.5px/1.4 var(--mono); white-space: pre; max-width: 100%; }
/* A thought is prose, not code: wrap it instead of scrolling sideways. */
.detail.prose pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.assistant code { font: 13px var(--mono); background: var(--surface2); padding: 0 3px; border-radius: 4px; }
.tool { display: flex; gap: 6px; align-items: baseline; color: var(--muted); font-size: 13px; width: 100%;
  text-align: left; background: none; border: none; padding: 2px 0; }
.tool .name { flex-shrink: 0; }
.tool .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
.tool.failed .name { color: var(--bad); } .tool.running .name::after { content: " ..."; }
/* The agent a row names, as in "From planner" or "worker finished". */
.tool .who { flex-shrink: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); opacity: .8; font-weight: 400; }
.tool .who.link { cursor: pointer; }
.tool .who.link:hover { opacity: 1; text-decoration: underline; }
.tool .sum.prose { font-family: inherit; font-size: 13px; }
.small { color: var(--muted); font-size: 13px; }
.error { color: var(--bad); font-size: 13px; margin-top: 4px; }
.detail h4 { margin: 6px 0 2px; font-size: 12px; color: var(--muted); }
.footer { color: var(--faint); font-size: 12px; margin-top: 4px; }
.card { border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; margin: 12px 0; background: var(--surface); }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card .q { margin: 10px 0 4px; font-weight: 600; }
.card label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; }
.card label input { margin-top: 3px; }
.card .other { width: 100%; margin-top: 4px; }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 10px; }

/* Composer */
.composer { flex-shrink: 0; border-top: 1px solid var(--border); padding: 6px 12px calc(env(safe-area-inset-bottom) + 8px); }
.composer .measure { padding: 0; }
.working { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--run); padding: 2px 0 6px; }
.queued { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); padding: 0 0 4px; }
.queued .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queued.bad .t { color: var(--bad); }
.field { position: relative; display: flex; align-items: flex-end; background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 4px 4px 4px 12px; }
.field .send, .field .steer { align-self: flex-end; }
.field textarea { flex: 1; border: none; background: none; padding: 6px 0; resize: none; outline: none; max-height: 40vh;
  line-height: 1.4; min-height: calc(1.4em + 12px); align-self: center; }
.field .steer { font-size: 12px; padding: 4px 8px; margin: 0 4px 3px; border-radius: 12px; }
.field .send { width: 32px; height: 32px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex-shrink: 0;
  background: var(--accent); color: #fff; border: none; }
.field .send:disabled { background: var(--surface2); color: var(--faint); }
.field .add { width: 32px; height: 32px; padding: 0; margin: 0 4px 0 -8px; display: grid; place-items: center; flex-shrink: 0;
  border-radius: 50%; color: var(--muted); align-self: flex-end; }
.attached { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 6px; }
.attached .thumb { position: relative; flex-shrink: 0; width: 56px; height: 56px; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--border); background: var(--surface2); }
.attached img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attached .thumb button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; padding: 0; border-radius: 50%;
  display: grid; place-items: center; background: rgba(0,0,0,.6); color: #fff; border: none; line-height: 0; }

/* Overlays */
.toasts { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 8px; right: 8px; z-index: 10;
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--border);
  border-left: 4px solid var(--run); border-radius: 10px; padding: 8px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.25); cursor: pointer; }
.toast.failed { border-left-color: var(--bad); }
.toast b, .toast span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast span { font-size: 13px; color: var(--muted); }
.sheet { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center;
  padding: calc(env(safe-area-inset-top) + 48px) 12px 12px; }
.sheet .box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; width: 100%; max-width: 440px;
  max-height: 80vh; overflow: auto; }
.sheet h3 { margin: 4px 0 8px; font-size: 16px; }
.sheet .sheethead { display: flex; align-items: center; justify-content: space-between; }
.sheet .sheethead h3 { margin: 4px 0; }
.hostedit { cursor: pointer; }
.hostedit .addr { margin-top: 1px; }
.setting { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.hostline { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); }
.hostline .dots { padding: 0; }
.hostline .name { font-weight: 600; } .hostline .why { color: var(--muted); font-size: 12px; }
.sheet h4 { margin: 14px 0 2px; font-size: 14px; }
.hostedit { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.hostedit .body { flex: 1; min-width: 0; }
.hostedit .addr { color: var(--muted); font-size: 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hostadd { display: flex; flex-direction: column; gap: 6px; padding: 10px 0 4px; }
.hostadd input { width: 100%; }
/* Panels: the new-agent form, the label editor and confirmations. They
   rise from the bottom on a phone and sit in the middle on a desk, and
   redraw only themselves, so typing in them is never interrupted. */
.panel { position: fixed; inset: 0; z-index: 13; background: rgba(0,0,0,.4); display: flex; align-items: flex-end;
  justify-content: center; }
.panel .box { background: var(--bg); border: 1px solid var(--border); border-bottom: none; border-radius: 14px 14px 0 0;
  width: 100%; max-width: 520px; max-height: calc(100dvh - env(safe-area-inset-top) - 16px); display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
.panel.small .box { max-width: 420px; }
@media (min-width: 900px) {
  .panel { align-items: center; }
  .panel .box { border-radius: 14px; border-bottom: 1px solid var(--border); max-height: 86vh; }
}
.panel .phead { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.panel .phead h3 { flex: 1; min-width: 0; margin: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel .pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 14px; -webkit-overflow-scrolling: touch; }
.panel .pfoot { flex-shrink: 0; display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); }
.panel .pfoot .error { flex: 1; min-width: 0; margin: 0; }
.panel .pfoot .grow { flex: 1; }
.panel .lead { margin: 10px 0 4px; color: var(--muted); }
.form .f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
.form select, .form input, .form textarea { width: 100%; }
.form textarea { resize: vertical; min-height: 5.5em; line-height: 1.4; }
.form .pair { display: flex; gap: 8px; }
.form .pair > * { flex: 1 1 0; min-width: 0; }
.form .other { margin-top: 6px; }
.chips.edit { flex-wrap: wrap; overflow: visible; gap: 6px; margin-top: 4px; }
.chip.big { font-size: 13px; line-height: 26px; padding: 0 4px 0 10px; border-radius: 13px; display: inline-flex; align-items: center; gap: 2px; }
.chip.big button { background: none; border: none; color: inherit; padding: 0 4px; line-height: 0; height: 26px; }
.chip.add { padding: 0 10px; cursor: pointer; font: inherit; font-size: 13px; line-height: 26px; height: 28px; }
.chip.add::before { content: "+ "; }
.newlabel { display: flex; gap: 6px; margin-top: 8px; }
.newlabel input { flex: 1; }
.convsub { display: flex; align-items: center; gap: 6px; margin-top: 2px; min-width: 0; }
.convsub .spec { flex: 0 1 auto; min-width: 0; font-size: 11px; line-height: 16px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convsub .ctx { flex: 0 0 auto; margin-left: -3px; font-size: 11px; line-height: 16px; color: var(--muted); white-space: nowrap; }
.convsub .ctx[hidden] { display: none; }
.convsub .spec:empty { display: none; }
button.icon.accent { color: var(--accent); }
button.primary.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.status { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 80px); left: 50%; transform: translateX(-50%); z-index: 8;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 16px; padding: 4px 12px; font-size: 13px; }
.signin { max-width: 420px; margin: 40px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div class="top">
  <span class="brand">crusteo</span>
  <button class="dots" id="dots" aria-label="Hosts"></button>
  <span class="grow" id="down"></span>
  <button class="ugauge" id="usage" aria-label="Usage" hidden></button>
  <button class="icon accent" id="new" aria-label="New agent" title="New agent"></button>
  <button class="icon" id="gear" aria-label="Settings"></button>
</div>
<div class="app phone" id="app">
  <section class="pane" id="listpane">
    <div class="toolbar">
      <div class="tabs">
        <button id="tab-ny" class="on">Needs you</button>
        <button id="tab-all">Agents</button>
        <button id="tab-map">Map</button>
        <span class="grow"></span>
        <button class="plain" id="filters-toggle" hidden>Filters</button>
      </div>
      <div class="controls" id="controls" hidden>
        <input id="query" type="search" placeholder="Search" autocomplete="off">
        <select id="group" aria-label="Group"></select>
        <select id="sort" aria-label="Sort"></select>
        <select id="host" aria-label="Host"></select>
        <select id="label" aria-label="Label"></select>
        <select id="state" aria-label="State"></select>
        <select id="background" aria-label="Background workspaces"></select>
      </div>
    </div>
    <div class="scroll" id="listscroll"><div id="listbody"></div></div>
  </section>
  <section class="pane" id="convpane" hidden>
    <div class="convhead">
      <button class="plain" id="back" aria-label="Back"></button>
      <div class="headtext"><h2 id="title"></h2><div class="meta" id="convmeta"></div>
        <div class="convsub" id="convsub" hidden><span class="spec" id="convspec"></span><span class="ctx" id="convctx" hidden></span></div></div>
      <div class="headside">
        <div class="acts">
          <button class="icon" id="bell" aria-label="Notifications for this agent"></button>
          <button class="icon" id="labels" aria-label="Labels" title="Labels"></button>
          <button class="icon" id="archive" aria-label="Archive" title="Archive"></button>
          <button class="icon" id="delete" aria-label="Delete" title="Delete"></button>
          <button class="icon" id="close" aria-label="Close"></button>
        </div>
        <div class="tagrow"><div class="chips" id="convlabels" title="Edit labels"></div>
          <button class="icon" id="convmore" aria-label="Show all labels" title="Show all labels" hidden></button></div>
      </div>
    </div>
    <div class="scroll" id="convscroll"><div class="measure" id="convbody"></div></div>
    <div class="composer"><div class="measure">
      <div class="working" id="working" hidden></div>
      <div id="queue"></div>
      <div class="attached" id="attached" hidden></div>
      <div class="field">
        <button class="icon add" id="add" aria-label="Add images" title="Add images"></button>
        <input type="file" id="files" accept="image/*" multiple hidden>
        <textarea id="draft" rows="1" placeholder="Message"></textarea>
        <button class="steer" id="steer" hidden title="Send into the running turn now">Steer</button>
        <button class="send" id="send" aria-label="Send"></button>
      </div>
      <div class="error" id="send-error" hidden></div>
    </div></div>
  </section>
  <section class="pane" id="mappane" hidden>
    <div class="map" id="map">
      <div class="mboard" id="board"></div>
      <div class="mlane" id="lane" hidden></div>
      <div class="mnear" id="near" hidden></div>
      <div class="minimap" id="minimap"></div>
      <div class="mtools"><button class="small" id="fit">Fit all</button></div>
    </div>
  </section>
</div>
<div class="toasts" id="toasts"></div>
<div class="status" id="status" hidden></div>
<script>
"use strict";
// Views are kept by applying Reef's snapshots and deltas
// (docs/reef/design.md). The list and the conversation each draw only
// themselves; the toolbar and the composer are never redrawn under you.
const $ = (id) => document.getElementById(id);
const views = {};          // "list" | "conv" -> {seq, fields, parts}
const pending = {};        // req -> callback
const details = {};        // item id -> detail, once fetched
const busy = {};           // action key -> true while it runs
const failed = {};         // action key -> what went wrong
const forms = {};          // ask id -> {selected, other}
let ws = null, open = null, backoff = 1000, nextReq = 0, hosts = [], settings = {}, labelColors = {};
// Turns the open conversation shows, asked for again on a reconnect, and
// whether the reader is at its end, so it follows what comes.
let convTurns = 3, following = true;

const STATES = { needs_input: "Needs input", failed: "Failed", running: "Working", done: "Done" };
const GROUPS = { none: "No groups", state: "By state", host: "By host", label: "By label", combination: "By combination",
  workspace: "By workspace" };
const SORTS = { recent: "Recent first", needs: "Needs you first", name: "By name" };
const PER_GROUP = 25;

// ---- preferences, per device --------------------------------------------

// Before the rename to Skiff these keys began with hub-. Move them once,
// so a phone keeps its choices and its token.
for (const [from, to] of [["hub-prefs", "skiff-prefs"], ["hub-token", "skiff-token"]]) {
  try {
    const old = localStorage.getItem(from);
    if (old !== null) {
      if (localStorage.getItem(to) === null) localStorage.setItem(to, old);
      localStorage.removeItem(from);
    }
  } catch (e) {}
}

// background: "" follows Reef's setting, else "shown" or "hidden".
const prefs = Object.assign({ tab: "ny", group: "label", sort: "recent", query: "", host: "", label: "", state: "",
  background: "", collapsed: {}, more: {}, filters: false }, (() => { try { return JSON.parse(localStorage.getItem("skiff-prefs")) || {}; } catch (e) { return {}; } })());
// Labels are how a fleet is organised, as in crusteo's Lanes: group by
// them unless this device chose otherwise.
if (!prefs.groupChosen) prefs.group = "label";
function savePrefs() { try { localStorage.setItem("skiff-prefs", JSON.stringify(prefs)); } catch (e) {} }
// Whether lists show agents of Paseo's background workspaces: this
// device's choice, else Reef's.
function showsBackground() { return prefs.background ? prefs.background === "shown" : settings.show_background !== false; }
// Background workspaces' agents as a label: the label filter's choice
// (no label is spelt with a control character) and, by label, their group.
const BG_LABEL = "\u0000background", BG_GROUP = "background";

function token() {
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("token")) {
    try { localStorage.setItem("skiff-token", hash.get("token")); } catch (e) {}
    history.replaceState(null, "", location.pathname);
    return hash.get("token");
  }
  try { return localStorage.getItem("skiff-token"); } catch (e) { return null; }
}

function newId() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}

// ---- layout ----------------------------------------------------------------

const wide = matchMedia("(min-width: 900px)"), wider = matchMedia("(min-width: 1400px)");
const coarse = matchMedia("(pointer: coarse)");
function layout() {
  if (prefs.tab === "map") return "map";
  if (!wide.matches) return "phone";
  if (wider.matches && prefs.tab === "all" && prefs.group !== "none") return "board";
  return "split";
}

// ---- connection --------------------------------------------------------------

function status(text) { $("status").hidden = !text; $("status").textContent = text || ""; }
function send(message) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(message)); }
function ask(message, then) { const req = "r" + (++nextReq); pending[req] = then; send(Object.assign({ req }, message)); }

// Runs an action, keeping its button busy and its error until it answers.
function act(key, message, then) {
  if (busy[key]) return;
  busy[key] = true; delete failed[key]; drawAll();
  ask(Object.assign({ type: "action" }, message), (r) => {
    delete busy[key];
    if (!r.ok) failed[key] = (r.error && r.error.message) || "That did not work";
    if (then) then(r);
    drawAll();
  });
}

// With no token yet, try without one: an open Reef needs none, and one that
// does says so, which brings up the sign-in form.
// One socket at a time. A retry timer and coming back to the page could
// both reconnect; the second must replace the first, not run beside it, or
// every notification and update arrives once per socket.
let retry = null;
function connect() {
  clearTimeout(retry); retry = null;
  if (ws) { const old = ws; ws = null; old.onclose = old.onmessage = null; try { old.close(); } catch (e) {} }
  const t = token() || "";
  status("Connecting...");
  const sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws = sock;
  sock.onopen = () => { if (ws === sock) send({ type: "hello", v: 0, token: t, device: navigator.userAgent.slice(0, 60) }); };
  sock.onmessage = (event) => { if (ws === sock) receive(JSON.parse(event.data)); };
  sock.onclose = () => {
    if (ws !== sock) return;
    ws = null;
    for (const req in pending) { pending[req]({ ok: false, error: { message: "Connection lost" } }); delete pending[req]; }
    status("Offline; retrying...");
    retry = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };
}

function signIn(problem) {
  const body = $("listbody");
  body.innerHTML = "";
  const form = el("form", "signin");
  form.append(el("div", "small", problem || "Paste the device token Reef printed when it started."));
  const input = el("input"); input.placeholder = "device token"; input.autocomplete = "off";
  form.append(input, el("button", "primary", "Sign in"));
  form.onsubmit = (e) => { e.preventDefault(); try { localStorage.setItem("skiff-token", input.value.trim()); } catch (err) {} connect(); };
  body.append(form);
  status("");
}

function receive(m) {
  switch (m.type) {
    case "welcome":
      backoff = 1000; status(""); hosts = m.hosts; settings = m.settings || {}; labelColors = m.labels || {};
      // Keep showing what was there until each view's new snapshot replaces
      // it: wiping first flashes "Loading..." and loses the reader's place.
      for (const id in views) views[id].stale = true;
      fillSelects(); subscribeList(); if (open) subscribeConv();
      // Usage is one small view Reef keeps current itself.
      send({ type: "subscribe", id: "usage", view: "usage" });
      return drawAll();
    case "hosts": hosts = m.hosts; labelColors = m.labels || labelColors; fillSelects(); drawChrome(); drawList(); drawMap();
      // Not under a finger that is typing: rebuilding would close the keyboard.
      if (panel && panel.kind === "create" && !composing()) drawPanel();
      return sheet && !composing() && drawSheet();
    case "settings": settings = m.settings; if (fillSelects()) subscribeList(); drawChrome(); return drawSheet();
    case "notification": return notify(m);
    case "snapshot":
      // One the previous agent's view sent before Reef had the new
      // subscription: not this conversation's.
      if (m.id === "conv" && m.agent && (!open || m.agent.id !== open.id || m.agent.host !== open.host)) return;
      views[m.id] = { seq: m.seq, fields: m, parts: m.rows || m.turns || m.tiles || [], cards: m.cards || [] }; break;
    case "delta": if (!applyDelta(m)) return; break;
    case "result":
      if (pending[m.req]) { const then = pending[m.req]; delete pending[m.req]; then(m); }
      return;
    case "error":
      if (m.code === "unauthorized") {
        let had = null;
        try { had = localStorage.getItem("skiff-token"); localStorage.removeItem("skiff-token"); } catch (e) {}
        ws.onclose = null; ws.close(); ws = null;
        return signIn(had ? "That token was not accepted. Paste a current one." : null);
      }
      if (m.id) status(m.message);
      return;
    default: return;
  }
  if (m.id === "list") drawList(); else if (m.id === "conv") drawConv(); else if (m.id === "map") drawMap();
  else if (m.id === "usage") drawUsage();
}

function reorder(parts, order, key) {
  const by = new Map(parts.map((p) => [p[key], p]));
  return order.map((k) => by.get(k)).filter(Boolean);
}

function applyDelta(m) {
  const v = views[m.id];
  if (!v || m.seq !== v.seq + 1) { send({ type: "resync", id: m.id }); return false; }
  v.seq = m.seq;
  for (const [k, value] of Object.entries(m)) {
    if (!["type", "id", "seq", "upsert", "remove", "order", "turns", "tiles", "cards"].includes(k)) v.fields[k] = value;
  }
  if (m.remove) v.parts = v.parts.filter((p) => !m.remove.includes(p.key));
  for (const row of m.upsert || []) {
    const i = v.parts.findIndex((p) => p.key === row.key);
    if (i >= 0) v.parts[i] = row; else v.parts.push(row);
  }
  for (const patch of m.turns || []) {
    const turn = v.parts.find((t) => t.key === patch.key);
    if (!turn) { v.parts.push(patch); continue; }
    for (const [k, value] of Object.entries(patch)) {
      if (k === "key" || k === "items" || k === "order") continue;
      if (value === null) delete turn[k]; else turn[k] = value;
    }
    for (const item of patch.items || []) {
      const i = turn.items.findIndex((x) => x.id === item.id);
      if (item.append !== undefined && i >= 0) { turn.items[i].text += item.append; turn.items[i].at = item.at; }
      else if (i >= 0) turn.items[i] = item; else turn.items.push(item);
    }
    if (patch.order) turn.items = reorder(turn.items, patch.order, "id");
  }
  if (m.order) v.parts = reorder(v.parts, m.order, "key");
  // A map nests its two lists.
  if (m.tiles) applyRows(v, "parts", m.tiles);
  if (m.cards) applyRows(v, "cards", m.cards);
  return true;
}

function applyRows(v, field, changes) {
  if (changes.remove) v[field] = v[field].filter((p) => !changes.remove.includes(p.key));
  for (const row of changes.upsert || []) {
    const i = v[field].findIndex((p) => p.key === row.key);
    if (i >= 0) v[field][i] = row; else v[field].push(row);
  }
  if (changes.order) v[field] = reorder(v[field], changes.order, "key");
}

function subscribeList() {
  if (prefs.tab !== "map" && views.map) { send({ type: "unsubscribe", id: "map" }); delete views.map; }
  if (prefs.tab === "ny") return send({ type: "subscribe", id: "list", view: "needs_you", limit: 50 });
  const filter = { query: prefs.query };
  if (prefs.host) filter.hosts = [prefs.host];
  if (prefs.label) filter.labels = [prefs.label];
  if (prefs.state) filter.states = [prefs.state];
  // Left out, Reef's setting decides.
  if (prefs.background) filter.background = prefs.background === "shown";
  if (prefs.tab === "map") {
    send({ type: "unsubscribe", id: "list" }); delete views.list;
    mapState.focusSent = "";
    return send({ type: "subscribe", id: "map", view: "map", group: prefs.group, filter, focus: [] });
  }
  const grouped = prefs.group !== "none";
  const board = layout() === "board";
  send({ type: "subscribe", id: "list", view: "agents", group: prefs.group, sort: prefs.sort, filter,
    limit: grouped ? PER_GROUP : 40 + (prefs.more[""] || 0),
    collapsed: grouped && !board ? prefs.collapsed[prefs.group] || [] : [],
    more: grouped ? prefs.more : {} });
}

function subscribeConv() {
  send({ type: "subscribe", id: "conv", view: "conversation", host: open.host, agent: open.id, turns: convTurns });
}

function openAgent(agent) {
  if (open && views.conv) send({ type: "unsubscribe", id: "conv" });
  delete views.conv;
  convTurns = 3; following = true;
  $("draft").value = ""; sizeDraft();
  attached = []; drawAttached();
  open = agent; firstDraw = true;
  if (open) subscribeConv(); else send({ type: "unsubscribe", id: "conv" });
  drawAll();
}

// ---- notifications ----------------------------------------------------------

function allowed() {
  // Permission is "default" until asked, then allowed or "denied"; the
  // export's leak check keeps the third word out of the source.
  try { return Notification.permission !== "default" && Notification.permission !== "denied"; } catch (e) { return false; }
}

// Each notice once, and one toast per agent: a newer one replaces it.
const noticed = new Set();
function notify(n) {
  // Ids restart with Reef, so the time goes with them.
  const seen = n.id + "@" + n.at;
  if (noticed.has(seen)) return;
  noticed.add(seen);
  for (const old of document.querySelectorAll("#toasts .toast")) if (old.dataset.key === n.key) old.remove();
  try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
  const target = { host: n.host, id: n.agent, title: n.title };
  const toast = el("div", "toast" + (n.state === "failed" ? " failed" : ""));
  toast.dataset.key = n.key || "";
  toast.append(el("b", "", (n.state === "failed" ? "Failed: " : "") + n.title), el("span", "", [n.host, n.body].filter(Boolean).join(" · ")));
  toast.onclick = () => { toast.remove(); if (prefs.tab === "map") flyTo(n.host, n.agent); else openAgent(target); };
  const stack = $("toasts");
  stack.prepend(toast);
  while (stack.children.length > 4) stack.lastChild.remove();
  setTimeout(() => toast.remove(), 7000);
  try {
    if (document.hidden && "Notification" in window && allowed()) {
      const system = new Notification(n.title, { body: [n.host, n.body].filter(Boolean).join(" · "), tag: n.key });
      system.onclick = () => { try { window.focus(); } catch (e) {} system.close(); if (prefs.tab === "map") flyTo(n.host, n.agent); else openAgent(target); };
    }
  } catch (e) {}
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function button(label, cls, key, onclick) {
  const b = el("button", cls, busy[key] ? "..." : label);
  b.disabled = !!busy[key];
  b.onclick = (e) => { e.stopPropagation(); onclick(); };
  return b;
}

// An on/off switch named for screen readers; it waits, dimmed, while `key` is busy.
function toggle(label, on, key, onclick) {
  const b = el("button", "switch" + (on ? " on" : ""));
  b.setAttribute("role", "switch");
  b.setAttribute("aria-checked", on ? "true" : "false");
  b.setAttribute("aria-label", label);
  b.disabled = !!busy[key];
  b.onclick = (e) => { e.stopPropagation(); onclick(); };
  return b;
}

function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!(s >= 0)) return "";
  if (s < 45) return "now";
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

function duration(s) {
  s = Math.max(0, Math.floor(s));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}

function fillSelects() {
  const fill = (id, options, value) => {
    const s = $(id); s.innerHTML = "";
    for (const [v, label] of options) { const o = el("option", "", label); o.value = v; s.append(o); }
    s.value = value;
  };
  fill("group", Object.entries(GROUPS), prefs.group);
  fill("sort", Object.entries(SORTS), prefs.sort);
  fill("host", [["", "Any host"], ...hosts.map((h) => [h.name, h.name])], prefs.host);
  // Reef's catalog, by id; a filter saved by name, before labels had ids,
  // becomes its label's id.
  const labels = Object.entries(labelColors).map(([id, l]) => [id, l.name]).sort((a, b) => a[1].localeCompare(b[1]));
  if (prefs.label && prefs.label !== BG_LABEL && !labelColors[prefs.label]) {
    const named = labels.find(([, name]) => labelKey(name) === labelKey(prefs.label));
    if (named) { prefs.label = named[0]; savePrefs(); }
  }
  // Background goes with them when they are hidden.
  const dropped = prefs.label === BG_LABEL && !showsBackground();
  if (dropped) { prefs.label = ""; savePrefs(); }
  fill("label", [["", "Any label"], ...labels, ...(showsBackground() ? [[BG_LABEL, "Background"]] : [])],
    prefs.label);
  fill("state", [["", "Any state"], ...Object.entries(STATES)], prefs.state);
  fill("background", [["", "Background: " + (settings.show_background === false ? "hidden" : "shown") + " (Reef)"],
    ["shown", "Background shown"], ["hidden", "Background hidden"]], prefs.background);
  $("query").value = prefs.query;
  return dropped;
}


// ---- labels -----------------------------------------------------------------------

function labelKey(name) { return name.split(/\s+/).filter(Boolean).join(" ").toLowerCase(); }
// A label nobody defined yet shows in the colour its name picks, as Reef
// picks it (Paseo's identity hash), so a new one keeps its colour.
const IDENTITY = ["#a392d5", "#6aa6ce", "#6cae96", "#cc8f64", "#d87da3", "#9299d5", "#6cacab", "#d88381", "#b29d64", "#7ba1d5"];
function identityColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (Math.imul(h, 31) + name.charCodeAt(i)) | 0;
  return IDENTITY[Math.abs(h) % IDENTITY.length];
}
// Reef sends the catalog's labels by id; rows name them.
function labelNamed(name) { const key = labelKey(name); return Object.values(labelColors).find((l) => labelKey(l.name) === key); }
function labelColor(name) { const l = labelNamed(name); return l ? l.color : identityColor(name.trim()); }
// A label group's colour, from its key ("label:" alone is No label).
function groupColor(key) {
  if (!key || !key.startsWith("label:") || key.length <= 6) return "";
  return (labelColors[key.slice(6)] || {}).color || "";
}
function tint(elm, color) { if (color) { elm.style.setProperty("--c", color); elm.classList.add("tinted"); } }
function chips(labels) {
  const box = el("div", "chips");
  for (const name of labels || []) {
    const chip = el("span", "chip", name);
    const color = labelColor(name);
    if (color) chip.style.setProperty("--c", color);
    box.append(chip);
  }
  return box;
}

// ---- the list ---------------------------------------------------------------------

function agentRow(row) {
  const r = el("div", "row" + (open && open.host === row.host && open.id === row.id ? " sel" : ""));
  const body = el("div", "body");
  const top = el("div", "top1");
  top.append(el("span", "dot s-" + row.state), el("span", "title", row.title), el("span", "when", ago(row.reply_at || row.at)));
  body.append(top);
  if (row.ask) body.append(el("div", "line ask", row.ask.question || row.ask.title + (row.ask.more ? " (+" + row.ask.more + ")" : "")));
  else if (row.reply) body.append(el("div", "line reply", row.reply));
  const meta = el("div", "line", [row.host, row.workspace || row.project, STATES[row.state]].filter(Boolean).join(" · "));
  // Not in the Background group, which says so already.
  if (row.background && row.group !== BG_GROUP) meta.append(" ", el("span", "bgtag", "background"));
  body.append(meta);
  if (row.labels && row.labels.length) body.append(chips(row.labels));
  const key = "notify:" + row.host + "/" + row.id;
  if (failed[key]) body.append(el("div", "error", failed[key]));
  const bell = button("...", "icon" + (row.notify === false ? " off" : ""), key, () => toggleNotify(row));
  if (!busy[key]) bell.innerHTML = bellFor(row);
  bell.title = row.notify === false ? "Notifications off" : "Notifications on";
  r.append(body, bell);
  r.onclick = () => openAgent({ host: row.host, id: row.id, title: row.title });
  return r;
}

function showMore(key, current) {
  prefs.more[key] = current + PER_GROUP; savePrefs(); subscribeList();
}

function drawList() {
  const pane = $("listpane");
  if (held(pane)) return later(drawList);
  const body = $("listbody");
  if (!ws) return;
  body.innerHTML = "";
  const v = views.list;
  if (!v) return body.append(el("div", "note", "Loading..."));
  if (prefs.tab === "ny") $("tab-ny").textContent = "Needs you" + (v.fields.total ? " (" + v.fields.total + ")" : "");
  const groups = v.fields.groups || [];
  if (!v.parts.length && !groups.length) {
    return body.append(el("div", "empty", prefs.tab === "ny" ? "Nothing waiting on you" : "No agents match"));
  }
  if (!groups.length || prefs.tab === "ny") {
    for (const row of v.parts) body.append(agentRow(row));
    if (v.fields.total > v.parts.length) {
      const more = el("button", "more", "Show more");
      more.onclick = () => showMore("", prefs.more[""] || 0);
      body.append(more);
    }
    return;
  }
  const byGroup = new Map(groups.map((g) => [g.key, []]));
  for (const row of v.parts) if (byGroup.has(row.group)) byGroup.get(row.group).push(row);
  if (layout() === "board") {
    const board = el("div", "board");
    for (const g of groups) {
      const col = el("div", "column");
      tint(col, groupColor(g.key));
      const h = el("h3", "", g.label); h.append(el("span", "n", String(g.total)));
      const list = el("div", "scroll");
      for (const row of byGroup.get(g.key)) list.append(agentRow(row));
      if (g.total > byGroup.get(g.key).length) {
        const more = el("button", "more small", "Show more");
        more.onclick = () => showMore(g.key, prefs.more[g.key] || PER_GROUP);
        list.append(more);
      }
      col.append(h, list);
      board.append(col);
    }
    body.append(board);
    return;
  }
  const collapsed = prefs.collapsed[prefs.group] || [];
  for (const g of groups) {
    const closed = collapsed.includes(g.key);
    const section = el("div", "section" + (closed ? " closed" : ""));
    const head = el("button", "head");
    head.append(el("span", "chev", "▾"));
    const color = groupColor(g.key);
    if (color) { const dot = el("span", "swatch"); dot.style.setProperty("--c", color); head.append(dot); }
    head.append(el("span", "", g.label), el("span", "n", String(g.total)));
    head.onclick = () => {
      const list = new Set(prefs.collapsed[prefs.group] || []);
      if (closed) list.delete(g.key); else list.add(g.key);
      prefs.collapsed[prefs.group] = [...list]; savePrefs(); subscribeList(); drawList();
    };
    section.append(head);
    if (!closed) {
      for (const row of byGroup.get(g.key)) section.append(agentRow(row));
      if (g.total > byGroup.get(g.key).length) {
        const more = el("button", "more small", "Show more");
        more.onclick = () => showMore(g.key, prefs.more[g.key] || PER_GROUP);
        section.append(more);
      }
    }
    body.append(section);
  }
}
