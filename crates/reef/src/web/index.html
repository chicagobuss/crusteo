}

// ---- the composer ----------------------------------------------------------------------

function working() { return !!(views.conv && views.conv.fields.working); }
function elapsed() {
  const since = views.conv && views.conv.fields.working && views.conv.fields.working.since;
  return "Working" + (since ? " " + duration((Date.now() - Date.parse(since)) / 1000) : "");
}

function sizeDraft() {
  const d = $("draft");
  // Measured while hidden it would be 0 tall; empty, it is one line anyway.
  if (!d.value || !d.offsetParent) { d.style.height = ""; return; }
  d.style.height = "auto";
  d.style.height = Math.min(d.scrollHeight, window.innerHeight * 0.4) + "px";
}

// Redrawn only when what it shows changes, so its buttons stay put under
// a finger while the conversation streams.
let composerDrawn = "";
function drawComposer() {
  const v = views.conv;
  const busyNow = working();
  const drawn = JSON.stringify([open && open.id, busyNow, v && v.fields.queued, busy, failed]);
  if (drawn === composerDrawn) return;
  composerDrawn = drawn;
  const bar = $("working");
  bar.hidden = !busyNow;
  bar.innerHTML = "";
  if (busyNow) {
    bar.append(el("span", "elapsed", elapsed()));
    bar.append(button("Stop", "danger small", "stop", () => act("stop", { action: "stop", host: open.host, agent: open.id })));
  }
  if (failed.stop) bar.append(el("span", "error", failed.stop));
  const queue = $("queue");
  queue.innerHTML = "";
  for (const m of (v && v.fields.queued) || []) {
    const row = el("div", "queued" + (m.error ? " bad" : ""));
    row.append(el("span", "t", (m.error ? "Not sent: " : "Next: ") + m.text + (m.images ? " [" + m.images + " image(s)]" : "")));
    row.append(button("Steer", "plain small", "steer:" + m.id, () =>
      act("steer:" + m.id, { action: "steer", host: open.host, agent: open.id, message_id: m.id })));
    const drop = button("", "icon", "drop:" + m.id, () =>
      act("drop:" + m.id, { action: "unqueue", host: open.host, agent: open.id, message_id: m.id }));
    if (!busy["drop:" + m.id]) drop.innerHTML = icon("close", 14);
    drop.title = "Drop";
    row.append(drop);
    queue.append(row);
  }
  $("steer").hidden = !busyNow;
  $("steer").disabled = !!busy.send;
  $("send").disabled = !!busy.send || !!shrinking;
  $("send").title = busyNow ? "Queue: send when this turn ends" : "Send";
  $("send").setAttribute("aria-label", busyNow ? "Queue" : "Send");
  $("send-error").hidden = !failed.send;
  $("send-error").textContent = failed.send || "";
}

function sendAs(action) {
  const text = $("draft").value;
  if ((!text.trim() && !attached.length) || !open || shrinking) return;
  const message = { action, host: open.host, agent: open.id, text, message_id: newId() };
  if (attached.length) message.images = attached.map((a) => ({ data: a.data, mime_type: a.mime }));
  // What you send is what you want to see next.
  following = true;
  toEnd();
  act("send", message, (r) => {
    if (r.ok) { $("draft").value = ""; sizeDraft(); attached = []; drawAttached(); }
  });
}

// ---- images to send with a message --------------------------------------------------
// A phone photo is shrunk before it goes: the long side to 2000px, as JPEG,
// so a message stays a few hundred KB rather than many MB.

const MAX_SIDE = 2000, MAX_ATTACHED = 8;
let attached = [], shrinking = 0;

function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      // PNGs keep their edges, as screenshots need, while they are small.
      const png = file.type === "image/png" && file.size < 1500000;
      const mime = png ? "image/png" : "image/jpeg";
      const dataUrl = canvas.toDataURL(mime, 0.85);
      resolve({ mime, data: dataUrl.slice(dataUrl.indexOf(",") + 1), url: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read " + (file.name || "that image"))); };
    img.src = url;
  });
}

async function addFiles(files) {
  failed.send = "";
  for (const file of files) {
    if (!/^image\//.test(file.type)) continue;
    if (attached.length + shrinking >= MAX_ATTACHED) { failed.send = "At most " + MAX_ATTACHED + " images"; break; }
    shrinking++; drawAttached();
    try { attached.push(await shrink(file)); } catch (e) { failed.send = e.message; }
    shrinking--; drawAttached();
  }
  composerDrawn = ""; drawComposer();
}

function drawAttached() {
  const box = $("attached");
  box.hidden = !attached.length && !shrinking;
  box.innerHTML = "";
  attached.forEach((a, i) => {
    const t = el("div", "thumb"), img = el("img");
    img.src = a.url; img.alt = "";
    const x = el("button"); x.innerHTML = icon("close", 12); x.setAttribute("aria-label", "Remove image");
    x.onclick = () => { attached.splice(i, 1); drawAttached(); };
    t.append(img, x); box.append(t);
  });
  for (let i = 0; i < shrinking; i++) box.append(el("div", "thumb"));
  $("send").disabled = !!busy.send || !!shrinking;
}

// The newest version of a provider's CLI any host runs.
function newestVersion(id) {
  let best = null;
  const num = (v) => String(v).split(/[^0-9]+/).filter(Boolean).map(Number);
  const less = (a, b) => { const x = num(a), y = num(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); } return false; };
  for (const h of hosts) for (const p of h.providers || []) {
    if (p.id === id && p.version && (best === null || less(best, p.version))) best = p.version;
  }
  return best;
}

// ---- panels: a new agent, labels, confirmations -------------------------------------------
// Each draws from its own state, kept here, and only when that changes:
// what is typed is stored as it is typed, so nothing a delta does closes
// the keyboard or loses it, and a redraw puts the focus back.

let panel = null;          // {kind: "create" | "labels" | "confirm", key, ...}
const labelDrafts = {};    // a label editor's "New label" text, by editor

function showPanel(state) { panel = state; drawPanel(); }
function closePanel() { panel = null; drawPanel(); }

function drawPanel() {
  const old = document.querySelector(".panel");
  if (!panel) { if (old) old.remove(); return; }
  const active = document.activeElement;
  const focused = old && active && old.contains(active) ? active.dataset.f : null;
  let caret = null;
  try { caret = focused && active.selectionStart; } catch (e) {}
  const scroll = old ? old.querySelector(".pbody").scrollTop : 0;
  const wrap = el("div", "panel" + (panel.kind === "confirm" ? " small" : ""));
  wrap.onclick = (e) => { if (e.target === wrap && !busy[panel.key]) closePanel(); };
  const box = el("div", "box");
  box.setAttribute("role", "dialog");
  const head = el("div", "phead"), body = el("div", "pbody"), foot = el("div", "pfoot");
  if (panel.kind === "create") drawCreate(head, body, foot);
  else if (panel.kind === "labels") drawLabels(head, body, foot);
  else if (panel.kind === "details") drawDetails(head, body, foot);
  else if (panel.kind === "about") drawAbout(head, body, foot);
  else drawConfirm(head, body, foot);
  if (panel.kind !== "confirm") {
    const cancel = el("button", "", panel.kind === "details" || panel.kind === "about" ? "Close" : "Cancel");
    cancel.onclick = closePanel;
    head.append(cancel);
  }
  foot.hidden = !foot.childElementCount;
  box.append(head, body, foot);
  wrap.append(box);
  if (old) old.replaceWith(wrap); else document.body.append(wrap);
  body.scrollTop = scroll;
  const again = focused && wrap.querySelector('[data-f="' + focused + '"]');
  if (again) { again.focus(); try { if (caret !== null) again.setSelectionRange(caret, caret); } catch (e) {} }
}

function field(box, label) { box.append(el("label", "f", label)); }
function select(name, options, value, onchange) {

}
function textField(tag, name, value, placeholder, oninput) {

    .filter((n) => !chosen.some((c) => labelKey(c) === labelKey(n))).sort((a, b) => a.localeCompare(b));

// The new-agent form. Its choices come from Reef per host (the host's

const OTHER = "\u0000other";

const createForm = { host: "", provider: "", model: "", mode: "", thinking: "", workspace: "", cwd: "", labels: [], labelsFor: null, text: "" };
const createOptions = {};  // host -> {loading, error, data}

function remembered(host) { return ((prefs.create || {}).hosts || {})[host] || {}; }

function openCreate() {
  const online = hosts.filter((h) => h.state === "online");
  const last = (prefs.create || {}).host;

  const host = current || online.find((h) => h.name === last) || online[0] || hosts[0];

function pickHost(host) {
  const r = remembered(host);
  Object.assign(createForm, { host, provider: r.provider || "", model: r.model || "", mode: r.mode || "",
    thinking: r.thinking || "", workspace: r.workspace || "", cwd: r.cwd || "" });
  if (host) loadOptions(host);
}

function loadOptions(host) {
  const known = createOptions[host] || {};
  if (known.loading) return;
  if (!ws || ws.readyState !== 1) { createOptions[host] = { error: "Offline", data: known.data }; return; }
  createOptions[host] = { loading: true, data: known.data };
  ask({ type: "create_options", host }, (r) => {
    createOptions[host] = r.ok ? { data: r } : { error: (r.error && r.error.message) || "Could not load the choices", data: known.data };
    if (panel && panel.kind === "create") drawPanel();

// What the form shows: the choices made, else each one's default.
function createChoices() {
  const data = (createOptions[createForm.host] || {}).data;
  if (!data) return null;
  const f = createForm;
  const ready = data.providers.filter((p) => p.ready);
  const provider = ready.find((p) => p.id === f.provider) || ready.find((p) => p.id === "claude") || ready[0] || null;
  const models = (provider && provider.models) || [], modes = (provider && provider.modes) || [];
  const model = models.find((m) => m.id === f.model) || models.find((m) => m.default) || models[0] || null;
  const mode = modes.find((m) => m.id === f.mode) || modes.find((m) => m.id === provider.mode) || null;
  const thinkings = (model && model.thinking) || [];
  const thinking = thinkings.find((t) => t.id === f.thinking) || thinkings.find((t) => t.id === model.thinking_default) || thinkings[0] || null;
  const workspaces = data.workspaces || [];
  const other = f.workspace === OTHER || !workspaces.length;
  const workspace = other ? null : workspaces.find((w) => w.id === f.workspace) || workspaces[0];
  return { ready, unready: data.providers.filter((p) => !p.ready), provider, model, mode, thinking, workspaces, workspace, other };

function submitCreate() {
  const c = createChoices(), f = createForm;
  if (!c || !c.provider || busy.create) return;

  const text = f.text.trim(), cwd = f.cwd.trim();

  const message = { action: "create", host: f.host, provider: c.provider.id, text, message_id: newId() };
  // Left as they started, Reef works the default out itself.

  const same = start.length === f.labels.length && f.labels.every((l) => start.some((s) => labelKey(s) === labelKey(l)));

    prefs.create = Object.assign({ hosts: {} }, prefs.create, { host: f.host });
    prefs.create.hosts[f.host] = { provider: message.provider, model: message.model, mode: message.mode, thinking: message.thinking,
      workspace: c.other ? OTHER : message.workspace, cwd: c.other ? cwd : "" };
    savePrefs();
    f.text = ""; f.labels = []; f.labelsFor = null;
    closePanel();
    if (r.labels_error) flash("Created, but not labelled", r.labels_error);
    const title = text.split("\n")[0];
    if (prefs.tab === "map") enterNear(r.key, null); else openAgent({ host: r.host, id: r.agent, title });
  });
  drawPanel();
}

// ---- an agent's details: the left of a conversation's header opens them --------
//
// What it runs on, where, whose it is and what it made, when things

function when(iso) {
  const t = Date.parse(iso);
  if (!t) return "";
  const d = new Date(t), today = new Date().toDateString() === d.toDateString();
  const at = today ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const back = ago(iso);
  return at + (back ? " (" + (back === "now" ? "just now" : back + " ago") + ")" : "");
}

// One "name: value" line; a value may be an element.
function fact(box, name, value, cls) {
  if (value === undefined || value === null || value === "") return;
  const line = el("div", "fact" + (cls ? " " + cls : ""));

}

// A copy button beside a value worth pasting elsewhere (an id, a path).
function copyable(text) {
  const span = el("span", "copyable", text);

  b.onclick = (e) => {

    try { navigator.clipboard.writeText(text).then(() => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy"; }, 1500); }); } catch (err) {}
  };

}

// ---- the map ------------------------------------------------------------------------------
//
// A board of every agent you move around like a map, drawn differently at
// each distance. Far: each lane is a block of small tiles, blocks packed
// to fill this screen's own shape (an ordered squarified treemap, so a
// portrait phone stacks them and a desk spreads them out). Middle: one
// lane's agents as cards, a grid as wide as the screen. Near: one card
// opens into its live conversation. Tiles keep the order agents were made
// in, so places stay put; how fresh each is shows in its colour instead.

// `fromList`: the open conversation came from the list, and goes back to it.
const mapState = { level: "far", lane: null, cam: { x: 0, y: 0, s: 1 }, layout: null, size: null,
  focusSent: "", near: null, fromList: false };
const tileEls = new Map(), blockEls = new Map(), bandEls = new Map();
const MID_BOX_W = 150, MID_BOX_H = 92, GAP = 8;
// A band's name strip, over its lanes.
const BAND_HEAD = 22;
// How thin a section of the map (a band, or the other lanes) may get, and
// a lane's block, where the shape allows.
const MIN_SECTION = 120, MIN_BLOCK = 76;

// `length` split by `weights`, none under `min` while they all fit: the
// small ones get `min` and the rest share what is left.
function splitMin(weights, length, min) {
  if (weights.length * min > length) min = 0;
  let small = weights.map(() => false), sizes = [];
  for (let pass = 0; pass < weights.length; pass++) {
    const fixed = small.filter(Boolean).length * min;
    const rest = weights.reduce((a, w, i) => a + (small[i] ? 0 : w), 0) || 1;
    sizes = weights.map((w, i) => (small[i] ? min : (w / rest) * (length - fixed)));
    const more = sizes.map((s, i) => small[i] || s < min);
    if (more.every((m, i) => m === small[i])) break;
    small = more;
  }
  return sizes;
}

// The label groups this device can raise, by name: Reef's catalog.
function bandChoices() {
  return Object.entries(labelColors).map(([id, l]) => ["label:" + id, l.name]).sort((a, b) => a[1].localeCompare(b[1]));
}

// Raises a label group to a band on this device's map, or lowers it (a
// combined band lowers all its labels: `key` may be a list).
function setBand(key, raised) {
  const bands = new Set(prefs.bands || []);
  for (const one of [].concat(key)) { if (raised) bands.add(one); else bands.delete(one); }
  prefs.bands = [...bands]; savePrefs();
  if (mapState.level === "mid") leaveMid();
  fillSelects(); subscribeList();
}

function mapView() { return views.map; }
function mapCards() {
  const cards = new Map();
  for (const c of (views.map && views.map.cards) || []) cards.set(c.key, c);
  return cards;
}

// Lanes in order, each sized by its agents: strips along the shorter
// side, each strip kept while it makes its blocks squarer.
function treemap(weights, W, H) {
  const total = weights.reduce((a, b) => a + b, 0) || 1;
  const areas = weights.map((w) => (w * W * H) / total);
  // A row's worst block shape; one thinner than MIN_BLOCK (a lane too thin
  // for its name and a tile) counts as far worse, so the row is cut
  // differently where it can be.
  const worst = (row, side) => {
    const s = row.reduce((a, b) => a + b, 0), thick = s / side;
    return Math.max(...row.map((r) => {
      const len = r / thick, shape = Math.max(thick / len, len / thick);
      return Math.min(thick, len) < MIN_BLOCK ? shape * 1000 : shape;
    }));
  };
  const rects = [];
  let x = 0, y = 0, w = W, h = H, i = 0;
  while (i < areas.length) {
    const side = Math.min(w, h);
    const row = [areas[i]];
    let j = i + 1, current = worst(row, side);
    while (j < areas.length) {
      const next = worst([...row, areas[j]], side);
      if (next > current) break;
      row.push(areas[j]); current = next; j++;
    }
    const sum = row.reduce((a, b) => a + b, 0), thick = sum / side;
    let off = 0;
    for (const a of row) {
      const len = a / thick;
      rects.push(w >= h ? { x, y: y + off, w: thick, h: len } : { x: x + off, y, w: len, h: thick });
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    i = j;
  }
  return rects;
}

// A treemap with no block thinner than MIN_BLOCK where the space allows:
// a lane that comes out thinner is given more room and the map packed
// again, so a lane of one agent beside big ones still shows its name.
function packRects(weights, W, H) {
  const w = [...weights];
  let rects = treemap(w, W, H);
  if (Math.min(W, H) < MIN_BLOCK) return rects;
  for (let pass = 0; pass < 8; pass++) {
    const thin = rects.map((r) => Math.min(r.w, r.h) < MIN_BLOCK);
    if (!thin.some(Boolean)) break;
    thin.forEach((t, i) => { if (t) w[i] *= 1.6; });
    rects = treemap(w, W, H);
  }
  return rects;
}

// Whether a tile's agent waits on you, for its group's badge.
const waits = (t) => t.ask || t.state === "needs_input" || t.state === "failed";
// How wide a group's name and count are on its strip.
const textCanvas = document.createElement("canvas").getContext("2d");
function textWidth(text) {
  textCanvas.font = "650 13px " + getComputedStyle(document.body).fontFamily;
  return textCanvas.measureText(text).width;
}

function packMap() {
  const v = mapView();
  const box = $("map");
  const W = box.clientWidth, H = box.clientHeight;
  if (!v || !W || !H) return null;
  const lanes = v.fields.lanes || [];
  const byLane = new Map(lanes.map((l) => [l.key, []]));
  for (const t of v.parts) if (byLane.has(t.lane)) byLane.get(t.lane).push(t);
  const pad = 6;
  const weight = (l) => (byLane.get(l.key).length || 1) + 3;
  // A band's lanes come together (Reef sorts them so). Each band is a
  // section of its own across the map, its name on a strip on top and its
  // lanes packed inside, and the other lanes share one section: packed all
  // in one, a small lane beside a big band could only be a sliver.
  const sections = [], plain = [];
  for (const lane of lanes) {
    if (!lane.band) { plain.push(lane); continue; }
    const last = sections[sections.length - 1];
    if (last && last.band.key === lane.band.key) last.lanes.push(lane);
    else sections.push({ band: lane.band, lanes: [lane] });
  }
  if (plain.length) sections.push({ band: null, lanes: plain });
  const IW = W - pad * 2, IH = H - pad * 2;
  // Stacked along the longer side, each at least MIN_SECTION thick.
  const along = IH >= IW;
  const sizes = splitMin(sections.map((s) => s.lanes.reduce((a, l) => a + weight(l), 0)), along ? IH : IW, MIN_SECTION);
  const placed = [], bands = [];
  let off = 0;
  sections.forEach((s, i) => {
    const sec = along ? { x: 0, y: off, w: IW, h: sizes[i] } : { x: off, y: 0, w: sizes[i], h: IH };
    off += sizes[i];
    if (!s.band) {
      packRects(s.lanes.map(weight), sec.w, sec.h).forEach((q, j) =>
        placed.push({ lane: s.lanes[j], r: { x: sec.x + q.x, y: sec.y + q.y, w: q.w, h: q.h } }));
      return;
    }
    const f = { key: s.band.key, label: s.band.label, x: sec.x + pad + 1, y: sec.y + pad + 1,
      w: Math.max(sec.w - 2, 10), h: Math.max(sec.h - 2, 10) };
    bands.push(f);
    // Inner rects in the outer ones' terms: a block sits 3px inside its rect.
    const top = BAND_HEAD, inset = 1;
    packRects(s.lanes.map(weight), Math.max(f.w - inset * 2, 10), Math.max(f.h - top - inset, 10)).forEach((q, j) =>
      placed.push({ lane: s.lanes[j], r: { x: f.x + inset + q.x - pad, y: f.y + top + q.y - pad, w: q.w, h: q.h } }));
  });
  const blocks = placed.map(({ lane, r }) => {
    const b = { key: lane.key, label: lane.label, x: r.x + pad + 3, y: r.y + pad + 3, w: Math.max(r.w - 6, 10), h: Math.max(r.h - 6, 10),
      tiles: byLane.get(lane.key), band: lane.band || null, group: lane.group || null, labels: lane.labels || [] };
    // The name's strip takes two lines when one cannot hold it.
    const waiting = b.tiles.some(waits);
    const room = b.w - 8 - 12 - (waiting ? 26 : 0);
    b.head = textWidth(b.label + " " + b.tiles.length) > room ? 40 : 24;
    const iw = b.w - 8, ih = b.h - b.head - 4, n = Math.max(b.tiles.length, 1);
    let t = Math.max(4, Math.floor(Math.sqrt((iw * ih) / n)));
    while (t > 4 && Math.floor(iw / t) * Math.floor(ih / t) < n) t--;
    b.tile = t; b.cols = Math.max(1, Math.floor(iw / t));
    return b;
  });
  return { W, H, blocks, bands };
}

function camTransform(animate) {
  const board = $("board");
  board.classList.toggle("fly", !!animate);
  const c = mapState.cam;
  board.style.transform = "translate(" + c.x + "px," + c.y + "px) scale(" + c.s + ")";
  drawMinimap();
}

function clampCam() {
  const c = mapState.cam, L = mapState.layout;
  if (!L) return;
  c.s = Math.min(Math.max(c.s, 1), 12);
  const minX = L.W - L.W * c.s, minY = L.H - L.H * c.s;
  c.x = Math.min(0, Math.max(minX, c.x));
  c.y = Math.min(0, Math.max(minY, c.y));
}

function zoomAt(px, py, factor) {
  const c = mapState.cam;
  const s = Math.min(Math.max(c.s * factor, 1), 12);
  c.x = px - ((px - c.x) * s) / c.s;
  c.y = py - ((py - c.y) * s) / c.s;
  c.s = s;
  clampCam(); camTransform(false);
  // Close enough to one block: its cards take over.
  const block = blockAt(px, py);
  if (block && (c.s >= 2.8 || block.w * c.s >= mapState.layout.W * 0.92)) enterMid(block.key);
}

function blockAt(px, py) {
  const c = mapState.cam, L = mapState.layout;
  if (!L) return null;
  const wx = (px - c.x) / c.s, wy = (py - c.y) / c.s;
  return L.blocks.find((b) => wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) || null;
}

// A tile's other half: how long since its agent last did something, white
// now and black at two weeks, on a log scale (an hour is 40% of the way,
// a day 73%, a week 93%), in AGE_LEVELS steps of lightness.
const AGE_LEVELS = 40;
const AGE_BLACK_MINUTES = 14 * 24 * 60;
const AGES = Array.from({ length: AGE_LEVELS + 1 }, (_, i) =>
  "oklch(" + (1 - i / AGE_LEVELS).toFixed(3) + " 0 0)");
function ageStep(at) {
  const t = Date.parse(at + ":00Z");
  if (!t) return AGE_LEVELS;
  const minutes = Math.max(0, (Date.now() - t) / 60000);
  const f = Math.log1p(minutes) / Math.log1p(AGE_BLACK_MINUTES);
  return Math.min(AGE_LEVELS, Math.round(f * AGE_LEVELS));
}
$("agekey").querySelector("i").style.background = "linear-gradient(90deg, " + AGES[0] + ", " + AGES[AGE_LEVELS] + ")";

function drawFar() {
  const L = mapState.layout;
  const board = $("board");
  board.style.width = L.W + "px"; board.style.height = L.H + "px";
  const seenBlocks = new Set(), seenTiles = new Set(), seenBands = new Set();
  for (const f of L.bands || []) {
    seenBands.add(f.key);
    let fe = bandEls.get(f.key);
    if (!fe) { fe = el("div", "band"); fe.append(el("div", "name")); board.prepend(fe); bandEls.set(f.key, fe); }
    Object.assign(fe.style, { left: f.x + "px", top: f.y + "px", width: f.w + "px", height: f.h + "px" });
    fe.className = "band"; fe.style.removeProperty("--c"); tint(fe, groupColor(f.key));
    fe.querySelector(".name").textContent = f.label;
  }
  for (const [k, e] of bandEls) if (!seenBands.has(k)) { e.remove(); bandEls.delete(k); }
  for (const b of L.blocks) {
    seenBlocks.add(b.key);
    let be = blockEls.get(b.key);
    if (!be) {
      be = el("div", "block"); be.append(el("div", "name"), el("div", "badge"));
      board.append(be); blockEls.set(b.key, be);
    }
    Object.assign(be.style, { left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px" });
    be.className = "block"; be.style.removeProperty("--c"); tint(be, groupColor(b.key));
    const name = be.querySelector(".name");
    name.textContent = b.label + " ";
    name.append(el("span", "n", String(b.tiles.length)));
    const waiting = b.tiles.filter(waits).length;
    be.classList.toggle("waiting", waiting > 0);
    const badge = be.querySelector(".badge");
    badge.hidden = !waiting; badge.textContent = waiting ? "!" + waiting : "";
    b.tiles.forEach((t, i) => {
      seenTiles.add(t.key);
      let te = tileEls.get(t.key);
      if (!te) { te = el("div"); board.append(te); tileEls.set(t.key, te); }
      const col = i % b.cols, row = Math.floor(i / b.cols);
      const size = Math.max(b.tile - 2, 2);
      te.className = "tile s-" + t.state + (t.ask && size >= 9 ? " ask" : "") + (t.unseen ? " unseen" : "") +
        (t.agent === mapState.found ? " found" : "");
      const age = String(ageStep(t.at));
      if (te.dataset.age !== age) { te.dataset.age = age; te.style.setProperty("--age", AGES[age]); }
      Object.assign(te.style, { left: b.x + 4 + col * b.tile + "px", top: b.y + b.head + row * b.tile + "px",
        width: size + "px", height: size + "px" });
    });
  }
  for (const [k, e] of blockEls) if (!seenBlocks.has(k)) { e.remove(); blockEls.delete(k); }
  for (const [k, e] of tileEls) if (!seenTiles.has(k)) { e.remove(); tileEls.delete(k); }
}

function midGeometry() {
  const W = $("map").clientWidth;
  const cols = Math.max(1, Math.floor((W - GAP) / (MID_BOX_W + GAP)));
  const cw = (W - GAP * (cols + 1)) / cols;
  return { cols, cw };
}

// A lane's agents, the latest activity first, strictly (the far view keeps
// creation order, so tiles stay put). Agents active in the same minute keep
// the order they were made in, so the order does not churn.
function laneTiles() {
  const L = mapState.layout;
  const b = L && L.blocks.find((x) => x.key === mapState.lane);
  if (!b) return [];
  return [...b.tiles].sort((x, y) => (y.at || "").localeCompare(x.at || ""));
}

// The boxes hold their order as Recent's rows do: they move once the line
// under the lane's heading has filled.
const midSort = heldOrder({
  line: () => $("lane").querySelector(".resort"),
  keys: () => (mapState.level === "far" ? null : laneTiles().map((t) => t.agent)),
  items: () => $("lane").querySelectorAll(".mbox"),
  redraw: () => drawMid(),
});
// The lane's tiles in the order shown; agents new to the lane go on at the
// end until the order catches up.
function midTiles() {
  const tiles = laneTiles(), by = new Map(tiles.map((t) => [t.agent, t]));
  if (!midSort.order.length) midSort.order = tiles.map((t) => t.agent);
  const shown = midSort.order.filter((a) => by.has(a)).map((a) => by.get(a));
  const have = new Set(midSort.order);
  for (const t of tiles) if (!have.has(t.agent)) shown.push(t);
  return shown;
}

// Only the cards in view are drawn, and only theirs are asked for.
function drawMid() {
  const lane = $("lane");
  const tiles = midTiles();
  const { cols, cw } = midGeometry();
  const rows = Math.ceil(tiles.length / cols);
  let head = lane.querySelector(".lanehead"), space = lane.querySelector(".space");
  if (!head) {
    head = el("div", "lanehead");
    space = el("div", "space"); space.style.position = "relative";
    lane.append(head, space);
  }
  let line = head.querySelector(".resort");
  const block = mapState.layout.blocks.find((b) => b.key === mapState.lane);
  head.innerHTML = "";
  const back = el("button", "plain"); back.innerHTML = icon("back", 20) + "All"; back.onclick = () => leaveMid();
  if (!line) {
    line = el("button", "resort idle"); line.setAttribute("aria-label", "Sort now"); line.append(el("i"));
    line.onclick = () => { if (sortPending(midSort)) resort(midSort); };
  }
  const title = block ? (block.band ? block.band.label + " › " + block.label : block.label) : "";
  head.append(back, el("span", "", title), el("span", "n", String(tiles.length)));
  // A lane's labels can be raised to bands, on this device (a combination's
  // each by name); a band's lane lowers its band, every label of it.
  if (block && BANDED.has(prefs.group)) {
    const bandButton = (text, key, raised) => {
      const b = el("button", "bandbtn", text);
      b.onclick = () => setBand(key, raised);
      return b;
    };
    const box = el("span", "bandbtns");
    if (block.band) box.append(bandButton("Lower band", block.band.labels || block.band.key, false));
    const raisable = block.labels || [];
    if (raisable.length === 1) box.append(bandButton("Raise to band", raisable[0].key, true));
    else for (const l of raisable) box.append(bandButton("Raise " + l.label, l.key, true));
    if (box.childElementCount) head.append(box);
  }
  head.append(line);
  space.style.height = rows * (MID_BOX_H + GAP) + GAP + "px";
  const top = lane.scrollTop - 60, bottom = lane.scrollTop + lane.clientHeight;
  const cards = mapCards();
  const shown = [];
  space.innerHTML = "";
  tiles.forEach((t, i) => {
    const row = Math.floor(i / cols), col = i % cols;
    const y = GAP + row * (MID_BOX_H + GAP);
    if (y + MID_BOX_H < top - MID_BOX_H || y > bottom + MID_BOX_H) return;
    shown.push(t.agent);
    const c = cards.get(t.agent) || {};
    // The agent's name, then how it is and since when, then its host.
    const card = el("div", "mbox s-" + t.state + (t.unseen ? " unseen" : ""));
    card.dataset.agent = t.agent; card.dataset.key = t.agent;
    card.style.setProperty("--age", AGES[ageStep(t.at)]);
    Object.assign(card.style, { left: GAP + col * (cw + GAP) + "px", top: y + "px", width: cw + "px", height: MID_BOX_H + "px" });
    card.append(el("div", "name", c.title || "…"));
    card.append(el("div", "line", [STATES[t.state], ago(c.at || t.at + ":00Z")].filter(Boolean).join(" · ")));
    // A subagent names its parent before its host.
    const where = el("div", "host");
    if (c.parent) where.append(parentLink(c), " · ");
    where.append(c.host || t.agent.split("/")[0]);
    card.append(where);
    card.onclick = () => enterNear(t.agent, card);
    if (mapState.flash === t.agent) { card.classList.add("flash"); }
    space.append(card);
  });
  mapFocus(shown);
  if (!sortPending(midSort)) midSort.waited = 0;
  resortTimer(midSort, sortPending(midSort));
  drawResort(midSort);
}

let focusTimer = null;
function mapFocus(agents) {
  const key = agents.join(",");
  if (key === mapState.focusSent) return;
  clearTimeout(focusTimer);
  focusTimer = setTimeout(() => {
    mapState.focusSent = key;
    send({ type: "focus", id: "map", agents });
  }, 150);
}

function drawMinimap() {
  const mm = $("minimap"), L = mapState.layout;
  // At the whole map the minimap would only cover part of it.
  // On a narrow screen the cards need all the width.
  mm.hidden = !L || mapState.level === "near" || (mapState.level === "far" && mapState.cam.s <= 1.01) ||
    (mapState.level === "mid" && L.W < 600);
  // The key to the tiles' colours, over the map until dismissed. It stays
  // in a lane too, so the board does not shift on the way in and out.
  $("agekey").hidden = !!prefs.ageKeyHidden || mapState.level === "near";
  if (!L) return;
  const k = 84 / L.W;
  mm.style.height = L.H * k + "px";
  mm.innerHTML = "";
  for (const b of L.blocks) {
    const i = el("i", b.key === mapState.lane && mapState.level === "mid" ? "on" : "");
    Object.assign(i.style, { left: b.x * k + "px", top: b.y * k + "px", width: Math.max(b.w * k - 1, 1) + "px", height: Math.max(b.h * k - 1, 1) + "px" });
    mm.append(i);
  }
  if (mapState.level === "far" && mapState.cam.s > 1.01) {
    const c = mapState.cam, v = el("b");
    Object.assign(v.style, { left: (-c.x / c.s) * k + "px", top: (-c.y / c.s) * k + "px",

    mm.append(v);
  }
}

function drawMap() {
  if (prefs.tab !== "map") return;
  const box = $("map");
  const size = box.clientWidth + "x" + box.clientHeight;
  mapState.layout = packMap();
  if (!mapState.layout) return;
  // A new shape re-packs; the camera goes back to the whole map, or to the
  // lane being looked into, so zooming out from it still flies.
  if (size !== mapState.size) {
    mapState.size = size;
    const b = mapState.level !== "far" && mapState.layout.blocks.find((x) => x.key === mapState.lane);
    mapState.cam = b ? laneCam(b) : { x: 0, y: 0, s: 1 };
    camTransform(false);
  }
  drawFar();
  $("lane").hidden = mapState.level === "far";
  if (mapState.level !== "far") drawMid();
  else mapFocus([]);
  drawMinimap();
}

// The camera that fills the screen with one lane's block.
function laneCam(b) {
  const L = mapState.layout, s = Math.min(L.W / b.w, L.H / b.h);
  return { s, x: -b.x * s + (L.W - b.w * s) / 2, y: -b.y * s + (L.H - b.h * s) / 2 };
}

function enterMid(laneKey, then) {
  const L = mapState.layout, b = L && L.blocks.find((x) => x.key === laneKey);
  if (!b) return;
  // Fly at the block, then show its cards.
  mapState.cam = laneCam(b);
  camTransform(true);
  mapState.level = "mid"; mapState.lane = laneKey;
  Object.assign(midSort, { order: [], waited: 0 });
  const lane = $("lane");
  lane.innerHTML = ""; lane.scrollTop = 0; lane.style.opacity = "0"; lane.hidden = false;
  setTimeout(() => { lane.style.opacity = "1"; drawMid(); if (then) then(); }, 220);
  drawMinimap();
}

function leaveMid() {
  const L = mapState.layout;
  const lane = $("lane");
  lane.style.opacity = "0";
  mapState.level = "far";
  resortTimer(midSort, false);
  setTimeout(() => { lane.hidden = true; }, 200);
  mapState.cam = { x: 0, y: 0, s: 1 };
  camTransform(true);
  mapFocus([]);
  if (L) drawMinimap();
}

function rectIn(elm) {
  const m = $("map").getBoundingClientRect(), r = elm.getBoundingClientRect();
  return { left: r.left - m.left, top: r.top - m.top, width: r.width, height: r.height };
}

// A card (or a list's row) opens into its conversation where it is, and
// grows to fill the map.
function enterNear(agent, card, title) {
  const [host, id] = agent.split("/");
  const near = $("near");
  const from = card ? rectIn(card) : { left: 40, top: 40, width: 200, height: 100 };
  Object.assign(near.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" });
  near.classList.remove("full");
  near.hidden = false;
  near.append($("convpane"));
  mapState.level = "near"; mapState.near = agent;
  const c = mapCards().get(agent) || {};
  openAgent({ host, id, title: title || c.title });
  // Start from the card, then grow (a reflow in between lets it animate).
  void near.offsetWidth;
  setTimeout(() => {
    Object.assign(near.style, { left: "0px", top: "0px", width: "100%", height: "100%" });
    near.classList.add("full");
  }, 16);
  drawMinimap();
}

function leaveNear() {
  if (mapState.level !== "near") return;
  const near = $("near"), agent = mapState.near, toList = mapState.fromList;
  // Back into what it came from: the list's row, or the lane's box.
  const from = toList ? [...$("recentbody").querySelectorAll(".row")].find((r) => r.dataset.key === agent)
    : [...$("lane").querySelectorAll(".mbox")].find((c) => c.dataset.agent === agent);
  const to = from ? rectIn(from) : { left: 40, top: 40, width: 200, height: 100 };
  near.classList.remove("full");
  Object.assign(near.style, { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" });
  mapState.level = mapState.lane ? "mid" : "far";
  setTimeout(() => {
    near.hidden = true;
    $("app").insertBefore($("convpane"), $("mappane"));
    openAgent(null);
    drawMap();
    if (toList && recent.under) nearToList();
  }, 260);
}

// The three views go round: the map, the current conversation (the one
// last opened, from the map or the list), the list, and the map again. A
// swipe left goes on round, a swipe right back round. With no current
// conversation it is the map and the list.
function currentAgent() {
  if (!lastAgent) return null;
  const key = lastAgent.host + "/" + lastAgent.id;
  // Gone from the map (archived, deleted, filtered out): no middle stop.
  // The map's tiles are every agent; its cards only a lane's.
  const v = mapView(), there = (v && v.parts.some((t) => t.agent === key)) || mapCards().has(key);
  return there ? Object.assign({ key }, lastAgent) : null;
}
// Open it as the next stop round, coming in from `side` (1 the right, -1
// the left). From the list it opens over the list, as a row does, so its
// back button goes back there.
function enterCurrent(side, fromList) {
  const a = currentAgent();
  if (!a) return false;
  if (fromList) { recent.open = false; recent.under = true; $("recentpane").classList.add("under"); mapState.fromList = true; }
  const near = $("near");
  near.hidden = false;
  near.append($("convpane"));
  Object.assign(near.style, { left: "0px", top: "0px", width: "100%", height: "100%", transition: "none", transform: "translateX(" + side * 100 + "%)" });
  near.classList.add("full");
  mapState.level = "near"; mapState.near = a.key;
  openAgent({ host: a.host, id: a.id, title: a.title });
  void near.offsetWidth;
  near.style.transition = "transform .2s ease-out";
  near.style.transform = "";
  setTimeout(() => { near.style.transition = ""; }, 220);
  drawMinimap(); drawChrome();
  return true;
}

// A swipe right from an open card goes round to the whole map, from the
// list too, and the agent's tile pulses to show where it was. (Its back
// button still goes back to where it was opened from.)
function nearToMap() {
  if (mapState.level !== "near") return;
  if (mapState.fromList || recent.under) closeRecent();
  const agent = mapState.near, lane = $("lane");
  $("near").hidden = true;
  $("app").insertBefore($("convpane"), $("mappane"));
  mapState.level = "far"; mapState.lane = null;
  lane.hidden = true; lane.style.opacity = "0";
  mapState.cam = { x: 0, y: 0, s: 1 }; camTransform(false);
  mapFocus([]);
  mapState.found = agent;
  openAgent(null);
  drawMap();
  setTimeout(() => { if (mapState.found === agent) { mapState.found = null; drawMap(); } }, 1600);
}

function fitAll() {
  if (mapState.level === "near") leaveNear();
  if (mapState.level === "mid") leaveMid();
  mapState.cam = { x: 0, y: 0, s: 1 }; camTransform(true);
}

// A notification's card: its lane's cards, scrolled to it, flashing.
function flyTo(host, id) {
  const agent = host + "/" + id;
  if (recent.open || recent.under) closeRecent();
  const v = mapView();
  const tile = v && v.parts.find((t) => t.agent === agent);
  if (mapState.level === "near") leaveNear();
  if (!tile) return enterNear(agent, null);
  const show = () => {
    const i = midTiles().findIndex((t) => t.agent === agent);
    const { cols } = midGeometry();
    $("lane").scrollTop = Math.max(0, Math.floor(i / cols) * (MID_BOX_H + GAP) - 40);
    mapState.flash = agent; drawMid();
    setTimeout(() => { mapState.flash = null; }, 2600);
  };
  if (mapState.level === "mid" && mapState.lane === tile.lane) show();
  else setTimeout(() => enterMid(tile.lane, show), mapState.level === "near" ? 280 : 0);
}

// ---- map gestures: one finger pans, two pinch; the wheel and trackpad
// pinch do the same on a desk. Nothing moves while you type.
const pointers = new Map();
let gesture = null, lastTap = { t: 0, x: 0, y: 0 };
function composing() { return document.activeElement === $("draft") || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || ""); }
function localPoint(e) { const r = $("map").getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  const [a, b] = [...pointers.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

$("map").addEventListener("pointerdown", (e) => {
  if (composing()) return;
  pointers.set(e.pointerId, localPoint(e));
  if (pointers.size === 2) gesture = { kind: "pinch", start: spread(), last: spread() };
  else if (pointers.size === 1) gesture = { kind: "pan", start: localPoint(e), last: localPoint(e), moved: false };
});

  if (!pointers.has(e.pointerId) || composing()) return;

    const now = spread(), ratio = now.d / (gesture.start.d || 1);
    if (mapState.level === "far") {
      zoomAt(now.x, now.y, now.d / (gesture.last.d || 1));
      mapState.cam.x += now.x - gesture.last.x; mapState.cam.y += now.y - gesture.last.y; clampCam(); camTransform(false);
    } else if (mapState.level === "mid" && ratio < 0.7) { gesture = null; leaveMid(); return; }
    else if (mapState.level === "mid" && ratio > 1.45) {
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const card = hit && hit.closest(".mbox");
      if (card) { gesture = null; enterNear(card.dataset.agent, card); return; }
    } else if (mapState.level === "near" && ratio < 0.7) { gesture = null; leaveNear(); return; }
    if (gesture) gesture.last = now;
  } else if (gesture.kind === "pan" && mapState.level === "far") {
    const p = localPoint(e);
    if (Math.hypot(p.x - gesture.start.x, p.y - gesture.start.y) > 8) gesture.moved = true;
    mapState.cam.x += p.x - gesture.last.x; mapState.cam.y += p.y - gesture.last.y;
    gesture.last = p; clampCam(); camTransform(false);
  } else if (gesture.kind === "pan") {
    const p = localPoint(e);
    if (Math.hypot(p.x - gesture.start.x, p.y - gesture.start.y) > 8) gesture.moved = true;

const endPointer = (e) => {
  if (!pointers.has(e.pointerId)) return;

    // A tap, or a double tap, on a block opens its cards.
    const p = localPoint(e);
    const block = blockAt(p.x, p.y);
    lastTap = { t: Date.now(), x: p.x, y: p.y };

$("map").addEventListener("pointerup", endPointer);
$("map").addEventListener("pointercancel", endPointer);
$("map").addEventListener("dblclick", (e) => {
  if (mapState.level !== "mid") return;
  const card = e.target.closest && e.target.closest(".mbox");
  if (card) enterNear(card.dataset.agent, card);
});
// A trackpad's two-finger swipe sideways, as a desk's swipe: a firm one
// left brings the list in over the map, a firm one right takes it away.
// Browsers send it as sideways wheel steps; they add up while they come.
const sideSwipe = { sum: 0, last: 0, done: false };
function sideways(e, wanted, then) {
  if (e.ctrlKey || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return false;
  const now = Date.now();
  if (now - sideSwipe.last > 250) Object.assign(sideSwipe, { sum: 0, done: false });
  sideSwipe.last = now;
  sideSwipe.sum += e.deltaX;
  if (!sideSwipe.done && sideSwipe.sum * wanted > 90) { sideSwipe.done = true; then(); }

}
let wheelZoom = 0;
$("map").addEventListener("wheel", (e) => {
  if (composing()) return;
  // The whole map, or a lane's boxes: nowhere to pan sideways, so it is
  // the list's swipe.
  // Round, as a swipe: left on to the current conversation (else the list),
  // and on the whole map right back round to the list.
  const way = mapState.level === "far" ? Math.sign(e.deltaX) || 1 : 1;
  const round = () => { if (way < 0 || !enterCurrent(1, false)) openRecent(); };

// Back out one level: the list to the map, a conversation to the list or

{
