// Markdown, small: code blocks, inline code, bold, paragraphs. Text is
// escaped first, so nothing from an agent becomes markup.
// The markdown agents write: code blocks, tables, lists, headings, and
// inline code, bold, italics, links and images. Everything is escaped
// first. `sources` maps an image's destination to the key Reef serves the
// file it names under, for images a daemon keeps.
function markdown(text, sources) {
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // A destination as written, from its escaped form: entities and
  // backslash escapes undone, as Reef found it.
  const unesc = (s) => s.replace(/&(amp|lt|gt|quot|#39);/g, (_, e) => ({ amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" }[e]))
    .replace(/\\([!-/:-@[-`{-~])/g, "$1");
  // A daemon's file through Reef, a web image, or one a data: URL carries.
  const imageSrc = (dest) => {
    const key = sources && Object.prototype.hasOwnProperty.call(sources, dest) ? sources[dest] : null;
    if (key) return imageUrl(key);
    if (/^https:\/\//i.test(dest) || /^data:image\/(png|jpe?g|gif|webp);base64,/i.test(dest)) return dest;
    return null;
  };
  const inline = (s) => {
    const codes = [], images = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    // Images before anything else, so a path's _ or * is left alone.
    s = s.replace(/!\[([^\]]*)\]\(((?:\\.|[^\s)\\])+)(?:\s+&quot;.*?&quot;)?\)/g, (all, alt, dest) => {
      const src = imageSrc(unesc(dest));
      if (!src) return all;
      images.push('<img class="rimg" loading="lazy" decoding="async" alt="' + (alt || "Image") + '" src="' + esc(src) + '">');
      return "\u0001" + (images.length - 1) + "\u0001";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, "$1<i>$2</i>")
      .replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, "$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>")
      .replace(/\u0001(\d+)\u0001/g, (_, i) => images[i]);
  };
  const cells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  const isRule = (line) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line || "");
  const bullet = /^\s*([-*+]|\d+[.)])\s+(.*)$/;
  const blocks = (part) => {
    const lines = part.split("\n"), out = [];
    let para = [];
    const flush = () => { if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line.trim()) { flush(); continue; }
      if (line.includes("|") && isRule(lines[i + 1])) {
        flush();
        let html = '<div class="tablewrap"><table><thead><tr>' + cells(line).map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
        for (i += 2; i < lines.length && lines[i].includes("|") && lines[i].trim(); i++) {
          html += "<tr>" + cells(lines[i]).map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>";
        }
        i--;
        out.push(html + "</tbody></table></div>");
        continue;
      }
      const h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { flush(); out.push('<p class="h">' + inline(h[2]) + "</p>"); continue; }
      const m = bullet.exec(line);
      if (m) {
        flush();
        const ordered = /\d/.test(m[1]), items = [];
        for (; i < lines.length; i++) {
          const b = bullet.exec(lines[i]);
          if (b && /\d/.test(b[1]) === ordered) items.push(inline(b[2]));
          else if (lines[i].trim() && /^\s{2,}/.test(lines[i]) && items.length) items[items.length - 1] += "<br>" + inline(lines[i].trim());
          else break;
        }
        i--;
        const tag = ordered ? "ol" : "ul";
        const start = ordered ? parseInt(m[1], 10) : 1;
        out.push("<" + tag + (start > 1 ? ' start="' + start + '"' : "") + ">" + items.map((t) => "<li>" + t + "</li>").join("") + "</" + tag + ">");
        continue;
      }
      para.push(line);
    }
    flush();
    return out.join("");
  };
  return text.split(/```[^\n]*\n?/).map((part, i) => {
    if (i % 2) return "<pre>" + esc(part.replace(/\n$/, "")) + "</pre>";
    return blocks(esc(part));
  }).join("");
}

// The open agent's provider, model and effort (the defaults when it names
// none), by the names its host gives them once the host's choices are in
// (fetched once), by id until then; then how full its context is, amber
// from 80% and red from 90%, as crusteo's composer shows it.
function drawSpec() {
  if (!open) return;
  const agent = (views.conv && views.conv.fields.agent) || open;
  const host = agent.host || open.host;
  if (agent.provider && !createOptions[host]) loadOptions(host);
  const data = (createOptions[host] || {}).data;
  const provider = data && (data.providers || []).find((p) => p.id === agent.provider);
  const models = (provider && provider.models) || [];
  const model = models.find((m) => m.id === agent.model) || (!agent.model && models.find((m) => m.default));
  const thinking = model && (model.thinking || []).find((t) => t.id === agent.thinking);
  const spec = $("convspec"), ctx = $("convctx"), full = agent.context;
  spec.textContent = [provider ? provider.label : agent.provider, model ? model.label : agent.model,
    thinking ? thinking.label : agent.thinking].filter(Boolean).join(" · ");
  // Its own span, so a narrow screen cuts the model's name, not this.
  ctx.hidden = typeof full !== "number";
  ctx.className = "ctx" + (full >= 90 ? " bad" : full >= 80 ? " warn" : "");
  ctx.textContent = ctx.hidden ? "" : (spec.textContent ? "· " : "") + full + "% context";
  $("convsub").hidden = !spec.textContent && ctx.hidden;
  fitHead();
}

// The chevron shows only when the labels don't all fit; it opens the header to show every one.
let headFull = false;
function fitHead() {
  const more = $("convmore"), labels = $("convlabels");
  $("convpane").querySelector(".convhead").classList.toggle("full", headFull && !labels.hidden);
  if (headFull) { more.hidden = labels.hidden; return; }
  more.hidden = true;
  more.hidden = labels.hidden || labels.scrollWidth <= labels.clientWidth + 1;
}

let firstDraw = true;
function drawConv() {
  if (!open) {
    $("convbody").innerHTML = "";
    $("convbody").dataset.agent = "";
    $("convbody").append(el("div", "placeholder", "Pick an agent to see its conversation"));
    return;
  }
  const pane = $("convpane");
  if (held(pane)) return later(drawConv);
  const v = views.conv;
  const agent = (v && v.fields.agent) || open;
  $("title").textContent = agent.title || "Conversation";
  $("convmeta").textContent = [agent.host || open.host, agent.workspace, STATES[agent.state]].filter(Boolean).join(" · ");
  $("bell").innerHTML = bellFor(agent, 20);
  $("bell").className = "icon" + (agent.notify === false ? " off" : "");
  const labelBox = $("convlabels");
  labelBox.hidden = !(agent.labels && agent.labels.length);
  labelBox.innerHTML = "";
  labelBox.append(...chips(agent.labels).children);
  drawSpec();
  drawComposer();
  const scroller = $("convscroll");
  const body = $("convbody");
  // Whose conversation the body shows.
  const showing = open.host + "/" + open.id;
  if (!v || v.fields.loading) {
    // This agent's conversation, already on screen (a reconnect), stays
    // until its replacement comes. Another agent's never does: it read as
    // this one's under its title until this one's loaded.
    if (body.dataset.agent === showing && body.querySelector(".turn")) return;
    body.innerHTML = "";
    body.dataset.agent = showing;
    return body.append(el("div", "note", "Loading..."));
  }
  const anchor = following ? null : readingAt(scroller);
  body.innerHTML = "";
  body.dataset.agent = showing;
  if (v.fields.error) body.append(el("div", "note", v.fields.error));
  if (v.fields.has_older) {
    body.append(button("Load earlier", "more", "older", () => {
      busy.older = true; drawConv();
      ask({ type: "older", id: "conv", turns: 3 }, () => { delete busy.older; convTurns = Math.min(convTurns + 3, 50); drawConv(); });
    }));
  }
  if (!v.parts.length) body.append(el("div", "empty", "No messages yet"));
  for (const turn of v.parts) {
    const t = el("div", "turn");
    if (turn.clipped) t.append(el("div", "small", turn.clipped + " earlier steps"));
    for (const item of turn.items) { const node = renderItem(item); node.dataset.id = item.id; t.append(node); }
    if (turn.footer) {
      const f = [ago(turn.footer.at) + (ago(turn.footer.at) === "now" ? "" : " ago")];
      if (turn.footer.secs) f.push(duration(turn.footer.secs));
      t.append(el("div", "footer", f.join(" · ")));
    }
    body.append(t);
  }
  for (const a of v.fields.asks || []) body.append(askCard(a));
  if (failed.archive) body.append(el("div", "error", failed.archive));
  // Follow the end while there; otherwise put the item being read back
  // where it was, whatever came or went above it.
  const back = anchor && body.querySelector('[data-id="' + CSS.escape(anchor.id) + '"]');
  if (firstDraw || following || !back) scroller.scrollTop = scroller.scrollHeight;
  else scroller.scrollTop += back.getBoundingClientRect().top - anchor.top;
  firstDraw = false;
}

// The first item showing at the top of the conversation, and where.
function readingAt(scroller) {
  const top = scroller.getBoundingClientRect().top;
  for (const node of scroller.querySelectorAll("[data-id]")) {
    const r = node.getBoundingClientRect();
    if (r.bottom > top + 1) return { id: node.dataset.id, top: r.top };
  }
  return null;
}

// Following the end is the reader's choice, made by where they scroll: back
// to the end follows again, and only scrolling up stops it. The pane
// shrinking under the keyboard or a taller composer is not the reader's
// doing, so it leaves following as it was.
let lastTop = 0;
$("convscroll").addEventListener("scroll", () => {
  const s = $("convscroll");
  if (s.scrollTop + s.clientHeight >= s.scrollHeight - 60) following = true;
  else if (s.scrollTop < lastTop) following = false;
  lastTop = s.scrollTop;
}, { passive: true });
function toEnd() { const s = $("convscroll"); if (following) s.scrollTop = s.scrollHeight; }
// The pane resized, or what's in it grew without a redraw (an image loading).
new ResizeObserver(toEnd).observe($("convscroll"));
new ResizeObserver(toEnd).observe($("convbody"));

function askCard(a) {
  const card = el("div", "card");
  const key = "ask:" + a.id;
  card.append(el("h3", "", a.title));
  if (a.summary) card.append(el("div", "small", a.summary));
  if (a.description) card.append(el("div", "small", a.description));
  if (a.plan) { const p = el("div", "item assistant"); p.innerHTML = markdown(a.plan); card.append(p); }
  const buttons = el("div", "buttons");
  if (a.questions) {
    const form = forms[a.id] || (forms[a.id] = { selected: a.questions.map(() => []), other: a.questions.map(() => "") });
    a.questions.forEach((q, qi) => {
      card.append(el("div", "q", q.question));
      q.options.forEach((o, oi) => {
        const label = el("label");
        const input = el("input"); input.type = q.multi ? "checkbox" : "radio"; input.name = a.id + ":" + qi;
        input.checked = form.selected[qi].includes(oi);
        input.onchange = () => {
          if (!q.multi) form.selected[qi] = [];
          form.selected[qi] = form.selected[qi].filter((x) => x !== oi);
          if (input.checked) form.selected[qi].push(oi);
        };
        label.append(input, el("span", "", o.label + (o.description ? " — " + o.description : "")));
        card.append(label);
      });
      if (q.other) {
        const other = el("input", "other"); other.placeholder = q.options.length ? "Or type an answer" : "Your answer";
        other.value = form.other[qi];
        other.oninput = () => { form.other[qi] = other.value; };
        card.append(other);
      }
    });
    buttons.append(button(a.dismiss || "Dismiss", "", key + ":dismiss", () =>
      act(key + ":dismiss", { action: "answer", host: open.host, agent: open.id, ask: a.id, dismiss: true })));
    buttons.append(button("Submit", "primary", key, () =>
      act(key, { action: "answer", host: open.host, agent: open.id, ask: a.id,
        answers: form.selected.map((s, i) => ({ selected: s, other: form.other[i] })) })));
  } else {
    for (const choice of a.actions || []) {
      const allow = choice.behavior === "allow";
      buttons.append(button(choice.label, allow ? "primary" : "", key + ":" + choice.id, () =>
        act(key + ":" + choice.id, { action: "permission", host: open.host, agent: open.id, ask: a.id,
          decision: allow ? "allow" : "deny", action_id: choice.id })));
    }
  }
  card.append(buttons);
  for (const k of Object.keys(failed)) if (k.startsWith(key)) card.append(el("div", "error", failed[k]));
  return card;
}

// Images come one by one from Reef, named by their contents, so the
// browser keeps each for good once fetched.
function imageUrl(key) {
  const t = token();
  return "/image/" + key + (t ? "?t=" + encodeURIComponent(t) : "");
}
function showImage(url) {
  const box = el("div", "lightbox"), img = el("img");
  img.src = url; img.alt = "Image";
  box.append(img);
  box.onclick = () => box.remove();
  document.body.append(box);
}

// ---- usage ------------------------------------------------------------------------
// Reef's `usage` view: a row per account, worked out by the rules
// crusteo's title bar follows, so both say the same. The top bar shows
// the tightest account's pace dial; a tap opens every account.

function usageRows() { return (views.usage && views.usage.parts) || []; }
function usageOpen() { return !!document.querySelector(".drawer.open"); }
let usageTimer = null;

// A half dial, green on the left through blue at the top to red on the
// right, with the needle at the window's pace (degrees from straight up).
function dialSvg(needle) {
  const W = 26, H = 14, cx = W / 2, cy = H, r = H - 2;
  const at = (deg, rad) => { const t = (180 - deg) * Math.PI / 180; return [cx + rad * Math.cos(t), cy - rad * Math.sin(t)]; };
  const arc = (from, to, color) => {
    const [x1, y1] = at(from, r), [x2, y2] = at(to, r);
    return '<path d="M' + x1.toFixed(1) + " " + y1.toFixed(1) + " A" + r + " " + r + " 0 0 1 " + x2.toFixed(1) + " " + y2.toFixed(1) +
      '" stroke="' + color + '" stroke-width="3" fill="none" opacity=".55"/>';
  };
  let svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" aria-hidden="true">' +
    arc(0, 74, "var(--run)") + arc(74, 106, "var(--pace)") + arc(106, 140, "var(--warn)") + arc(140, 180, "var(--bad)");
  if (needle !== null && needle !== undefined) {
    const [x, y] = at(90 + needle, H - 1);
    svg += '<path d="M' + cx + " " + cy + " L" + x.toFixed(1) + " " + y.toFixed(1) + '" stroke="currentColor" stroke-width="1.5"/>';
  }
  return svg + "</svg>";
}

// As crusteo writes a reset: 26m, 3.3h, 2.1d. Numbers kept from a read
// before a failed one don't say a window whose reset has gone by resets now.
function resetsIn(at, retained) {
  const s = at - Date.now() / 1000;
  if (s <= 0) return retained ? "reset time passed" : "resets now";
  return "resets in " + resetShort(at);
}
// The same for a table cell: 26m, 3.3h, 2.1d, "now", or "passed".
function resetShort(at, retained) {
  const s = at - Date.now() / 1000;
  if (s <= 0) return retained ? "passed" : "now";
  if (s < 90 * 60) return Math.max(1, Math.round(s / 60)) + "m";
  if (s < 48 * 3600) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}
function bindingWindow(row) { return (row.windows || []).find((w) => w.binding); }
// A row whose latest read failed, as Paseo's usage card says it: "Error" or
// "Unavailable" and why, and when its numbers were read.
function failureText(row) {
  const f = row.failure;
  if (!f) return "";
  const status = f.status === "error" ? "Error" : "Unavailable";
  return f.problem ? status + ": " + f.problem : status;
}
function lastUpdated(row) {
  const a = ago(new Date(row.served_at * 1000).toISOString());
  return "Last updated " + (a === "now" ? "just now" : a + " ago");
}

function drawUsage() {
  const rows = usageRows(), top = rows.find((r) => r.tightest), g = $("usage");
  g.hidden = !top;
  if (top) {
    const w = bindingWindow(top);
    g.className = "ugauge sev-" + top.severity + (top.stale ? " stale" : "");
    g.innerHTML = dialSvg(top.needle) + "<span>" + top.slack + "</span>";
    g.title = [top.provider + " " + (top.account || top.label), w ? (w.short || w.name) + " " + Math.round(w.remaining) + "% left, " + resetsIn(w.resets_at, top.retained) : "",
      top.retained ? failureText(top) + "\n" + lastUpdated(top) : ""]
      .filter(Boolean).join("\n");
  }
  drawUsageDrawer();
}

function showUsage() {
  if (usageOpen()) return;
  const back = el("div", "drawerback"), drawer = el("div", "drawer");
  const head = el("div", "sheethead");
  head.append(el("h3", "", "Usage"));
  const done = el("button", "", "Done"); done.onclick = hideUsage; head.append(done);
  drawer.append(head, el("div", "body"));
  back.onclick = hideUsage;
  document.body.append(back, drawer);
  void drawer.offsetWidth;
  back.classList.add("open"); drawer.classList.add("open");
  drawUsageDrawer();
  // Only the countdowns move with the clock; the numbers come as deltas.
  usageTimer = setInterval(drawUsageDrawer, 30000);
}
function hideUsage() {
  clearInterval(usageTimer); usageTimer = null;
  for (const e of document.querySelectorAll(".drawer, .drawerback")) {
    e.classList.remove("open");
    e.style.transform = "";
    setTimeout(() => e.remove(), 240);
  }
}
function drawUsageDrawer() {
  const body = document.querySelector(".drawer.open .body");
  if (!body) return;
  body.innerHTML = "";
  const rows = usageRows();
  if (!views.usage) return body.append(el("div", "note", "Loading..."));
  if (!rows.length) return body.append(el("div", "note", "No usage reported"));
  for (const p of rows) {
    const box = el("div", "pool" + (p.stale ? " stale" : ""));
    const who = el("div", "who");
    who.append(el("span", "", p.provider), el("span", "acct", [p.label, p.plan].filter(Boolean).join(" · ")));
    if (p.retained) who.append(el("span", "fail " + (p.failure.status === "error" ? "error" : "unavailable")));
    who.append(el("span", "pace sev-" + p.severity, p.slack));
    box.append(who);
    if (p.retained) {
      box.append(el("div", "why failed", failureText(p)), el("div", "why last", lastUpdated(p)));
    } else if (p.status && p.status !== "ok") box.append(el("div", "why", p.status));
    else if (p.stale) box.append(el("div", "why", "Last read " + ago(new Date(p.served_at * 1000).toISOString()) + " ago"));
    if (p.use_before) {
      const u = p.use_before;
      box.append(el("div", "hint", "Use it before reset: " + Math.round(u.remaining) + "% of " + u.window + " left, " + resetsIn(u.resets_at)));
    }
    // As crusteo's usage table: a heading per group, a line per period with
    // what is left, the reset and the pace, the window the dial shows marked.
    // A Reef from before groups sends none: then one group of every window.
    const windows = new Map((p.windows || []).map((w) => [w.key, w]));
    const groups = p.groups || [{ name: "", keys: [...windows.keys()] }];
    for (const g of groups) {
      if (g.name) box.append(el("div", "wgroup", g.name));
      for (const key of g.keys) {
        const w = windows.get(key);
        if (w) box.append(windowLine(w, p.retained));
      }
    }
    body.append(box);
  }
  if (rows.length) body.prepend(windowLine(null));
}
// One window's line in the usage drawer, or with none the column heads.
function windowLine(w, retained) {
  const line = el("div", "wline" + (w ? "" : " heads"));
  if (!w) {
    line.append(el("span"), el("span"), el("span", "n", "left"), el("span", "n", "resets"), el("span", "", "pace"));
    return line;
  }
  const left = Math.max(0, Math.min(100, w.remaining || 0)), sev = "sev-" + (w.severity || "unknown");
  const per = el("span", "per");
  per.append(el("span", "mark " + sev, w.binding ? "●" : ""), w.period || w.name);
  const bar = el("span", "bar"), fill = el("i", sev);
  fill.style.width = left + "%";
  bar.append(fill);
  const pace = w.pace || "";
  line.append(per, bar, el("span", "n", Math.round(left) + "%"), el("span", "n faint", w.resets_at > 0 ? resetShort(w.resets_at, retained) : "—"),
    el("span", pace.endsWith("too fast") ? sev : "faint", pace));
  return line;
}

function renderItem(item) {
  switch (item.kind) {
    case "user": {
      const d = el("div", "item user", item.text);
      const keys = item.image_keys || [];
      if (keys.length) {
        const row = el("div", "shots");
        for (const k of keys) {
          const img = el("img"); img.loading = "lazy"; img.decoding = "async"; img.alt = "Image"; img.src = imageUrl(k);
          img.onclick = () => showImage(imageUrl(k));
          row.append(img);
        }
        if (item.text) d.prepend(row); else d.append(row);
      } else if (item.images) d.append(" [" + item.images + " image(s)]");
      return d;
    }
    case "assistant": {
      const d = el("div", "item assistant");
      d.innerHTML = markdown(item.text, item.image_sources);
      for (const img of d.querySelectorAll("img.rimg")) img.onclick = () => showImage(img.src);
      return d;
    }
    case "tool": case "thought": {
      const wrap = el("div", "item");
      const b = el("button", "tool " + (item.status || ""));
      const name = el("span", "name", item.kind === "thought" ? "Thinking" : item.name);
      const a = item.agent;
      if (a) {
        // The agent opens on a tap; the rest of the row unfolds.
        const who = el("span", "who" + (a.known ? " link" : ""), a.title);
        if (a.known) who.onclick = (e) => { e.stopPropagation(); openAgent({ host: open.host, id: a.id, title: a.title }); };
        if (a.lead) b.append(who, name); else b.append(name, who);
      } else b.append(name);
      if (item.summary) b.append(el("span", "sum" + (a ? " prose" : ""), item.summary));
      wrap.append(b);
      const shown = details[item.id];
      if (shown) {
        const d = el("div", "detail" + (item.kind === "thought" ? " prose" : ""));
        for (const s of shown.sections) { if (s.title) d.append(el("h4", "", s.title)); d.append(el("pre", "", s.text)); }
        wrap.append(d);
      }
      if (item.detail) b.onclick = () => {
        if (details[item.id]) { delete details[item.id]; return drawConv(); }
        ask({ type: "detail", id: "conv", item: item.id }, (r) => { if (r.ok) details[item.id] = r.detail; drawConv(); });
      };
      return wrap;
    }
    case "todo": return el("div", "item small", item.label + " (" + item.done + "/" + item.total + ")");
    case "notice": return el("div", "item small", item.text);
    case "compaction": return el("div", "item small", "— " + item.label + " —");
    default: return el("div", "item small", item.kind);
  }
}

// ---- the composer ----------------------------------------------------------------------

function working() { return !!(views.conv && views.conv.fields.working); }
function elapsed() {
  const since = views.conv && views.conv.fields.working && views.conv.fields.working.since;
  return "Working" + (since ? " " + duration((Date.now() - Date.parse(since)) / 1000) : "");
}

function sizeDraft() {
  const d = $("draft");
  // Measured while hidden it would be 0 tall; empty, it is one line anyway.
  if (!d.value || !d.offsetParent) { d.style.height = ""; return; }
  d.style.height = "auto";
  d.style.height = Math.min(d.scrollHeight, window.innerHeight * 0.4) + "px";
}

// Redrawn only when what it shows changes, so its buttons stay put under
// a finger while the conversation streams.
let composerDrawn = "";
function drawComposer() {
  const v = views.conv;
  const busyNow = working();
  const drawn = JSON.stringify([open && open.id, busyNow, v && v.fields.queued, busy, failed]);
  if (drawn === composerDrawn) return;
  composerDrawn = drawn;
  const bar = $("working");
  bar.hidden = !busyNow;
  bar.innerHTML = "";
  if (busyNow) {
    bar.append(el("span", "elapsed", elapsed()));
    bar.append(button("Stop", "danger small", "stop", () => act("stop", { action: "stop", host: open.host, agent: open.id })));
  }
  if (failed.stop) bar.append(el("span", "error", failed.stop));
  const queue = $("queue");
  queue.innerHTML = "";
  for (const m of (v && v.fields.queued) || []) {
    const row = el("div", "queued" + (m.error ? " bad" : ""));
    row.append(el("span", "t", (m.error ? "Not sent: " : "Next: ") + m.text + (m.images ? " [" + m.images + " image(s)]" : "")));
    row.append(button("Steer", "plain small", "steer:" + m.id, () =>
      act("steer:" + m.id, { action: "steer", host: open.host, agent: open.id, message_id: m.id })));
    const drop = button("", "icon", "drop:" + m.id, () =>
      act("drop:" + m.id, { action: "unqueue", host: open.host, agent: open.id, message_id: m.id }));
    if (!busy["drop:" + m.id]) drop.innerHTML = icon("close", 14);
    drop.title = "Drop";
    row.append(drop);
    queue.append(row);
  }
  $("steer").hidden = !busyNow;
  $("steer").disabled = !!busy.send;
  $("send").disabled = !!busy.send || !!shrinking;
  $("send").title = busyNow ? "Queue: send when this turn ends" : "Send";
  $("send").setAttribute("aria-label", busyNow ? "Queue" : "Send");
  $("send-error").hidden = !failed.send;
  $("send-error").textContent = failed.send || "";
}

function sendAs(action) {
  const text = $("draft").value;
  if ((!text.trim() && !attached.length) || !open || shrinking) return;
  const message = { action, host: open.host, agent: open.id, text, message_id: newId() };
  if (attached.length) message.images = attached.map((a) => ({ data: a.data, mime_type: a.mime }));
  // What you send is what you want to see next.
  following = true;
  toEnd();
  act("send", message, (r) => {
    if (r.ok) { $("draft").value = ""; sizeDraft(); attached = []; drawAttached(); }
  });
}

// ---- images to send with a message --------------------------------------------------
// A phone photo is shrunk before it goes: the long side to 2000px, as JPEG,
// so a message stays a few hundred KB rather than many MB.

const MAX_SIDE = 2000, MAX_ATTACHED = 8;
let attached = [], shrinking = 0;

function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      // PNGs keep their edges, as screenshots need, while they are small.
      const png = file.type === "image/png" && file.size < 1500000;
      const mime = png ? "image/png" : "image/jpeg";
      const dataUrl = canvas.toDataURL(mime, 0.85);
      resolve({ mime, data: dataUrl.slice(dataUrl.indexOf(",") + 1), url: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read " + (file.name || "that image"))); };
    img.src = url;
  });
}

async function addFiles(files) {
  failed.send = "";
  for (const file of files) {
    if (!/^image\//.test(file.type)) continue;
    if (attached.length + shrinking >= MAX_ATTACHED) { failed.send = "At most " + MAX_ATTACHED + " images"; break; }
    shrinking++; drawAttached();
    try { attached.push(await shrink(file)); } catch (e) { failed.send = e.message; }
    shrinking--; drawAttached();
  }
  composerDrawn = ""; drawComposer();
}

function drawAttached() {
  const box = $("attached");
  box.hidden = !attached.length && !shrinking;
  box.innerHTML = "";
  attached.forEach((a, i) => {
    const t = el("div", "thumb"), img = el("img");
    img.src = a.url; img.alt = "";
    const x = el("button"); x.innerHTML = icon("close", 12); x.setAttribute("aria-label", "Remove image");
    x.onclick = () => { attached.splice(i, 1); drawAttached(); };
    t.append(img, x); box.append(t);
  });
  for (let i = 0; i < shrinking; i++) box.append(el("div", "thumb"));
  $("send").disabled = !!busy.send || !!shrinking;
}

// ---- settings and hosts sheets ------------------------------------------------------------

let sheet = null;
function showSheet(kind) { sheet = kind; removing = null; hostShown = null; adding = false; drawSheet(); }

// Adding and removing hosts. What is typed is kept here, so the sheet can
// redraw as hosts come and go without losing it. Addresses stay hidden
// until a host is tapped.
const hostForm = { name: "", endpoint: "", password: "" };
let removing = null, hostShown = null, adding = false;
function hostEditor(box) {
  box.append(el("h4", "", "Hosts"));
  for (const h of hosts) {
    const line = el("div", "hostedit");
    const d = el("span", "dots"); d.append(el("i", h.state)); line.append(d);
    const body = el("div", "body");
    body.append(el("div", "name", h.name));
    const shown = hostShown === h.name;
    if (shown) body.append(el("div", "addr", h.endpoint || ""));
    line.append(body);
    line.onclick = () => { hostShown = shown ? null : h.name; removing = null; drawSheet(); };
    const key = "host_remove:" + h.name;
    if (shown) {
      const sure = removing === h.name;
      line.append(button(sure ? "Remove?" : "Remove", "small" + (sure ? " danger" : ""), key, () => {
        if (!sure) { removing = h.name; return drawSheet(); }

        act(key, { action: "host_remove", name: h.name }, drawSheet);
      }));
    }
    box.append(line);
    if (failed[key]) box.append(el("div", "error", failed[key]));
  }
  if (!adding) {
    const row = el("div", "buttons");

    box.append(row);

  }
  const form = el("div", "hostadd");
  const field = (k, placeholder, type) => {
    const i = el("input"); i.placeholder = placeholder; i.value = hostForm[k]; i.autocomplete = "off";
    i.autocapitalize = "off"; i.spellcheck = false; if (type) i.type = type;

  const add = () => act("host_add", { action: "host_add", name: hostForm.name, endpoint: hostForm.endpoint, password: hostForm.password }, (r) => {

  });
  const row = el("div", "buttons");
  row.append(button("Cancel", "", "add-cancel", () => { adding = false; delete failed.host_add; drawSheet(); }));
  row.append(button("Add", "primary", "host_add", add));
  form.append(row);
  box.append(form);
  if (failed.host_add) box.append(el("div", "error", failed.host_add));
}
function drawSheet() {
  document.querySelectorAll(".sheet").forEach((s) => s.remove());
  if (!sheet) return;
  const wrap = el("div", "sheet");
  wrap.onclick = (e) => { if (e.target === wrap) { sheet = null; drawSheet(); } };
  const box = el("div", "box");
  if (sheet === "hosts") {
    for (const h of hosts) {
      const line = el("div", "hostline");
      const d = el("span", "dots"); d.append(el("i", h.state)); line.append(d);
      line.append(el("span", "name", h.name));

      line.append(el("span", "why", [since, h.agents + " agents", h.version, h.reason].filter(Boolean).join(" · ")));

    }
  } else {
    const s = el("div", "setting");
    s.append(el("div", "", "Notify on agent turns"));
    s.append(toggle("Notify on agent turns", settings.notify_default !== false, "settings",
      () => act("settings", { action: "settings", notify_default: settings.notify_default === false }, drawSheet)));
    box.append(s);
    // For every phone that has not chosen in its own filters.
    const bg = el("div", "setting");
    bg.append(el("div", "", "Show background workspaces"));
    bg.append(toggle("Show background workspaces", settings.show_background !== false, "settings-bg",
      () => act("settings-bg", { action: "settings", show_background: settings.show_background === false }, drawSheet)));
    box.append(bg);
    if (failed["settings-bg"]) box.append(el("div", "error", failed["settings-bg"]));
    if (failed.settings) box.append(el("div", "error", failed.settings));
    const sys = el("div", "setting");
    let secure = false;
    try { secure = "Notification" in window && window.isSecureContext !== false; } catch (e) {}
    if (secure) {
      const state = Notification.permission;
      sys.append(el("div", "", "System notifications: " +
        (allowed() ? "allowed" : state === "denied" ? "blocked" : "off")));
      if (state === "default") {
        const b = el("button", "primary", "Allow");
        b.onclick = () => { try { Notification.requestPermission().then(drawSheet, drawSheet); } catch (e) {} };
        sys.append(b);
      }
    } else {
      sys.append(el("div", "small", "System notifications need HTTPS."));
    }
    box.append(sys);

  const head = el("div", "sheethead");
  head.append(el("h3", "", sheet === "hosts" ? "Hosts" : "Settings"));
  const close = el("button", "", "Done");
  close.onclick = () => { sheet = null; drawSheet(); };
  head.append(close);
  box.prepend(head);
  wrap.append(box);
  document.body.append(wrap);
}

// ---- panels: a new agent, labels, confirmations -------------------------------------------
// Each draws from its own state, kept here, and only when that changes:
// what is typed is stored as it is typed, so nothing a delta does closes
// the keyboard or loses it, and a redraw puts the focus back.

let panel = null;          // {kind: "create" | "labels" | "confirm", key, ...}
const labelDrafts = {};    // a label editor's "New label" text, by editor

function showPanel(state) { panel = state; drawPanel(); }
function closePanel() { panel = null; drawPanel(); }

function drawPanel() {
  const old = document.querySelector(".panel");
  if (!panel) { if (old) old.remove(); return; }
  const active = document.activeElement;
  const focused = old && active && old.contains(active) ? active.dataset.f : null;
  let caret = null;
  try { caret = focused && active.selectionStart; } catch (e) {}
  const scroll = old ? old.querySelector(".pbody").scrollTop : 0;
  const wrap = el("div", "panel" + (panel.kind === "confirm" ? " small" : ""));
  wrap.onclick = (e) => { if (e.target === wrap && !busy[panel.key]) closePanel(); };
  const box = el("div", "box");
  box.setAttribute("role", "dialog");
  const head = el("div", "phead"), body = el("div", "pbody"), foot = el("div", "pfoot");
  if (panel.kind === "create") drawCreate(head, body, foot);
  else if (panel.kind === "labels") drawLabels(head, body, foot);
  else drawConfirm(head, body, foot);
  if (panel.kind !== "confirm") {
    const cancel = el("button", "", "Cancel");
    cancel.onclick = closePanel;
    head.append(cancel);
  }
  box.append(head, body, foot);
  wrap.append(box);
  if (old) old.replaceWith(wrap); else document.body.append(wrap);
  body.scrollTop = scroll;
  const again = focused && wrap.querySelector('[data-f="' + focused + '"]');
  if (again) { again.focus(); try { if (caret !== null) again.setSelectionRange(caret, caret); } catch (e) {} }
}

function field(box, label) { box.append(el("label", "f", label)); }
function select(name, options, value, onchange) {
  const s = el("select");
  s.dataset.f = name;
  for (const [v, label, disabled] of options) { const o = el("option", "", label); o.value = v; o.disabled = !!disabled; s.append(o); }
  s.value = value;
  s.onchange = () => onchange(s.value);
  return s;
}
function textField(tag, name, value, placeholder, oninput) {
  const t = el(tag);
  t.dataset.f = name; t.value = value; t.placeholder = placeholder;
  t.autocomplete = "off"; t.autocapitalize = "off"; t.spellcheck = tag === "textarea";
  t.oninput = () => oninput(t.value);
  return t;
}
function panelError(foot, key) { foot.append(failed[key] ? el("div", "error", failed[key]) : el("span", "grow")); }

// Labels, as chips to take off, the fleet's other labels to put on, and a
// new one by name. `chosen` is changed in place.
function labelEditor(box, chosen, editor) {
  const current = el("div", "chips edit");
  for (const name of chosen) {
    const chip = el("span", "chip big", name);
    const color = labelColor(name);
    if (color) chip.style.setProperty("--c", color);
    const x = el("button");
    x.innerHTML = icon("close", 12); x.setAttribute("aria-label", "Remove " + name);
    x.onclick = () => { chosen.splice(chosen.indexOf(name), 1); drawPanel(); };
    chip.append(x);
    current.append(chip);
  }
  if (!chosen.length) current.append(el("span", "small", "No labels"));
  box.append(current);
  const known = Object.values(labelColors).map((l) => l.name)
    .filter((n) => !chosen.some((c) => labelKey(c) === labelKey(n))).sort((a, b) => a.localeCompare(b));
  if (known.length) {
    const offer = el("div", "chips edit");
    for (const name of known) {
      const b = el("button", "chip add", name);
      const color = labelColor(name);
      if (color) b.style.setProperty("--c", color);
      b.onclick = () => { chosen.push(name); drawPanel(); };
      offer.append(b);
    }
    box.append(offer);
  }
  const row = el("div", "newlabel");
  const input = textField("input", editor + "-label", labelDrafts[editor] || "", "New label", (v) => { labelDrafts[editor] = v; });
  const add = () => { if (takeLabelDraft(chosen, editor)) drawPanel(); };
  input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
  const b = el("button", "", "Add");
  b.onclick = add;
  row.append(input, b);
  box.append(row);
}
// A label typed but not added yet counts: it is added before saving.
function takeLabelDraft(chosen, editor) {
  const name = (labelDrafts[editor] || "").split(/\s+/).filter(Boolean).join(" ");
  labelDrafts[editor] = "";
  if (!name) return false;
  if (!chosen.some((c) => labelKey(c) === labelKey(name))) chosen.push(name);
  return true;
}

// The new-agent form. Its choices come from Reef per host (the host's
// providers and workspaces); the last ones used on each host are kept.
const OTHER = "\u0000other";
// Its labels start as the workspace's default (those its agents share) and
// start again when the workspace changes; `labelsFor` is the one they are for.
const createForm = { host: "", provider: "", model: "", mode: "", thinking: "", workspace: "", cwd: "", labels: [], labelsFor: null, text: "" };
const createOptions = {};  // host -> {loading, error, data}

function remembered(host) { return ((prefs.create || {}).hosts || {})[host] || {}; }

function openCreate() {
  const online = hosts.filter((h) => h.state === "online");
  const last = (prefs.create || {}).host;
  const current = online.find((h) => h.name === createForm.host);
  const host = current || online.find((h) => h.name === last) || online[0] || hosts[0];
  delete failed.create;
  pickHost(host ? host.name : "");
  showPanel({ kind: "create", key: "create" });
}

function pickHost(host) {
  const r = remembered(host);
  Object.assign(createForm, { host, provider: r.provider || "", model: r.model || "", mode: r.mode || "",
    thinking: r.thinking || "", workspace: r.workspace || "", cwd: r.cwd || "" });
  if (host) loadOptions(host);
}

function loadOptions(host) {
  const known = createOptions[host] || {};
  if (known.loading) return;
  if (!ws || ws.readyState !== 1) { createOptions[host] = { error: "Offline", data: known.data }; return; }
  createOptions[host] = { loading: true, data: known.data };
  ask({ type: "create_options", host }, (r) => {
    createOptions[host] = r.ok ? { data: r } : { error: (r.error && r.error.message) || "Could not load the choices", data: known.data };
    if (panel && panel.kind === "create") drawPanel();
    if (open && open.host === host) drawSpec();
  });
}

// What the form shows: the choices made, else each one's default.
function createChoices() {
  const data = (createOptions[createForm.host] || {}).data;
  if (!data) return null;
  const f = createForm;
  const ready = data.providers.filter((p) => p.ready);
  const provider = ready.find((p) => p.id === f.provider) || ready.find((p) => p.id === "claude") || ready[0] || null;
  const models = (provider && provider.models) || [], modes = (provider && provider.modes) || [];
  const model = models.find((m) => m.id === f.model) || models.find((m) => m.default) || models[0] || null;
  const mode = modes.find((m) => m.id === f.mode) || modes.find((m) => m.id === provider.mode) || null;
  const thinkings = (model && model.thinking) || [];
  const thinking = thinkings.find((t) => t.id === f.thinking) || thinkings.find((t) => t.id === model.thinking_default) || thinkings[0] || null;
  const workspaces = data.workspaces || [];
  const other = f.workspace === OTHER || !workspaces.length;
  const workspace = other ? null : workspaces.find((w) => w.id === f.workspace) || workspaces[0];
  return { ready, unready: data.providers.filter((p) => !p.ready), provider, model, mode, thinking, workspaces, workspace, other };
}

function drawCreate(head, body, foot) {
  head.append(el("h3", "", "New agent"));
  body.classList.add("form");
  const f = createForm;
  field(body, "Host");
  body.append(select("host", hosts.map((h) => [h.name, h.name + (h.state === "online" ? "" : " (" + h.state + ")"), h.state !== "online"]),
    f.host, (v) => { pickHost(v); drawPanel(); }));
  const options = createOptions[f.host] || {};
  const c = createChoices();
  if (!f.host) body.append(el("div", "note", "Add a host first, in Settings."));
  else if (!c) body.append(el("div", options.error ? "error" : "note", options.error || "Loading providers..."));
  else if (!c.ready.length) body.append(el("div", "note", "No provider is ready on " + f.host + "."));
  if (c && c.provider) {
    const pick = (key) => (v) => { f[key] = v; if (key === "provider") f.model = f.mode = f.thinking = ""; if (key === "model") f.thinking = ""; drawPanel(); };
    const pair = el("div", "pair");
    const left = el("div"), right = el("div");
    field(left, "Provider");
    left.append(select("provider", c.ready.map((p) => [p.id, p.label]), c.provider.id, pick("provider")));
    field(right, "Model");
    right.append(select("model", c.provider.models.map((m) => [m.id, m.label]), c.model ? c.model.id : "", pick("model")));
    pair.append(left, right);
    body.append(pair);
    if (c.provider.modes.length || c.thinking) {
      const pair2 = el("div", "pair");
      if (c.provider.modes.length) {
        const box = el("div");
        field(box, "Mode");
        box.append(select("mode", c.provider.modes.map((m) => [m.id, m.label]), c.mode ? c.mode.id : "", pick("mode")));
        pair2.append(box);
      }
      if (c.thinking) {
        const box = el("div");
        field(box, "Thinking");
        box.append(select("thinking", c.model.thinking.map((t) => [t.id, t.label]), c.thinking.id, pick("thinking")));
        pair2.append(box);
      }
      body.append(pair2);
    }
    if (c.unready.length) body.append(el("div", "small", "Not ready here: " + c.unready.map((p) => p.label + " (" + p.status + ")").join(", ")));
  }
  if (c) {
    field(body, "Directory");
    const choices = c.workspaces.map((w) => [w.id, w.name + (w.project && w.project !== w.name ? " · " + w.project : "")]);
    choices.push([OTHER, "Another directory..."]);
    body.append(select("workspace", choices, c.other ? OTHER : c.workspace.id, (v) => { f.workspace = v; drawPanel(); }));
    if (c.other) {
      const cwd = textField("input", "cwd", f.cwd, "/path/on/" + f.host, (v) => { f.cwd = v; });
      cwd.className = "other";
      body.append(cwd);
    } else {
      body.append(el("div", "small", c.workspace.directory));
    }

    if (f.labelsFor !== place) { f.labels = defaultLabels(c); f.labelsFor = place; }
    field(body, "Labels");
    labelEditor(body, f.labels, "create");
    body.append(el("div", "small", "This agent's own. " + (c.other ? "" : "It starts with the labels this workspace's agents share.")));
    field(body, "First message");
    const text = textField("textarea", "text", f.text, "What should the agent do?", (v) => { f.text = v; });
    text.rows = 4; text.autocapitalize = "sentences";
    text.onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitCreate(); } };
    body.append(text);
  }
  panelError(foot, "create");
  const go = button("Create", "primary", "create", submitCreate);
  go.disabled = go.disabled || !c || !c.provider;
  foot.append(go);
}

function submitCreate() {
  const c = createChoices(), f = createForm;
  if (!c || !c.provider || busy.create) return;
  takeLabelDraft(f.labels, "create");
  const text = f.text.trim(), cwd = f.cwd.trim();
  failed.create = !text ? "Write what the agent should do" : c.other && !cwd ? "Type a directory on " + f.host : "";
  if (failed.create) return drawPanel();
  delete failed.create;
  const message = { action: "create", host: f.host, provider: c.provider.id, text, message_id: newId() };
  // Left as they started, Reef works the default out itself.
  const start = defaultLabels(c);
  const same = start.length === f.labels.length && f.labels.every((l) => start.some((s) => labelKey(s) === labelKey(l)));
  if (!same) message.labels = f.labels.slice();
  if (c.model) message.model = c.model.id;
  if (c.mode) message.mode = c.mode.id;
  if (c.thinking) message.thinking = c.thinking.id;
  if (c.other) message.cwd = cwd; else message.workspace = c.workspace.id;
  act("create", message, (r) => {
    if (!r.ok) return drawPanel();
    prefs.create = Object.assign({ hosts: {} }, prefs.create, { host: f.host });
    prefs.create.hosts[f.host] = { provider: message.provider, model: message.model, mode: message.mode, thinking: message.thinking,
      workspace: c.other ? OTHER : message.workspace, cwd: c.other ? cwd : "" };
    savePrefs();
    f.text = ""; f.labels = []; f.labelsFor = null;
    closePanel();
    if (r.labels_error) flash("Created, but not labelled", r.labels_error);
    const title = text.split("\n")[0];
    if (prefs.tab === "map") enterNear(r.key, null); else openAgent({ host: r.host, id: r.agent, title });
  });
  drawPanel();
}

function defaultLabels(c) { return c.other ? [] : [...(c.workspace.labels || [])]; }

}

// A banner of the page's own, styled as a notification.

// ---- the map ------------------------------------------------------------------------------
//
// A board of every agent you move around like a map, drawn differently at
// each distance. Far: each lane is a block of small tiles, blocks packed
// to fill this screen's own shape (an ordered squarified treemap, so a
// portrait phone stacks them and a desk spreads them out). Middle: one
// lane's agents as cards, a grid as wide as the screen. Near: one card
// opens into its live conversation. Tiles keep the order agents were made
// in, so places stay put; recent work glows instead of moving.

const mapState = { level: "far", lane: null, cam: { x: 0, y: 0, s: 1 }, layout: null, size: null,
  focusSent: "", near: null };
const tileEls = new Map(), blockEls = new Map();
const MID_CARD_W = 280, MID_CARD_H = 104, GAP = 8;

function mapView() { return views.map; }
function mapCards() {
  const cards = new Map();
  for (const c of (views.map && views.map.cards) || []) cards.set(c.key, c);
  return cards;
}

// Lanes in order, each sized by its agents: strips along the shorter
// side, each strip kept while it makes its blocks squarer.
function treemap(weights, W, H) {
  const total = weights.reduce((a, b) => a + b, 0) || 1;
  const areas = weights.map((w) => (w * W * H) / total);
  const worst = (row, side) => {
    const s = row.reduce((a, b) => a + b, 0);
    return Math.max(...row.map((r) => Math.max((side * side * r) / (s * s), (s * s) / (side * side * r))));
  };
  const rects = [];
  let x = 0, y = 0, w = W, h = H, i = 0;
  while (i < areas.length) {
    const side = Math.min(w, h);
    const row = [areas[i]];
    let j = i + 1, current = worst(row, side);
    while (j < areas.length) {
      const next = worst([...row, areas[j]], side);
      if (next > current) break;
      row.push(areas[j]); current = next; j++;
    }
    const sum = row.reduce((a, b) => a + b, 0), thick = sum / side;
    let off = 0;
    for (const a of row) {
      const len = a / thick;
      rects.push(w >= h ? { x, y: y + off, w: thick, h: len } : { x: x + off, y, w: len, h: thick });
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    i = j;
  }
  return rects;
}

function packMap() {
  const v = mapView();
  const box = $("map");
  const W = box.clientWidth, H = box.clientHeight;
  if (!v || !W || !H) return null;
  const lanes = v.fields.lanes || [];
  const byLane = new Map(lanes.map((l) => [l.key, []]));
  for (const t of v.parts) if (byLane.has(t.lane)) byLane.get(t.lane).push(t);
  const pad = 6;
  const rects = treemap(lanes.map((l) => (byLane.get(l.key).length || 1) + 3), W - pad * 2, H - pad * 2);
  const blocks = lanes.map((lane, i) => {
    const r = rects[i];
    const b = { key: lane.key, label: lane.label, x: r.x + pad + 3, y: r.y + pad + 3, w: Math.max(r.w - 6, 10), h: Math.max(r.h - 6, 10),
      tiles: byLane.get(lane.key) };
    const iw = b.w - 8, ih = b.h - 26, n = Math.max(b.tiles.length, 1);
    let t = Math.max(4, Math.floor(Math.sqrt((iw * ih) / n)));
    while (t > 4 && Math.floor(iw / t) * Math.floor(ih / t) < n) t--;
    b.tile = t; b.cols = Math.max(1, Math.floor(iw / t));

}

function camTransform(animate) {
  const board = $("board");
  board.classList.toggle("fly", !!animate);
  const c = mapState.cam;
  board.style.transform = "translate(" + c.x + "px," + c.y + "px) scale(" + c.s + ")";
  drawMinimap();
}

function clampCam() {
  const c = mapState.cam, L = mapState.layout;
  if (!L) return;
  c.s = Math.min(Math.max(c.s, 1), 12);
  const minX = L.W - L.W * c.s, minY = L.H - L.H * c.s;
  c.x = Math.min(0, Math.max(minX, c.x));
  c.y = Math.min(0, Math.max(minY, c.y));
}

function zoomAt(px, py, factor) {

  const s = Math.min(Math.max(c.s * factor, 1), 12);
  c.x = px - ((px - c.x) * s) / c.s;
  c.y = py - ((py - c.y) * s) / c.s;
  c.s = s;
  clampCam(); camTransform(false);
  // Close enough to one block: its cards take over.

function blockAt(px, py) {
  const c = mapState.cam, L = mapState.layout;
  if (!L) return null;
  const wx = (px - c.x) / c.s, wy = (py - c.y) / c.s;
  return L.blocks.find((b) => wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) || null;
}

function fresh(at) {
  const t = Date.parse(at + ":00Z");
  return t && Date.now() - t < 3 * 60000;
}

function drawFar() {
  const L = mapState.layout;
  const board = $("board");
  board.style.width = L.W + "px"; board.style.height = L.H + "px";
  const seenBlocks = new Set(), seenTiles = new Set();
  for (const b of L.blocks) {
    seenBlocks.add(b.key);
    let be = blockEls.get(b.key);
    if (!be) {
      be = el("div", "block"); be.append(el("div", "name"), el("div", "badge"));
      board.append(be); blockEls.set(b.key, be);
    }
    Object.assign(be.style, { left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px" });
    be.className = "block"; be.style.removeProperty("--c"); tint(be, groupColor(b.key));
    be.querySelector(".name").textContent = b.label + " · " + b.tiles.length;
    const waiting = b.tiles.filter((t) => t.ask || t.state === "needs_input" || t.state === "failed").length;
    const badge = be.querySelector(".badge");
    badge.hidden = !waiting; badge.textContent = waiting ? "!" + waiting : "";
    b.tiles.forEach((t, i) => {
      seenTiles.add(t.key);
      let te = tileEls.get(t.key);
      if (!te) { te = el("div"); board.append(te); tileEls.set(t.key, te); }
      const col = i % b.cols, row = Math.floor(i / b.cols);
      const size = Math.max(b.tile - 2, 2);
      te.className = "tile s-" + t.state + (t.ask && size >= 9 ? " ask" : "") + (fresh(t.at) ? " fresh" : "");
      Object.assign(te.style, { left: b.x + 4 + col * b.tile + "px", top: b.y + 22 + row * b.tile + "px",
        width: size + "px", height: size + "px" });

  }
  for (const [k, e] of blockEls) if (!seenBlocks.has(k)) { e.remove(); blockEls.delete(k); }
  for (const [k, e] of tileEls) if (!seenTiles.has(k)) { e.remove(); tileEls.delete(k); }
}

function midGeometry() {
  const W = $("map").clientWidth;
  const cols = Math.max(1, Math.floor((W - GAP) / (MID_CARD_W + GAP)));
  const cw = (W - GAP * (cols + 1)) / cols;

// A lane's cards: agents waiting on you, then working ones, then the rest,

const ACTIVE = { needs_input: 0, running: 1 };

  if (!b) return [];
  const rank = (t) => (t.state in ACTIVE ? ACTIVE[t.state] : 2);
  return [...b.tiles].sort((x, y) => rank(x) - rank(y) || (y.at || "").localeCompare(x.at || ""));

// Only the cards in view are drawn, and only theirs are asked for.
function drawMid() {
  const lane = $("lane");

  const { cols, cw } = midGeometry();

  if (!head) {
    head = el("div", "lanehead");
    space = el("div", "space"); space.style.position = "relative";
    lane.append(head, space);
  }
  const block = mapState.layout.blocks.find((b) => b.key === mapState.lane);
  head.innerHTML = "";
  const back = el("button", "plain"); back.innerHTML = icon("back", 20) + "All"; back.onclick = () => leaveMid();
  head.append(back, el("span", "", block ? block.label : ""), el("span", "n", String(tiles.length)));
  space.style.height = rows * (MID_CARD_H + GAP) + GAP + "px";
  const top = lane.scrollTop - 60, bottom = lane.scrollTop + lane.clientHeight;
  const cards = mapCards();
  const shown = [];
  space.innerHTML = "";
  tiles.forEach((t, i) => {
    const row = Math.floor(i / cols), col = i % cols;
    const y = GAP + row * (MID_CARD_H + GAP);
    if (y + MID_CARD_H < top - MID_CARD_H || y > bottom + MID_CARD_H) return;
    shown.push(t.agent);
    const c = cards.get(t.agent) || {};
    const card = el("div", "mcard");
    card.dataset.agent = t.agent;
    Object.assign(card.style, { left: GAP + col * (cw + GAP) + "px", top: y + "px", width: cw + "px", height: MID_CARD_H + "px" });
    const title = el("div", "title"); title.append(el("span", "dot s-" + t.state), el("span", "", c.title || "…"));
    card.append(title);

function drawMap() {
  if (prefs.tab !== "map") return;
  const box = $("map");
  const size = box.clientWidth + "x" + box.clientHeight;
  mapState.layout = packMap();
  if (!mapState.layout) return;
  // A new shape re-packs; the camera goes back to the whole map, or to the

    const b = mapState.level !== "far" && mapState.layout.blocks.find((x) => x.key === mapState.lane);
    mapState.cam = b ? laneCam(b) : { x: 0, y: 0, s: 1 };
    camTransform(false);
  }
  drawFar();
  $("lane").hidden = mapState.level === "far";
  if (mapState.level !== "far") drawMid();

  drawMinimap();

// The camera that fills the screen with one lane's block.
function laneCam(b) {
  const L = mapState.layout, s = Math.min(L.W / b.w, L.H / b.h);

  const lane = $("lane");
  lane.style.opacity = "0";
  mapState.level = "far";
  setTimeout(() => { lane.hidden = true; }, 200);
  mapState.cam = { x: 0, y: 0, s: 1 };
  camTransform(true);
  mapFocus([]);

function rectIn(elm) {
  const m = $("map").getBoundingClientRect(), r = elm.getBoundingClientRect();

// A card opens into its conversation where it is, and grows to fill the map.
function enterNear(agent, card) {
  const [host, id] = agent.split("/");

  const from = card ? rectIn(card) : { left: 40, top: 40, width: 200, height: 100 };
  Object.assign(near.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" });
  near.classList.remove("full");
  near.hidden = false;

  mapState.level = "near"; mapState.near = agent;

    Object.assign(near.style, { left: "0px", top: "0px", width: "100%", height: "100%" });
    near.classList.add("full");
  }, 16);

}

function leaveNear() {
  if (mapState.level !== "near") return;
  const near = $("near"), agent = mapState.near;
  const card = [...document.querySelectorAll(".mcard")].find((c) => c.dataset.agent === agent);
  const to = card ? rectIn(card) : { left: 40, top: 40, width: 200, height: 100 };
  near.classList.remove("full");
  Object.assign(near.style, { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" });
  mapState.level = mapState.lane ? "mid" : "far";
  setTimeout(() => {
    near.hidden = true;
    $("app").insertBefore($("convpane"), $("mappane"));
    openAgent(null);
    drawMap();
  }, 260);

// Leaving the map puts the conversation pane back where lists use it.
function leaveMap() {
  if (prefs.tab !== "map") return;
  if (mapState.level === "near") { $("near").hidden = true; $("app").insertBefore($("convpane"), $("mappane")); openAgent(null); }
  mapState.level = "far"; mapState.lane = null; $("lane").hidden = true;
}

function fitAll() {
  if (mapState.level === "near") leaveNear();
  if (mapState.level === "mid") leaveMid();
  mapState.cam = { x: 0, y: 0, s: 1 }; camTransform(true);
}

// A notification's card: its lane's cards, scrolled to it, flashing.
function flyTo(host, id) {
  const agent = host + "/" + id;
  const v = mapView();
  const tile = v && v.parts.find((t) => t.agent === agent);
  if (mapState.level === "near") leaveNear();
  if (!tile) return enterNear(agent, null);
  const show = () => {
    const tiles = laneTiles(), i = tiles.findIndex((t) => t.agent === agent);
    const { cols } = midGeometry();
    $("lane").scrollTop = Math.max(0, Math.floor(i / cols) * (MID_CARD_H + GAP) - 40);
    mapState.flash = agent; drawMid();
    setTimeout(() => { mapState.flash = null; }, 2600);
  };
  if (mapState.level === "mid" && mapState.lane === tile.lane) show();
  else setTimeout(() => enterMid(tile.lane, show), mapState.level === "near" ? 280 : 0);
}

$("lane").addEventListener("scroll", () => requestAnimationFrame(drawMid));
$("fit").onclick = fitAll;
$("minimap").addEventListener("pointerdown", (e) => {

  setTimeout(() => {
    goBack();
    // Put it back once what it was showing has gone.
    setTimeout(() => settle(target, true), 320);
  }, 200);
}, { passive: true });
function cancelSwipe() { if (swipe && swipe.dragging) settle(swipe.target, false); swipe = null; }
document.addEventListener("touchcancel", cancelSwipe, { passive: true });
function settle(target, gone) {
  slide(target, 0, !gone);
  setTimeout(() => {
    target.classList.remove("swiping");
    target.style.transition = "";
    if (target === $("convpane")) { $("app").classList.remove("peek"); drawChrome(); }
  }, gone ? 0 : 220);
}
new ResizeObserver(() => { if (prefs.tab === "map") drawMap(); }).observe($("map"));

// ---- wiring --------------------------------------------------------------------------------

$("gear").innerHTML = icon("gear");
$("usage").onclick = showUsage;
$("archive").innerHTML = icon("archive", 20);
$("delete").innerHTML = icon("trash", 20);
$("labels").innerHTML = icon("tag", 20);
$("new").innerHTML = icon("plus", 22);
$("close").innerHTML = icon("close", 20);
$("send").innerHTML = icon("arrow", 18);
$("back").innerHTML = icon("back", 26);
$("convmore").innerHTML = icon("more", 20);
$("convmore").onclick = (e) => { e.stopPropagation(); headFull = !headFull; fitHead(); };
new ResizeObserver(fitHead).observe($("convpane").querySelector(".convhead"));
$("add").innerHTML = icon("plus", 22);
$("gear").onclick = () => showSheet("settings");
$("dots").onclick = () => showSheet("hosts");
$("tab-ny").onclick = () => { leaveMap(); prefs.tab = "ny"; savePrefs(); delete views.list; subscribeList(); drawAll(); };
$("tab-all").onclick = () => { leaveMap(); prefs.tab = "all"; savePrefs(); delete views.list; subscribeList(); drawAll(); };
$("tab-map").onclick = () => { if (open) openAgent(null); prefs.tab = "map"; savePrefs(); mapState.size = null; subscribeList(); drawAll(); };
$("filters-toggle").onclick = () => { prefs.filters = !prefs.filters; savePrefs(); drawChrome(); };
$("back").onclick = goBack;
$("close").onclick = () => openAgent(null);
$("bell").onclick = () => { const a = views.conv && views.conv.fields.agent; if (a) toggleNotify(a); };
$("archive").onclick = () => confirmGone("archive");
$("delete").onclick = () => confirmGone("delete");
$("labels").onclick = openLabels;
$("convlabels").onclick = openLabels;
$("new").onclick = openCreate;
for (const id of ["group", "sort", "host", "label", "state", "background"]) {
  $(id).onchange = () => {
    prefs[id] = $(id).value; if (id === "group") prefs.groupChosen = true; prefs.more = {}; savePrefs();
    // The label filter offers Background only while it is shown.
    if (id === "background") fillSelects();
    delete views.list; subscribeList(); drawAll();
  };
}
let typing = null;
$("query").oninput = () => {
  clearTimeout(typing);
  typing = setTimeout(() => { prefs.query = $("query").value; savePrefs(); subscribeList(); }, 300);
};
$("draft").addEventListener("input", sizeDraft);
$("draft").addEventListener("keydown", (e) => {
  // At a desk, Enter sends and Shift+Enter is a new line; on a phone,
  // Enter is a new line and the arrow sends.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !coarse.matches) { e.preventDefault(); sendAs("send"); }
});
$("send").onclick = () => sendAs("send");
$("add").onclick = () => $("files").click();
$("files").onchange = () => { const files = [...$("files").files]; $("files").value = ""; addFiles(files); };
// Pasted images, at a desk.
$("draft").addEventListener("paste", (e) => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter((f) => /^image\//.test(f.type));
  if (files.length) { e.preventDefault(); addFiles(files); }
});
$("steer").onclick = () => sendAs("steer");
document.addEventListener("pointerdown", () => { pressing = true; }, true);
for (const end of ["pointerup", "pointercancel"]) {
  document.addEventListener(end, () => { pressing = false; setTimeout(payOwed, 0); }, true);
}
document.addEventListener("focusout", () => setTimeout(payOwed, 0));
let mode = layout();
const relayout = () => { const next = layout(); if (next !== mode) { mode = next; subscribeList(); } drawAll(); };
for (const q of [wide, wider]) { try { q.addEventListener("change", relayout); } catch (e) { q.addListener(relayout); } }
setInterval(() => send({ type: "ping", t: Date.now() }), 25000);
setInterval(() => { const e = document.querySelector("#working .elapsed"); if (e) e.textContent = elapsed(); }, 1000);
setInterval(drawChrome, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !ws) connect(); });
connect();
</script>
