# A drop-in for reef.service that adds options without touching the unit:
# here, a usage feed, so Reef's usage view also shows the accounts the feed
# reports (an http:// base URL serving /v1/usage).
#
#   sudo mkdir -p /etc/systemd/system/reef.service.d
#   sudo cp usage.conf /etc/systemd/system/reef.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart reef
#
# REEF_ARGS (HUB_ARGS before the rename) is split at spaces into separate
# options, so more can follow, such as --host-name reef.example for a name
# Reef is reached by.

[Service]
Environment="REEF_ARGS=--usage http://usage.example:8080"
