<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Skiff: the crusteo crab sailing a small boat, its sail striped in
       lane colours. Original artwork. -->
  <defs>
    <clipPath id="square"><rect width="64" height="64"/></clipPath>
    <clipPath id="sail"><path d="M33 0.5 L33 31 L59 31 Z"/></clipPath>
  </defs>
  <g clip-path="url(#square)">
    <g transform="translate(-1.92 1.47) scale(1.06)">
      <!-- Mast and sail. -->
      <path d="M33 -1.5 L33 34" stroke="#8a5a2b" stroke-width="2.4" stroke-linecap="round"/>
      <g clip-path="url(#sail)">
        <rect x="33" y="-4" width="5.2" height="40" fill="#1b8cfc"/>
        <rect x="38.2" y="-4" width="5.2" height="40" fill="#f1c81a"/>
        <rect x="43.4" y="-4" width="5.2" height="40" fill="#ff8a65"/>
        <rect x="48.6" y="-4" width="5.2" height="40" fill="#a13bc2"/>
        <rect x="53.8" y="-4" width="5.2" height="40" fill="#43b85c"/>
      </g>
      <path d="M33 0.5 L33 31 L59 31 Z" fill="none" stroke="#173a5e" stroke-width="1.4" stroke-linejoin="round"/>

      <!-- The crab, in the stern, one claw up. -->
      <g transform="translate(17 29.5) scale(1.18) translate(-18.5 -35)">
        <path d="M13 34 Q8 30 8 22" fill="none" stroke="#6e1a13" stroke-width="5" stroke-linecap="round"/>
        <path d="M13 34 Q8 30 8 22" fill="none" stroke="#ef5240" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M7.6 21 L6.8 14.6 A5.4 5.4 0 1 1 3.4 16.8 Z" fill="#ff6a52" stroke="#6e1a13" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M23 34 Q27 31 29 33" fill="none" stroke="#6e1a13" stroke-width="5" stroke-linecap="round"/>
        <path d="M23 34 Q27 31 29 33" fill="none" stroke="#ef5240" stroke-width="2.8" stroke-linecap="round"/>
        <ellipse cx="30" cy="33.5" rx="3.6" ry="2.8" fill="#ff6a52" stroke="#6e1a13" stroke-width="1.3"/>
        <path d="M16 31 L15 25" stroke="#6e1a13" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M21 31 L22 25" stroke="#6e1a13" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="14.8" cy="23.6" r="2.9" fill="#fff" stroke="#6e1a13" stroke-width="1.1"/>
        <circle cx="22.2" cy="23.6" r="2.9" fill="#fff" stroke="#6e1a13" stroke-width="1.1"/>
        <circle cx="15.6" cy="23.4" r="1.3" fill="#1b1d20"/>
        <circle cx="23" cy="23.4" r="1.3" fill="#1b1d20"/>
        <ellipse cx="18.5" cy="35" rx="9" ry="6" fill="#ff6a52" stroke="#6e1a13" stroke-width="1.6"/>
        <path d="M15.4 34.8 Q18.5 37.6 21.6 34.8" fill="none" stroke="#6e1a13" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- The hull. -->
      <path d="M1 34.5 L63 31 Q60 52 45 57 L14 57 Q3 54 1 34.5 Z" fill="#2f6fb3" stroke="#173a5e" stroke-width="2" stroke-linejoin="round"/>
      <path d="M2.4 39.4 L61.6 36" stroke="#ffffff" stroke-width="2.4" opacity="0.92"/>
    </g>

    <!-- The water, up the hull's side. -->
    <path d="M-4 55.4 Q1 52.4 6 55.4 T16 55.4 T26 55.4 T36 55.4 T46 55.4 T56 55.4 T66 55.4 L66 66 L-4 66 Z" fill="#62dcf5"/>
    <path d="M-4 55.4 Q1 52.4 6 55.4 T16 55.4 T26 55.4 T36 55.4 T46 55.4 T56 55.4 T66 55.4" fill="none" stroke="#e8fbff" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M6 60.5 Q10 59 14 60.5 M26 62.5 Q30 61 34 62.5 M44 60.5 Q48 59 52 60.5" fill="none" stroke="#e8fbff" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
