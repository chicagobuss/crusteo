name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-universal
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{print $2; exit}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      # GPUI's Metal shaders are compiled at runtime (gpui-kit enables the
      # `runtime_shaders` feature), so no Metal toolchain is needed here.
      - name: Build and package (macOS universal)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15.7"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/crusteo \
            target/aarch64-apple-darwin/release/crusteo \
            target/x86_64-apple-darwin/release/crusteo
          lipo -info target/universal/crusteo
          scripts/package-macos.sh target/universal/crusteo dist

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          scripts/package-linux.sh target/release/crusteo dist

      # Release builds compile GPUI's HLSL shaders with fxc.exe from the
      # Windows SDK, which the hosted runner provides.
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          ./scripts/package-windows.ps1 -Binary target/release/crusteo.exe -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: crusteo-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: crusteo-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi
          cat release-notes.md
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          name: Crusteo ${{ github.ref_name }}
          body_path: release-notes.md
          # A version with a pre-release part, such as 0.1.0-alpha.1, is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
